<!-- 示範頁：給老闆比較手機版「左邊分類、右邊商品」的四種排法。樣式的顏色、字型沿用首頁（下面第一個 style 是從 index.html 複製來的），
     商品資料讀 /data/site.json，點商品會開正式的商品頁。不列入搜尋。電腦上會用手機寬度顯示在中間。 -->

@font-face{font-family:'Noto Serif TC';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/noto-serif-tc-600.woff2') format('woff2');unicode-range:U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+20000-2FA1F}
:root{
  /* 信通家俱行設計系統 2.0。下面第一段是 2.0 的色票與尺寸，新寫的樣式請直接用這些名稱。
     第二段是舊的變數名稱，值改指向 2.0，舊樣式不用逐行改就會換成新配色。
     顏色對比都檢查過：文字在所有底色上 ≥4.5:1，控制項外框 ≥3:1。 */
  --bg:#faf6ef;
  --bg-sunken:#f3ebde;
  --surface:#fffdf9;
  --surface-hover:#ebe0cf;
  --photo-bg:#fffaf3; /* 跟後台上傳流程烤進照片裡的白底色一致(manage.html resizeImageToUniform)，避免照片邊緣出現色塊 */
  --border:#e2d6c3;
  --border-strong:#857560;
  --text:#221d18;
  --text-secondary:#5a4f43;
  --text-tertiary:#6e6253;
  --brand:#8a4520;
  --brand-hover:#6f3618;
  --brand-text:#8a4520;
  --brand-subtle:#f5e4d4;
  --on-brand:#fff;
  --moss:#4f5d3a;
  --moss-subtle:#e4ead8;
  --indigo:#34536b;
  --indigo-subtle:#dfe8ef;
  --ochre:#765609;
  --ochre-subtle:#f6e9c4;
  --danger-subtle:#f8e1dc;
  --line-green:#06803a; /* LINE 官方綠 var(--line-green) 配白字只有 2.3:1，用加深版（白字 5.1:1） */
  --line-green-press:#056a30;
  --focus:#34536b;
  --inverse-bg:#221d18;
  --inverse-text:#f6efe4;
  --inverse-text-secondary:#c9bba6;
  --inverse-accent:#e0915c;
  --radius-xs:4px;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --radius-xl:32px;
  --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(34,29,24,.08);
  --shadow-md:0 6px 20px rgba(34,29,24,.10);
  --shadow-lg:0 20px 48px rgba(34,29,24,.18);
  --control-sm:36px;
  --control-md:44px;
  --control-lg:52px;

  /* 舊名稱 → 2.0 */
  --charcoal:var(--text);
  --ink:var(--text);
  --muted:var(--text-secondary);
  --soft:var(--text-tertiary);
  --tan:var(--brand);
  --tan-on-dark:var(--inverse-accent);
  --tan-dark:var(--brand-text);
  --sage:var(--moss);
  --cream:var(--bg);
  --paper:var(--photo-bg);
  --line:var(--border);
  --white:#fff;
  --danger:#a3352a;
  --shadow:var(--shadow-md);
  --color-surface:var(--bg-sunken);
  --color-line-strong:var(--border-strong);
  --color-on-dark:var(--inverse-text);
  --color-on-dark-2:var(--inverse-text-secondary);
  --color-accent-tint:var(--brand-subtle);
  --color-accent-tint-2:#f0d3bb;
  --color-accent-2-tint:var(--moss-subtle);

  /* 標題用自行內嵌的 Noto Serif TC（瘦身版 HS Serif 優先），內文用裝置內建的中文字型（原因見 <head> 裡的字型說明），
     不套用新設計稿的 Caprasimo／Figtree／等寬字 */
  /* 粗細規則（整個前台一致）：
     標題字型 → 區塊標題、價格、店名 600；商品名稱 500；副標等次要標題 400。
     內文字型 → 一般 400、強調 600，不用 500：Windows 的微軟正黑體只有一般跟粗體兩種，
     500 在 Windows 上會變成一般字，跟蘋果裝置看起來不一樣。 */
  --font-heading:"HS Serif","Noto Serif TC",serif;
  --font-body:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
  --font-mono:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  font-size:15px;
  line-height:1.75;
}
body.lightbox-open{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
svg[data-icon]{stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%}
nav{
  position:fixed;
  inset:0 0 auto;
  z-index:100;
  height:62px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
  padding:0 36px;
  background:rgba(250,246,239,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
  transition:height .25s ease,box-shadow .25s ease,background .25s ease;
}
/* 往下捲超過一點距離就縮小、加深陰影，回到頂部時恢復原狀（見下面
   initNavScrollEffect） */
nav.nav--scrolled{
  height:52px;
  background:rgba(250,246,239,.98);
  box-shadow:0 8px 20px rgba(46,38,30,.09);
}
.nav-logo{
  font-family:var(--font-heading);
  font-size:18px;
  font-weight:600;
  letter-spacing:.08em;
  white-space:nowrap;
  justify-self:start;
  color:inherit;
  text-decoration:none;
  transition:font-size .25s ease;
}
nav.nav--scrolled .nav-logo{font-size:16px}
.nav-logo span{color:var(--tan)}
#navSearchBar{width:min(340px,32vw);min-width:0;margin:0;padding:7px 12px;justify-self:center}
.nav-links{display:flex;gap:20px;list-style:none;flex:none}
.nav-links a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
  letter-spacing:.04em;
  white-space:nowrap;
}
.nav-links a:hover{color:var(--tan-dark)}
.nav-hamburger{
  display:none;
  border:0;background:transparent;color:var(--charcoal);
  padding:6px;justify-self:end;
}
.nav-links-mobile{
  display:none;
  list-style:none;
  position:fixed;
  top:62px;left:0;right:0;
  z-index:99;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.1);
  padding:8px 0;
}
.nav-links-mobile.open{display:block}
.nav-links-mobile a{
  display:block;
  padding:14px 24px;
  color:var(--ink);
  text-decoration:none;
  font-size:15px;
  border-bottom:1px solid var(--line);
}
.nav-links-mobile li:last-child a{border-bottom:0}
.nav-links-mobile a:active{background:var(--cream)}
#hero{
  margin-top:62px;
  position:relative;
  overflow:hidden;
  background:var(--color-surface);
}
.hero-inner{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:44px;
  align-items:center;
  padding:64px 40px;
}
.hero-content{position:relative;z-index:1;max-width:560px;padding:0}
.hero-photo{
  aspect-ratio:1/1;
  border-radius:var(--radius-pill);
  background:var(--bg-sunken);
  animation:sk-breathe 1.6s ease-in-out infinite;
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
  overflow:hidden;
}
/* 圖片真的載入之後，圓圈改回原本的米白底色、停止呼吸——跟商品卡片、分類磚
   用的是同一套 sk-breathe 骨架屏效果，避免圖片還沒到之前圓圈只是死白一片 */
.hero-photo:has(img[src]:not([src=""])){
  background:var(--paper);
  animation:none;
}
/* 圖片出現時從 90% 慢慢放大到原尺寸（淡入 .4 秒、放大 1.6 秒） */
.hero-photo img{
  width:70%;height:70%;object-fit:contain;
  filter:saturate(.94) contrast(.97) brightness(1.02);
  opacity:0;
  transform:scale(.9);
  transition:opacity .4s ease,transform 1.6s cubic-bezier(.22,.8,.3,1);
}
.hero-photo img[src]:not([src=""]){opacity:1;transform:none}
/* 首頁大圖文字依序浮現：class 由 head 最後那段小 script 控制，字型載入完才播 */
@keyframes heroRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-pending .hero-content>*{opacity:0}
.hero-enter .hero-content>*{animation:heroRise .72s cubic-bezier(.16,.84,.44,1) both}
.hero-enter .hero-content>:nth-child(2){animation-delay:.11s}
.hero-enter .hero-content>:nth-child(3){animation-delay:.22s}
.hero-enter .hero-content>:nth-child(4){animation-delay:.33s}
.hero-enter .hero-content>:nth-child(5){animation-delay:.44s}
.hero-tag{
  display:block;
  color:var(--tan-dark);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.24em;
  margin-bottom:22px;
}
.hero-title{
  font-family:var(--font-heading);
  color:var(--ink);
  font-size:52px;
  font-weight:600;
  line-height:1.18;
  letter-spacing:.02em;
  margin-bottom:12px;
}
.hero-sub{
  color:var(--tan-dark);
  font-family:var(--font-heading);
  letter-spacing:.06em;
  margin-bottom:22px;
}
.hero-desc{
  color:var(--muted);
  max-width:450px;
  margin-bottom:34px;
  line-height:1.85;
}
.hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-line-cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#fff;
  background:var(--tan);
  text-decoration:none;
  border-radius:var(--radius-pill);
  padding:13px 24px;
  letter-spacing:.02em;
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow-md);
  transition:background .15s;
}
.hero-line-cta:hover{background:var(--tan-dark)}
#categories{padding-bottom:64px;scroll-margin-top:62px}

/* ── 捲動進場動畫：只加在區塊標題／卡片，不碰 #productsGrid 既有的
   grid-transition-in（篩選/搜尋切換動畫），兩者觸發時機不同、互不影響。
   預設就是可見（.reveal），JS 確認元素一開始就在畫面外才會加 will-reveal
   讓它變透明，避免 JS 失效或還沒執行完時整塊內容變成空白。 */
.reveal{opacity:1;transform:none}
@media(prefers-reduced-motion:no-preference){
  .reveal.will-reveal{opacity:0;transform:translateY(26px)}
  .reveal.will-reveal.is-visible{
    opacity:1;transform:translateY(0);
    transition:opacity .6s cubic-bezier(.16,.84,.44,1),transform .6s cubic-bezier(.16,.84,.44,1);
  }
}

/* ── 本月選品／分類磚（Phase 2）───────────────────────────── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.sec-head h2{font-family:var(--font-heading);font-size:20px;font-weight:600;color:var(--charcoal)}
.sec-head a{font-family:var(--font-mono);font-size:12px;color:var(--tan-dark);text-decoration:none}
.sec-head a:hover{color:var(--tan)}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-width:1200px;margin:0 auto}
.p-card{
  position:relative;display:flex;flex-direction:column;gap:11px;
  padding:14px;background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  text-decoration:none;color:inherit;cursor:pointer;
  transition:transform .22s ease,box-shadow .22s ease;
}
.p-card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 32px rgba(46,38,30,.14);
}
.p-card__media{position:relative;isolation:isolate;aspect-ratio:1/1;background:var(--color-card,var(--paper));border-radius:16px;overflow:hidden}
.p-card__media img{position:absolute;top:50%;left:50%;width:88%;height:88%;object-fit:contain;transform:translate(-50%,-50%);transition:opacity .34s ease,transform .34s ease}
.p-card__media .img-primary{opacity:1;z-index:1}
.p-card__media .img-secondary{opacity:0;z-index:2}
.p-card:hover .p-card__media .img-primary.has-secondary{opacity:0}
.p-card:hover .p-card__media .img-secondary{opacity:1;transform:translate(-50%,-50%) scale(1.03)}
.p-card:hover .p-card__media .img-primary:not(.has-secondary){transform:translate(-50%,-50%) scale(1.04)}
/* 本月選品卡片的字型跟下面全部商品列表的卡片一致：名稱用標題字型、尺寸用咖啡色小字、金額用標題字型（見 .product-name／.product-size／.product-price） */
.p-card__title{font-family:var(--font-heading);font-size:14.5px;font-weight:500;color:var(--charcoal);line-height:1.4}
/* 尺寸一行、金額另起一行靠右：擠同一行時窄卡片會把「$」跟數字拆到兩行。
   分隔線＋尺寸緊接商品名稱，金額推到卡片最底下，同一排卡片不管有沒有金額，
   分隔線跟尺寸都在同一高度（跟 #productsGrid 手機版 .product-price 同一套做法）。 */
.p-card__foot{display:flex;flex-direction:column;gap:2px;flex-grow:1;padding-top:9px;border-top:1px solid var(--line)}
.p-card__foot .mono{font-size:11px;line-height:1.35;color:var(--tan-dark)}
.p-card__foot .price{margin-top:auto;text-align:right;font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1.2;color:var(--tan-dark)}
.p-card__fav{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;
  border-radius:var(--radius-pill);background:rgba(249,244,237,.92);color:var(--tan-dark);
  display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s;
}
.p-card__fav svg{width:15px;height:15px}
.p-card__fav.active{background:var(--tan);color:#fff}
.p-card__fav.active svg path{fill:currentColor}
/* 標籤跟愛心都貼齊卡片內距（14px，跟下方商品名稱左緣對齊），標籤放在跟愛心
   同高的 30px 橫帶裡垂直置中，兩者中心線一致，看起來是同一排 */
.p-card__badge{position:absolute;top:14px;left:14px;height:30px;display:flex;align-items:center;z-index:6}

.cat-grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:18px;max-width:min(1200px,calc(var(--cols,5)*240px));margin:0 auto}
.cat-tile{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;
  border-radius:var(--radius-lg);background:var(--color-surface);text-align:center;
  text-decoration:none;color:inherit;cursor:pointer;transition:background .15s;border:0;
}
.cat-tile:hover{background:var(--surface-hover)}
.cat-tile__thumb{width:74px;height:74px;border-radius:var(--radius-pill);background:var(--paper);overflow:hidden;display:grid;place-items:center}
.cat-tile__thumb img{width:76%;height:76%;object-fit:contain;transition:opacity .34s ease}
/* 商品照片載入完成才淡入（見 fadeInOnLoad）；用 img 提高權重，蓋過 .img-primary 的 opacity:1。
   商品卡片的照片還沒載好時，照片位置先放一塊會呼吸的淡色底（.photo-skel，載好就拿掉）；
   載好後底色模糊淡出、照片從模糊變清楚淡入（動態參考 transitions.dev 的 Skeleton loader and reveal）。
   這塊底只在照片載入中才存在、模糊只有淡入那 0.4 秒，平常不會讓瀏覽器多算東西 */
img.img-fade:not(.is-loaded){opacity:0}
.photo-skel{position:absolute;inset:14%;z-index:0;border-radius:14px;background:var(--bg-sunken);pointer-events:none;animation:photo-skel-pulse 1s ease-in-out infinite}
@keyframes photo-skel-pulse{50%{opacity:.55}}
.cat-tile__name{font-family:var(--font-heading);font-size:14px;font-weight:600;color:var(--charcoal)}
.cat-tile__count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.cat-tile--cta{justify-content:center;background:var(--sage);color:#fff}
.cat-tile--cta:hover{background:var(--moss)}
.cat-tile--cta .cat-tile__name{color:#fff}
.cat-tile--cta span.cta-link{font-size:11.5px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.5)}
@media(max-width:860px){
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat-grid.odd .cat-tile--cta{grid-column:1/-1} /* 兩欄排不滿時，「不確定就問」那格佔整排，不會落單 */
  #picks,#catTiles{padding-left:18px!important;padding-right:18px!important}
}
/* ── 骨架屏佔位（本月選品／分類磚），在資料回來前就先撐好版面高度，避免版面跳動（CLS）──
   呼吸效果只動 opacity：顯示卡可以直接處理，不用每一格都重新繪製（原本是移動漸層背景
   background-position，每一幀都要重畫，PageSpeed 會列為「非合成的動畫」） */
.sk-line{
  height:11px;border-radius:5px;margin-top:9px;
  background:var(--bg-sunken);
  animation:sk-breathe 1.6s ease-in-out infinite;
}

.favorites-inquire-btn:hover{background:var(--line-green-press)}
.favorites-inquire-btn svg{flex-shrink:0}
.favorites-copy-btn{
  width:100%;padding:11px 16px;background:transparent;border:1px solid var(--color-line-strong);
  border-radius:var(--radius-pill);color:var(--charcoal);font-size:13px;cursor:pointer;
}
.favorites-copy-btn:hover{border-color:var(--tan);color:var(--tan-dark)}
.favorites-preview{padding:24px 22px;overflow:auto;flex:1}
.favorites-preview-check{display:flex;align-items:center;gap:8px;color:var(--sage);font-weight:600;font-size:14px;margin-bottom:16px}
.favorites-preview-bubble{
  background:var(--color-accent-2-tint,#e1eecc);color:var(--charcoal);
  border-radius:20px 20px 20px 6px;padding:16px 18px;font-size:13px;line-height:1.8;
  white-space:pre-line;margin-bottom:18px;
}
.favorites-preview-back{background:transparent;border:0;color:var(--tan-dark);font-size:13px;cursor:pointer;text-decoration:underline}
#contact{background:var(--charcoal);padding:80px 38px}
/* 左邊：標題＋一句話＋三個大按鈕；右邊：一行一項的聯繫資訊 */
.contact-inner{
  max-width:1080px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:56px;
  align-items:start;
}
.contact-heading{
  font-family:var(--font-heading);
  color:var(--white);
  font-size:27px;
  font-weight:600;
}
.contact-sub{color:rgba(255,255,255,.48);font-size:13px;letter-spacing:.08em;margin:6px 0 0}
.contact-lead{color:var(--inverse-text-secondary);font-size:15px;line-height:1.8;margin:18px 0 26px}
.contact-actions{display:flex;flex-wrap:wrap;gap:10px}
.contact-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 22px;border-radius:var(--radius-pill);
  border:1.5px solid rgba(255,255,255,.3);color:var(--inverse-text);
  font-size:14px;font-weight:600;letter-spacing:.02em;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s;
}
.contact-btn:hover{border-color:var(--inverse-text);background:rgba(255,255,255,.06)}
.contact-btn--primary{background:var(--brand);border-color:var(--brand);color:#fff}
.contact-btn--primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.contact-btn .contact-icon{width:18px;height:18px}
.contact-list{margin:0;border-top:1px solid rgba(255,255,255,.12)}
.contact-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center;padding:15px 2px;border-bottom:1px solid rgba(255,255,255,.12)}
.contact-row dt{display:flex;align-items:center;gap:9px;color:var(--tan-on-dark);font-size:13.5px;font-weight:600;letter-spacing:.04em}
.contact-row dt .contact-icon{width:17px;height:17px;flex:none;align-self:center}
.contact-row dd{margin:0;color:var(--inverse-text);font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.contact-row a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.28);transition:color .15s,border-color .15s}
.contact-row a:hover{color:var(--tan-on-dark);border-color:var(--tan-on-dark)}
footer{
  background:var(--charcoal);
  color:var(--color-on-dark-2);
  padding:22px 38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  font-size:12px;
}
footer a{color:var(--color-on-dark-2);transition:color .15s}
footer a:hover{color:var(--color-on-dark)}
.footer-brand{font-family:var(--font-heading);letter-spacing:.08em;color:var(--color-on-dark)}
.modal-overlay{
  display:flex;
  position:fixed;
  inset:0;
  z-index:240;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(34,29,24,.72);
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease,visibility 0s linear .2s;
}
.modal-overlay.open{
  opacity:1;
  visibility:visible;
  transition:opacity .2s ease;
}
.modal{
  width:min(590px,100%);
  max-height:92vh;
  overflow:hidden;
  background:var(--paper);
  border-radius:14px;
  position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
  transform:scale(.96);
  transition:transform .2s ease;
  display:flex;
  flex-direction:column;
}
.modal-overlay.open .modal{transform:scale(1)}
.modal-scroll{flex:1;min-height:0;overflow-y:auto;padding:32px}
.modal-title{
  font-family:var(--font-heading);
  font-size:21px;
  color:var(--charcoal);
  margin-bottom:22px;
}
.modal-close{
  position:absolute;
  top:14px;
  right:14px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:var(--muted);
  background:var(--bg-sunken);
}
.modal label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:.06em;
}
.modal input,.modal textarea,.modal select{
  width:100%;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--cream);
  color:var(--ink);
  padding:10px 12px;
  outline:none;
}
.modal textarea{min-height:78px;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--tan)}
/* 提示訊息：從下面浮上來，帶一點縮放和模糊；出現用 .35 秒、收起用比較快的 .25 秒
   （動態參考 transitions.dev 的 Toast） */
.toast{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:500;
  border-radius:8px;
  background:var(--charcoal);
  color:var(--white);
  padding:12px 18px;
  opacity:0;
  transform:translateY(16px) scale(.97);
  filter:blur(2px);
  pointer-events:none;
  transition:opacity .25s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1),filter .25s cubic-bezier(.22,1,.36,1);
  font-size:13px;
}
.toast.show{opacity:1;transform:none;filter:blur(0);transition-duration:.35s}
#lightbox{
  display:block;
  position:fixed;
  inset:0;
  z-index:600;
  background:var(--bg);
  color:var(--ink);
  overflow-y:auto;
  overscroll-behavior:contain;
  opacity:0;
  visibility:hidden;
  transition:opacity .22s ease,visibility 0s linear .22s;
}
#lightbox.open{
  opacity:1;
  visibility:visible;
  transition:opacity .22s ease;
}
@media(max-width:760px){
  #lightbox .lb-layout{transform:scale(.97);transition:transform .22s ease}
  #lightbox.open .lb-layout{transform:scale(1)}
}
/* 照片上的上一張／下一張箭頭（位置、大小在最後面「視覺 2.2」那段；「回商品列表」.lb-close 也在那裡） */
.lb-arrow{
  z-index:3;
  border-radius:50%;
  color:var(--charcoal);
  display:grid;
  place-items:center;
  font-size:27px;
  transform:translateY(-50%);
}
.lb-arrow:hover{background:var(--tan);color:var(--white)}
.lb-cat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.lb-cat-row .lb-product-cat{margin-bottom:0}
.lb-favorite{
  position:relative;
  border:1px solid var(--line);
  border-radius:50%;
  width:34px;height:34px;
  display:grid;place-items:center;
  background:var(--paper);
  color:var(--charcoal);
  flex-shrink:0;
  transition:background .15s,border-color .15s,color .15s;
}
.lb-favorite svg{width:16px;height:16px}
.lb-favorite:hover{border-color:var(--tan);color:var(--tan-dark)}
.lb-favorite.active{background:var(--danger);border-color:var(--danger);color:#fff}
.lb-favorite.active svg path{fill:currentColor}
.lb-stage{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:8px;
  cursor:zoom-in;
  /* 商品照片本身就是烤在 --paper 這個底色上傳的，燈箱框跟照片長寬比不同時
     兩側會露出底色——這裡改成跟照片一樣的實色，露出來的部分才會跟照片
     本身的留白無縫接在一起，而不是像現在半透明看起來灰灰一塊。 */
  background:var(--paper);
  display:flex;
  align-items:center;
  justify-content:center;
}
.lb-left{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-width:0;
}
.lb-layout{
  display:grid;
  align-items:start;
}
.lb-info{color:var(--muted)}
.lb-product-cat{font-size:12px;color:var(--tan-dark);letter-spacing:.1em;margin-bottom:8px}
.lb-product-title{font-family:var(--font-heading);font-size:28px;font-weight:500;color:var(--charcoal);line-height:1.25;margin-bottom:10px}
.lb-product-price{font-family:var(--font-heading);font-size:20px;color:var(--tan-dark);font-weight:600;margin-bottom:16px}
/* 特價期間：特價用紅色、原價劃掉；商品頁多一行特價到哪天 */
.price-now{color:var(--danger)}
/* 特價時原價跟特價排在同一行，原價加刪除線、字比較小（卡片上 16px 的金額配 10px 原價，最小 10px）；
   兩個金額各自不拆行，窄卡片放不下時原價整個換到下一行 */
.price-now,.price-was{white-space:nowrap}
.price-was{margin-left:6px;font-size:max(10px,calc(.75em - 4px));font-weight:400;color:var(--soft)}
.price-until{display:block;margin-top:2px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--soft)}
/* 商品頁的交期、顏色／款式（卡片上不顯示） */
.lb-badges{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.lb-badges .tag-badge{box-shadow:none}
.lb-lead{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;font-size:14px;color:var(--ink)}
.lb-product-price+.lb-lead{margin-top:-8px}
.lb-lead-k,.lb-opts-k{flex:none;font-size:12px;color:var(--tan-dark);letter-spacing:.12em}
.lb-opts{margin:0 0 16px}
.lb-opts-k{margin-bottom:8px}
.lb-opts-k span{color:var(--ink);letter-spacing:0}
.lb-opts-list{display:flex;flex-wrap:wrap;gap:8px}
.lb-opt{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.2;cursor:pointer}
.lb-opt:hover{border-color:var(--tan)}
.lb-opt.active{border-color:var(--tan-dark);box-shadow:inset 0 0 0 1px var(--tan-dark)}
.lb-opt-dot{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(32,30,29,.18)}
/* 購買須知（後台「購買須知」填的問答）：首頁聯繫區上面一整區（選單也有連結），點標題展開；商品頁不放 */
#buyInfo{padding:46px 40px 54px}
.buyinfo-inner{max-width:760px;margin:0 auto}
.buyinfo-title{font-family:var(--font-heading);font-size:20px;font-weight:600;color:var(--charcoal);margin-bottom:14px;text-align:center}
.buy-item{border-bottom:1px solid var(--line)}
.buy-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;font-weight:600;color:var(--ink)}
.buy-item summary::-webkit-details-marker{display:none}
.buy-item summary::after{content:"+";font-size:18px;line-height:1;color:var(--tan-dark);flex:none;transition:transform .2s ease}
.buy-item[open] summary::after{transform:rotate(45deg)}
.buy-item summary:focus-visible{outline:2px solid var(--tan);outline-offset:2px;border-radius:4px}
.buy-a{padding:0 2px 14px;color:var(--muted);line-height:1.8}
.buyinfo-ask{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px;color:var(--muted);font-size:14px;text-align:center}
.buyinfo-ask[hidden]{display:none}
.buyinfo-ask a{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:var(--line-green);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.buyinfo-ask a:hover{background:var(--line-green-press)}
.buyinfo-ask a:focus-visible{outline:3px solid var(--tan-dark);outline-offset:3px}
/* 同類商品：商品頁最下面，點了換成那件商品（上一頁會回到原本這件） */
.lb-similar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lb-sim{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
/* 照片整張縮進框裡、置中，四周留一點空（跟商品卡片一樣）：直式、橫式照片都不會被裁掉 */
.lb-sim-img{position:relative;aspect-ratio:1;border-radius:12px;background:var(--paper);overflow:hidden}
.lb-sim-img img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.lb-sim-name{font-size:13px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lb-sim-price{font-size:12.5px;font-weight:600;color:var(--tan-dark)}
.lb-sim:hover .lb-sim-name{color:var(--tan-dark)}
.lb-sim:focus-visible{outline:2px solid var(--tan);outline-offset:3px;border-radius:12px}
@media(max-width:760px){#buyInfo{padding:38px 18px 44px}}
.lb-product-note{font-size:14px;color:var(--muted)}
.lb-product-note b,.lb-product-note strong{font-weight:600} /* 後台說明裡的粗體跟網站其他強調字一樣用 600 */
.lb-product-note ul{margin:4px 0;padding-left:22px;list-style:disc}
.lb-product-note ol{margin:4px 0;padding-left:22px;list-style:decimal}
.lb-product-note li{margin:2px 0}
.lb-spec-title{font-size:12px;color:var(--tan-dark);letter-spacing:.12em;margin:18px 0 8px}
/* 「商品說明」標題上面一條淺灰線，把上面的尺寸跟商品說明分開 */
.lb-desc-title{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
/* 詳情頁的尺寸區塊（見 shop-render.js 的 productSizeHtml）：左邊線稿（dim-figures.js）標出寬／深／高的方向，
   右邊逐列寫數字，桌子、櫃架、板凳多一行「約幾尺」；椅子的座高那一列用品牌色標出來 */
.lb-dim{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center}
.lb-dim.no-fig{grid-template-columns:minmax(0,1fr)}
.lb-dim-fig svg{display:block;width:118px;height:auto}
.lb-dim-rows{display:grid}
.lb-dim-row{display:grid;grid-template-columns:2.2em minmax(0,1fr);column-gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.lb-dim-row:last-child{border-bottom:0}
.lb-dim-k{font-size:12.5px;color:var(--soft)}
.lb-dim-v{font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
.lb-dim-v small{font-size:12px;color:var(--soft);font-weight:400;margin-left:2px}
.lb-dim-chi{display:block;font-size:12px;color:var(--muted);font-weight:400;line-height:1.3}
.lb-dim-row.key .lb-dim-k,.lb-dim-row.key .lb-dim-v{color:var(--tan-dark);font-weight:600}
.lb-dim-adj{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--color-surface);color:var(--tan-dark);font-size:11px;font-weight:600;line-height:1.7;vertical-align:2px;white-space:nowrap}
.lb-dim-extra{margin-top:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-sunken);font-size:13px;color:var(--ink)}
.lb-dim-extra span{color:var(--soft);margin-right:6px}
.lb-dim-note{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);line-height:1.6;text-wrap:pretty}
.lb-dim-note .tag-badge{flex:none;margin-top:1px;box-shadow:none}
.lb-dim-ask{padding:14px;border-radius:8px;border:1px dashed var(--color-line-strong);background:var(--bg-sunken)}
.lb-dim-ask strong{display:block;font-family:var(--font-heading);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:2px}
.lb-dim-ask p{font-size:13.5px;color:var(--muted);text-wrap:pretty}
/* 360px 寬的手機（很多 Android）示意圖縮小一點，右邊的數字才不會太擠 */
@media(max-width:360px){
  .lb-dim{grid-template-columns:108px minmax(0,1fr);gap:12px}
  .lb-dim-fig svg{width:108px}
  .lb-dim-row{grid-template-columns:30px minmax(0,1fr)}
  .lb-dim-adj{margin-left:4px;padding:1px 6px}
}
.lb-stage.zoomed{cursor:zoom-in}
.lb-stage img{
  /* 燈箱先顯示縮圖、稍後換成原始畫質照片；固定 width/height:100% 讓兩種畫質
     都撐滿同一個框，不會因為縮圖的原始像素比較小而在換圖瞬間看起來「變大」 */
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:8px;
  transform-origin:center center;
  transition:transform .12s ease, transform-origin .08s ease, opacity .15s ease;
  user-select:none;
}
/* 切換到別的商品時，新照片還沒下載完之前先蓋住舊照片（背景跟照片一樣是
   --paper 底色，不會看起來像壞掉），避免使用者誤以為畫面卡在上一個商品 */
.lb-stage img.lb-img-loading{opacity:0}
/* 點商品卡片時照片從卡片飛進燈箱、關閉時飛回去（見 startLbFlipOpen／closeLightbox）。
   飛行中真正的燈箱照片先藏起來，由 .lb-fly 這張複本代替；手機版燈箱本來的
   97%→100% 縮放也先關掉，照片落點才會跟燈箱照片的位置完全對齊。 */
.lb-fly{position:fixed;z-index:610;background:var(--paper);overflow:hidden;pointer-events:none}
.lb-fly img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}
#lightbox.lb-flip .lb-stage{visibility:hidden}
#lightbox.lb-flip .lb-layout{transform:none!important;transition:none!important}
.lb-thumbs{
  display:flex;
  gap:10px;
  max-width:100%;
  overflow:auto;
  padding:2px 0;
}

@media(max-width:760px){
  nav{padding:0 12px;grid-template-columns:auto 1fr auto auto}
  .nav-links{display:none}
  .favorites-fab .fav-label{display:none}
  .favorites-fab{padding:9px 11px}
  .nav-hamburger{display:flex}
  .hero-inner{grid-template-columns:1fr;gap:26px;padding:36px 24px}
  .hero-content{padding:0;max-width:none}
  .hero-photo{aspect-ratio:4/3;border-radius:var(--radius-lg)}
  .hero-photo img{width:60%;height:60%}
  .hero-title{font-size:34px}
  .cat-toolbar{padding:28px 15px 0}
  .cat-layout{padding:0 15px;margin-top:14px}
  #navSearchBar{width:100%}
  #contact{padding:56px 22px}
  .contact-inner{grid-template-columns:minmax(0,1fr);gap:34px}
  .contact-actions{flex-direction:column}
  .contact-btn{width:100%;min-height:50px;font-size:15px}
  .contact-row{grid-template-columns:104px minmax(0,1fr);padding:14px 0}
  footer{padding:20px 22px}
  .modal-scroll{padding:28px 20px}
  .lb-hint{display:none}
}
/* ── 設計系統 2.0：元件樣式 ─────────────────────────────────────
   放在最後面，蓋過上面舊的寫法；色票和尺寸都來自 :root 的 2.0 變數。
   要退回舊版樣子：刪掉這一整段，再把 :root 換回舊色票即可。 */
:where(a,button,input,textarea,select,summary,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.nav-logo span{color:var(--brand-text)}
.nav-links a{font-size:14px;color:var(--text-secondary)}
.nav-links a:hover{color:var(--brand-text)}

/* 首頁主視覺 */
.hero-tag{font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.24em;color:var(--brand-text)}
.hero-title{font-size:56px;line-height:1.12}
.hero-sub{font-size:22px;color:var(--brand-text)}
.hero-desc{font-size:17px;line-height:1.8;color:var(--text-secondary)}
.hero-line-cta{min-height:var(--control-lg);padding:0 32px;font-size:15px}
.hero-line-cta{box-shadow:var(--shadow-sm)}
.hero-line-cta:hover{background:var(--brand-hover)}

/* 區塊標題 */
.sec-head{margin-bottom:24px}
.sec-head h2,.buyinfo-title,.listing-title{font-size:30px;line-height:1.3}
.sec-head a{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--brand-text)}
.sec-head a:hover{color:var(--brand-hover);text-decoration:underline;text-underline-offset:3px}

/* 本月選品卡片 */
/* 本月選品不另外包一張白卡片：米色背景上直接放照片框＋文字，只剩照片框一塊色塊，
   滑鼠移過去照片框浮起來（跟商品照片同一個底色，照片跟框融成一片） */
.p-card{padding:0;background:transparent;box-shadow:none;gap:12px}
.p-card:hover{box-shadow:none;transform:none}
.p-card__media{border-radius:var(--radius-lg);transition:transform .22s ease,box-shadow .22s ease}
.p-card:hover .p-card__media{box-shadow:var(--shadow-md)}
@media(prefers-reduced-motion:no-preference){.p-card:hover .p-card__media{transform:translateY(-3px)}}
.p-card__title,.p-card__foot{padding:0 2px}
.p-card__title{font-size:17px;line-height:1.45}
.p-card__foot{border-top:0;padding-top:2px}
.p-card__foot .mono{font-family:var(--font-body);font-size:12px;line-height:1.5;color:var(--text-tertiary)}
.p-card__foot .price{font-size:18px;color:var(--brand-text);font-variant-numeric:tabular-nums}
.p-card__fav{top:6px;right:6px;width:36px;height:36px;color:var(--text);background:rgba(255,253,249,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(46,38,30,.10)}
.p-card__fav svg{width:17px;height:17px}
.p-card__fav.active{color:var(--danger)}
.p-card__badge{top:6px;left:6px;height:36px}

/* 分類磚 */
.cat-tile{background:var(--bg-sunken);padding:20px 12px 16px}
.cat-tile__thumb{width:80px;height:80px}
.cat-tile__name{font-size:16px;line-height:1.3}
.cat-tile__count{font-family:var(--font-body);font-size:12px;color:var(--text-tertiary)}
.cat-tile--cta,.cat-tile--cta:hover{background:var(--moss)}
.cat-tile--cta:hover{filter:brightness(1.08)}
.cat-tile--cta .cat-tile__name{font-size:18px}

/* 搜尋框、篩選 */
.search-bar{border-color:var(--border-strong);background:var(--surface);color:var(--text-tertiary)}
.search-bar:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px var(--indigo-subtle)}
.search-bar input::placeholder{color:var(--text-tertiary)}
.cat-tab,.sub-tab{min-height:var(--control-sm);border-color:var(--border-strong);background:var(--surface);color:var(--text-secondary);font-weight:600}
.sub-tab{min-height:32px}
.cat-tab:hover,.sub-tab:hover{border-color:var(--text-secondary);color:var(--text)}
.cat-tab.active{background:var(--text);border-color:var(--text);color:var(--bg)}
.sub-tab.active{background:var(--brand-subtle);border-color:var(--brand-text);color:var(--brand-text)}
.tab-pill{background:var(--text)}
.sub-categories-bar>.tab-pill{background:var(--brand-subtle);box-shadow:inset 0 0 0 1px var(--brand-text)}
.has-pill>.cat-tab.active{color:var(--bg)}
.has-pill>.sub-tab.active{color:var(--brand-text)}
@media(min-width:761px){
  .cat-side-btn{font-size:14px;color:var(--text-secondary)}
  .cat-side-btn:hover{color:var(--text)}
  .cat-side-btn.active{background:var(--text);color:var(--bg)}
  .cat-sub-btn.active{color:var(--brand-text)}
}
.chip-applied{min-height:32px;background:var(--brand-subtle);color:var(--brand-text)}
.chip-clear-all{color:var(--brand-text);font-weight:600;text-underline-offset:3px}

/* 商品列表：桌面四欄、群組標題不用左邊色條 */
@media(min-width:761px){.product-card{width:25%}}
.products-section-head{background:var(--bg-sunken);border-left:0}
.product-info{padding:10px 14px 14px}
.product-name{font-size:17px;line-height:1.45}
.product-size{font-size:12px;line-height:1.5;color:var(--text-tertiary)}
.product-price{font-size:18px;color:var(--brand-text);font-variant-numeric:tabular-nums}
/* 愛心按鈕：半透明霧面玻璃（後面的照片微微透出來、模糊），本月選品跟商品列表一樣 */
.favorite-btn{width:36px;height:36px;border-radius:var(--radius-pill);color:var(--text);filter:none;background:rgba(255,253,249,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(46,38,30,.10)}
.favorite-btn svg{width:17px;height:17px}
.favorite-btn.active{color:var(--danger)}

/* 商品標籤（顏色由後台設定，這裡只統一形狀） */
.tag-badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;font-size:12px;line-height:1;letter-spacing:.04em;box-shadow:none}

/* 導覽列喜愛清單 */
.favorites-fab{min-height:var(--control-md);padding:0 14px 0 16px;font-size:14px;background:var(--bg-sunken)}
.favorites-count{min-width:22px;height:22px;font-family:var(--font-body);font-size:12px}

/* LINE 按鈕一律是藥丸形、52px 高 */
.favorites-inquire-btn{min-height:var(--control-lg);border-radius:var(--radius-pill)}
.buyinfo-ask a{min-height:var(--control-md)}

/* 對話框、表單、提示訊息 */
.modal{border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}
.modal-title{font-size:24px;font-weight:500;line-height:1.35}
.modal label{font-size:14px;font-weight:600;color:var(--text);letter-spacing:0}
.modal input,.modal textarea,.modal select{min-height:var(--control-md);border-color:var(--border-strong);border-radius:var(--radius-sm);background:var(--surface)}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--indigo-subtle)}
.toast{border-radius:var(--radius-sm);background:var(--inverse-bg);color:var(--inverse-text);box-shadow:var(--shadow-lg);font-size:14px}

/* 商品頁 */
.lb-product-title{font-size:24px;line-height:1.35}
.lb-product-price{font-size:26px;font-variant-numeric:tabular-nums}
.lb-dim-v{font-size:18px}

/* 購買須知、聯繫我們 */
.buy-item summary{padding:16px 4px}
.buy-a{color:var(--text-secondary);line-height:1.85}
#contact{background:var(--inverse-bg)}
.contact-heading{font-size:30px;line-height:1.3}
.contact-sub{color:var(--inverse-accent);font-size:12px;font-weight:600;letter-spacing:.24em}
.contact-row dd{color:var(--inverse-text)}

@media(max-width:760px){
  .hero-title{font-size:40px}
  .sec-head h2,.buyinfo-title,.listing-title,.contact-heading{font-size:24px}
  .favorites-fab{padding:0 12px}
}

/* ══ 視覺 2.1（2026-11）：蓋在上面所有規則之後的調整 ═══════════════════
   1. 標題（--font-heading）改用各裝置內建的黑體（蘋方／微軟正黑體／思源黑體），不再用筆畫細的明體；
      只有店名、首頁大標、載入中的店名保留明體（--font-brand，用的還是 fonts/ 裡瘦身過的 HS Serif）
   2. 小字放大加深；商品名稱中等粗細（500），左邊商品目錄跟分類按鈕粗體（600）
   3. 互動（JS 在檔案最後的 siteFx）：捲動進度條、首頁大圖跟著滑鼠微動、
      卡片滑過出現「看看這件」、回到頂端、手機底部的「已收藏 N 件」長條 */
:root{
  --font-brand:"HS Serif","Noto Serif TC",serif;
  --font-heading:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",system-ui,sans-serif;
  --text-secondary:#4f453a;
  --text-tertiary:#655a4c;
}
.nav-logo,.hero-title,.loading-breathe-text{font-family:var(--font-brand)}
.hero-title{font-size:58px;letter-spacing:.04em}
.hero-sub{font-size:19px;font-weight:600;letter-spacing:.1em}
.hero-desc{font-size:16px;color:var(--text-secondary)}
.hero-tag{font-size:12px;font-weight:600}

/* 區塊標題：加粗放大，前面一小段木色短線，進到畫面時短線拉長 */
.sec-head h2,.listing-title{font-size:26px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.sec-head h2::before,.listing-title::before{content:"";width:28px;height:3px;background:var(--brand);flex:none;transform-origin:left;transition:transform .7s cubic-bezier(.16,.84,.44,1) .15s}
.reveal.will-reveal:not(.is-visible) h2::before{transform:scaleX(0)}
.sec-head a{font-size:13.5px;font-weight:600}
.products-section-title{font-size:20px;letter-spacing:.06em}
.products-section-count{font-size:13px}

/* 商品卡片：名稱 16px 粗體、尺寸 12.5px 深色 */
/* 商品名稱用中等粗細（蘋果、Android 是 500；Windows 的微軟正黑體沒有 500，會顯示一般粗細） */
.p-card__title,.product-name{font-size:16px;font-weight:500;line-height:1.45;letter-spacing:.01em}
.product-size,.p-card__foot .mono{font-size:12.5px;color:var(--text-secondary)}
.product-price,.p-card__foot .price{font-size:17px}
.product-info{padding:11px 14px 13px}
.cat-tile__name{font-size:16px}
.cat-tile__count{font-size:12.5px;color:var(--text-secondary)}
/* 左邊的商品目錄、手機上方的分類按鈕：加粗放大，一眼看得到 */
.cat-side-btn{font-size:16px;font-weight:600;letter-spacing:.04em}
.cat-sub-btn{font-size:14.5px;font-weight:600}
.cat-side-btn .mono,.cat-sub-btn .mono{font-size:12.5px!important;font-weight:600;color:var(--text-tertiary)!important}
.cat-side-btn.active .mono{color:rgba(255,255,255,.75)!important}
.cat-tab{font-size:15.5px;font-weight:600}
.sub-tab{font-size:14.5px;font-weight:600}
.favorite-item-meta{font-size:12.5px}

/* 滑過商品：照片下緣滑出「看看這件 →」 */
.product-img-wrap::after,.p-card__media::after{
  content:"看看這件 →";position:absolute;left:50%;bottom:10px;z-index:5;
  padding:6px 14px;background:rgba(34,29,24,.86);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.06em;white-space:nowrap;border-radius:4px;
  opacity:0;transform:translate(-50%,10px);transition:opacity .22s ease,transform .22s ease;pointer-events:none;
}
@media(hover:hover){
  .product-card:hover .product-img-wrap::after,.p-card:hover .p-card__media::after{opacity:1;transform:translate(-50%,0)}
  .product-card:hover .img-zoom-hint{opacity:0}
  .product-card:hover .product-name,.p-card:hover .p-card__title{color:var(--brand)}
}
.product-name,.p-card__title{transition:color .18s ease}
/* 按下去有回饋 */
.hero-line-cta,.contact-btn,.cat-tile,.favorites-fab{transition:transform .14s ease,background .15s,border-color .15s,color .15s,box-shadow .2s}
.hero-line-cta:active,.contact-btn:active,.cat-tile:active,.favorites-fab:active,.product-card:active,.p-card:active{transform:scale(.97)}
@media(hover:hover){.cat-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}}

/* 首頁大圖：後面多一圈細線圓，跟著滑鼠往反方向微動 */
#hero{overflow:hidden}
.hero-photo{position:relative;overflow:visible;transform:translate(calc(var(--mx,0)*-10px),calc(var(--my,0)*-10px));transition:transform .5s cubic-bezier(.16,.84,.44,1)}
.hero-photo::before{content:"";position:absolute;inset:-22px;border:1.5px solid var(--border-strong,#cdbda3);border-radius:50%;transform:translate(calc(var(--mx,0)*26px),calc(var(--my,0)*26px));transition:transform .7s cubic-bezier(.16,.84,.44,1);pointer-events:none}
.hero-photo::after{content:"";position:absolute;right:4%;top:6%;width:44px;height:44px;border-radius:50%;background:var(--brand);opacity:.9;transform:translate(calc(var(--mx,0)*40px),calc(var(--my,0)*40px));transition:transform .9s cubic-bezier(.16,.84,.44,1);pointer-events:none}

/* 最上面的捲動進度條 */
.fx-progress{position:fixed;left:0;top:0;z-index:120;height:3px;width:100%;background:var(--brand);transform-origin:left;transform:scaleX(var(--p,0));pointer-events:none}
/* 回到頂端 */
.fx-top{
  position:fixed;right:20px;bottom:22px;z-index:90;width:46px;height:46px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);
  display:grid;place-items:center;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .25s,transform .25s,visibility 0s linear .25s,background .15s;
}
.fx-top.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.fx-top:hover{background:var(--bg-sunken)}
.fx-top svg{width:20px;height:20px}
/* 手機：捲過首頁大圖之後，底部浮出 LINE 詢問 */
.fx-line{
  position:fixed;left:16px;right:78px;bottom:22px;z-index:90;height:46px;display:none;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#fff;font-size:15px;font-weight:600;letter-spacing:.06em;border:0;border-radius:6px;box-shadow:0 8px 22px rgba(138,69,32,.32);
  opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .25s,transform .25s,visibility 0s linear .25s;
}
.fx-line.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
body.lightbox-open .fx-line,body.lightbox-open .fx-top{display:none!important}
@media(max-width:860px){
  .hero-title{font-size:40px}
  .sec-head h2,.listing-title{font-size:22px}
  .sec-head h2::before,.listing-title::before{width:20px}
  .p-card__title,.product-name{font-size:15px}
  .fx-line{display:flex}
  .hero-photo::before{display:none}
  .hero-photo::after{width:30px;height:30px}
}
/* 手機兩欄版面（760px 以下，跟商品格換成兩欄的寬度一致）：卡片小，照片跟品名看起來離太遠，把間距收緊。
   - 商品列表：拿掉文字區的上邊距，再往上移 5px。照片在框裡四周本來就留了 5px 空白（.product-img-wrap img 的 padding），
     所以這 5px 不管照片長怎樣（去背照、實拍照、商品頂到底）都不會蓋到照片；要改這個數字，兩邊要一起改。
   - 本月選品：照片有自己的圓角底色框，文字不疊進去，只把跟品名的間距從 12px 收到 6px
     （用負的 margin，不動 .p-card 的 gap，載入中的骨架卡片才不會擠在一起）。 */
@media(max-width:760px){
  .product-info{padding-top:0;margin-top:-5px;position:relative;z-index:3}
  .p-card:not(.skeleton) .p-card__title{margin-top:-6px}
}
/* 商品詳情：說明文字放大、加粗、用最深的字色（原本 14px、一般粗細、灰棕色，看起來太淡）。
   500 在蘋果、Android 是中等粗細；Windows 的微軟正黑體沒有 500，會顯示一般粗細，所以顏色也一起加深 */
.lb-product-note{font-size:15.5px;font-weight:500;color:var(--ink);line-height:1.8}
.lb-product-note b,.lb-product-note strong{font-weight:700}
.lb-spec-title{font-size:13.5px;font-weight:600}
.lb-dim-k{font-size:13.5px;font-weight:500;color:var(--text-secondary)}
.lb-dim-extra,.lb-dim-note{font-size:14px;font-weight:500}
.lb-dim-extra span{color:var(--text-secondary)}
/* ══ 視覺 2.2（2026-11）：商品詳情從「暗色背景上的彈出視窗」改成「整頁式」═══════════
   點商品像換到另一頁：最上面一條固定的「回商品列表」，電腦左邊大照片固定不動、右邊資訊跟著頁面捲；
   手機照片滿版在上、資訊在下。HTML 結構見 #lightbox（照片箭頭、張數移進 .lb-stage-wrap 疊在照片上）。
   換照片的方式沒變：照片兩側箭頭、下面的小圖、鍵盤左右鍵、手機左右滑（lbNav）。 */
.lb-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,calc((100% - 1180px)/2 + 24px));background:rgba(250,246,239,.96);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lb-close{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:14.5px;font-weight:600;color:var(--text)}
.lb-close:hover{background:var(--bg-sunken);color:var(--text)}
.lb-layout{width:min(1180px,100%);margin:0 auto;padding:28px 24px 72px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px}
.lb-left{position:sticky;top:86px}
.lb-stage-wrap{position:relative}
.lb-stage{aspect-ratio:1/1;max-height:calc(100vh - 210px);border:1px solid var(--line)}
.lb-arrow{position:absolute;top:50%;width:44px;height:44px;border:1px solid var(--line);background:rgba(255,253,249,.94);box-shadow:var(--shadow-sm)}
#lbPrev{left:12px}
#lbNext{right:12px}
.lb-counter{position:absolute;right:12px;bottom:12px;z-index:2;padding:3px 10px;border-radius:999px;background:rgba(34,29,24,.72);color:#fff;font-size:12.5px;font-variant-numeric:tabular-nums;pointer-events:none}
.lb-counter:empty{display:none}
.lb-thumb{width:68px;height:68px;flex:none;object-fit:contain;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;cursor:pointer}
.lb-thumb:hover{border-color:var(--brand)}
.lb-thumb.active{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.lb-hint{font-size:12.5px;color:var(--text-tertiary)}
.lb-thumbs:empty+.lb-hint{display:none} /* 只有一張照片就不用說明怎麼換照片 */
.lb-product-title{font-size:30px}
@media(max-width:760px){
  .lb-bar{padding:8px 12px}
  .lb-layout{width:100%;margin:0;padding:0 0 72px;grid-template-columns:minmax(0,1fr);gap:0}
  .lb-left{position:static;gap:0}
  .lb-stage{max-height:none;border:0;border-bottom:1px solid var(--line);border-radius:0}
  .lb-stage img{border-radius:0}
  .lb-arrow{width:40px;height:40px}
  .lb-thumbs{padding:12px 16px 0}
  .lb-thumb{width:60px;height:60px}
  .lb-info{padding:18px 18px 0}
  .lb-product-title{font-size:24px}
}
/* ── 詢問方式：不到處放 LINE 按鈕，引導客人先收藏、再從收藏清單一次問（規則說明在 shop-render.js 的 askListHtml 上面）── */
.lb-bar-fav{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 12px 0 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:14.5px;font-weight:600}
.lb-bar-fav:hover{background:var(--bg-sunken)}
.lb-ask{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:8px;background:#fff}
.lb-ask-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:var(--control-lg);padding:0 18px;border:0;border-radius:6px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;letter-spacing:.04em;transition:background .15s,transform .14s}
.lb-ask-btn svg{width:19px;height:19px;flex:none}
.lb-ask-btn:hover{background:var(--brand-hover,#743a1b)}
.lb-ask-btn:active{transform:scale(.98)}
.lb-ask-btn.is-added{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.lb-ask-btn.is-added svg path{fill:currentColor}
.lb-ask-btn.is-added:hover{background:var(--brand-subtle)}
.lb-ask-note{margin-top:10px;font-size:13.5px;line-height:1.7;color:var(--text-secondary)}
.lb-ask-note strong{font-weight:600;color:var(--text)}
button.cat-tile{font:inherit;width:100%}
/* 按愛心之後的小提示（favSnack）：在商品頁（z-index 600）上面、收藏清單（620）下面 */

<style id="demoSide">
/* ── 手機版「左分類、右商品」排版示範（demo.html 專用）── */
html,body{height:100%}
body{background:#e9e2d6;overflow:hidden}
.sd-phone{max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(34,29,24,.18)}
.sd-top{flex:none;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:rgba(250,246,239,.97)}
.sd-top h1{font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px}
.sd-top h1 small{font-size:12px;font-weight:400;color:var(--text-tertiary);margin-left:6px}
.sd-modes{display:flex;gap:6px}
.sd-modes button{flex:1 1 0;padding:7px 2px;border:1.5px solid var(--border-strong,#cdbda3);background:#fff;color:var(--text);font-size:13px;font-weight:600;border-radius:6px;line-height:1.25}
.sd-modes button b{display:block;font-size:11px;color:var(--brand);letter-spacing:.08em}
.sd-modes button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.sd-modes button[aria-pressed="true"] b{color:#f0d3bb}
.sd-note{margin-top:7px;font-size:12.5px;line-height:1.55;color:var(--text-secondary)}
.sd-body{flex:1;min-height:0;display:grid;grid-template-columns:var(--rail,86px) minmax(0,1fr)}
.sd-rail{overflow-y:auto;overscroll-behavior:contain;background:var(--bg-sunken);border-right:1px solid var(--line);scrollbar-width:none}
.sd-rail::-webkit-scrollbar{display:none}
.sd-main{overflow-y:auto;overscroll-behavior:contain;background:var(--bg);scroll-behavior:smooth}
/* 左邊的分類鈕（共用） */
.sd-cat{position:relative;display:block;width:100%;padding:15px 6px 15px 10px;border:0;border-bottom:1px solid rgba(226,214,195,.6);background:transparent;color:var(--text-secondary);font-size:14.5px;font-weight:600;line-height:1.35;text-align:left}
.sd-cat small{display:block;margin-top:2px;font-size:11.5px;font-weight:400;color:var(--text-tertiary)}
.sd-cat[aria-current="true"]{background:var(--bg);color:var(--text)}
.sd-cat[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--brand)}
/* 右邊（共用） */
.sd-head{position:sticky;top:0;z-index:3;display:flex;align-items:baseline;gap:8px;padding:11px 12px 9px;background:rgba(250,246,239,.97);border-bottom:1px solid var(--line)}
.sd-head h2{font-size:17px;font-weight:600;color:var(--text)}
.sd-head span{font-size:12.5px;color:var(--brand)}
.sd-chips{display:flex;gap:6px;overflow-x:auto;padding:9px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.sd-chips::-webkit-scrollbar{display:none}
.sd-chips button{flex:none;padding:6px 12px;border:1px solid var(--border-strong,#cdbda3);border-radius:999px;background:#fff;color:var(--text-secondary);font-size:13px;font-weight:600}
.sd-chips button[aria-pressed="true"]{background:var(--brand-subtle);border-color:var(--brand);color:var(--brand)}
.sd-item{display:block;color:inherit;text-decoration:none}
.sd-item .ph{display:block;aspect-ratio:1/1;background:var(--photo-bg,#fffaf3);overflow:hidden}
.sd-item .ph img{display:block;width:100%;height:100%;object-fit:contain}
.sd-item .nm{display:block;font-size:14.5px;font-weight:500;color:var(--text);line-height:1.4}
.sd-item .sz{display:block;margin-top:2px;font-size:12px;color:var(--text-secondary);line-height:1.4}
.sd-item .pr{display:block;margin-top:3px;font-size:15px;font-weight:600;color:var(--brand)}
.sd-empty{padding:40px 16px;text-align:center;font-size:13.5px;color:var(--text-tertiary)}
/* A：窄側欄＋右邊兩欄小卡 */
.m-a .sd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-left:0}
.m-a .sd-item{padding:0 0 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.m-a .sd-item:nth-child(2n){border-right:0}
.m-a .sd-item .tx{display:block;padding:6px 9px 0}
.m-a .sd-item .nm{font-size:13.5px}
.m-a .sd-item .sz{font-size:11.5px}
/* B：窄側欄＋右邊一列一件（照片在左、字在右，字最大） */
.m-b .sd-item{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.m-b .sd-item .ph{border:1px solid var(--line);border-radius:6px}
.m-b .sd-item .nm{font-size:16px}
.m-b .sd-item .sz{font-size:13px}
.m-b .sd-item .go{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--brand)}
/* C：圖示側欄＋右邊全部分類連續往下捲，左邊跟著亮（像外送菜單） */
.m-c{--rail:78px}
.m-c .sd-cat{padding:10px 4px;text-align:center;font-size:13px}
.m-c .sd-cat .ic{display:block;width:50px;height:50px;margin:0 auto 5px;border-radius:50%;background:var(--photo-bg,#fffaf3);overflow:hidden;border:1.5px solid transparent}
.m-c .sd-cat .ic img{width:100%;height:100%;object-fit:contain}
.m-c .sd-cat[aria-current="true"] .ic{border-color:var(--brand)}
.m-c .sd-sec{scroll-margin-top:0}
.m-c .sd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.m-c .sd-item{padding:0 0 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.m-c .sd-item:nth-child(2n){border-right:0}
.m-c .sd-item .tx{display:block;padding:6px 9px 0}
.m-c .sd-item .nm{font-size:13.5px}
.m-c .sd-item .sz{font-size:11.5px}
.m-c .sd-sub{padding:8px 12px 6px;font-size:13px;font-weight:600;color:var(--brand);background:var(--bg-sunken);border-bottom:1px solid var(--line)}
/* D：兩層側欄（大分類點開有小分類）＋右邊一件一張大照片 */
.m-d{--rail:104px}
.m-d .sd-cat{padding:13px 6px 13px 12px}
.m-d .sd-cat::after{content:"＋";position:absolute;right:8px;top:14px;font-size:12px;color:var(--text-tertiary)}
.m-d .sd-cat.open::after{content:"－"}
.m-d .sd-subs{display:none;background:var(--bg);border-bottom:1px solid rgba(226,214,195,.6)}
.m-d .sd-cat.open+.sd-subs{display:block}
.m-d .sd-subs button{position:relative;display:block;width:100%;padding:10px 6px 10px 20px;border:0;background:transparent;color:var(--text-secondary);font-size:13.5px;text-align:left;line-height:1.3}
.m-d .sd-subs button[aria-current="true"]{color:var(--brand);font-weight:600}
.m-d .sd-subs button[aria-current="true"]::before{content:"";position:absolute;left:9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--brand)}
.m-d .sd-item{padding:0 0 14px;border-bottom:8px solid var(--bg-sunken)}
.m-d .sd-item .ph{aspect-ratio:4/3}
.m-d .sd-item .tx{display:block;padding:10px 14px 0}
.m-d .sd-item .nm{font-size:17px}
.m-d .sd-item .sz{font-size:13px}
</style>
</head>
<body>
<div class="sd-phone">
  <header class="sd-top">
    <h1>手機版排版示範<small>左邊分類・右邊商品</small></h1>
    <div class="sd-modes">
      <button type="button" data-mode="a"><b>A</b>兩欄小卡</button>
      <button type="button" data-mode="b"><b>B</b>一列一件</button>
      <button type="button" data-mode="c"><b>C</b>連續捲動</button>
      <button type="button" data-mode="d"><b>D</b>兩層分類</button>
    </div>
    <p class="sd-note" id="sdNote"></p>
  </header>
  <div class="sd-body m-a" id="sdBody">
    <div class="sd-rail" id="sdRail" role="navigation" aria-label="商品分類"></div><!-- 不用 nav 標籤：首頁樣式裡 nav 是固定在頂端的導覽列 -->
    <div class="sd-main" id="sdMain"></div>
  </div>
</div>
<script type="module">
import{escapeHTML,normalizeProduct,isListedProduct,catalogOrderCompare,normalizePhotoUrl,getSizeSummary,photoAlt,productPath,priceHtml}from"/shop-render.js?v=12";
const MODES={
  a:{note:"左邊一排大分類，右邊兩欄小卡。跟現在的商品卡最像，一個畫面看到的商品最多；上面一排小分類可以再篩。"},
  b:{note:"左邊大分類，右邊一列一件：照片在左、品名和尺寸在右。字最大最好讀，適合長輩客人，但一個畫面看到的件數比較少。"},
  c:{note:"像外送 App 的菜單：右邊全部分類一路往下捲，捲到哪一類左邊就亮哪一類；點左邊直接跳到那一類。不用一直切換，適合隨意逛。"},
  d:{note:"左邊兩層：點大分類展開小分類，直接選到「藤椅」「摺疊桌」這一層。右邊一件一張大照片，照片看得最清楚。"}
};
const $=s=>document.querySelector(s);
const site=await fetch("/data/site.json").then(r=>r.json());
const catalog=site.meta.catalog;
const all=site.products.map(normalizeProduct).filter(p=>isListedProduct(p,catalog)).sort(catalogOrderCompare(catalog));
const mains=catalog.map(c=>({...c,items:all.filter(p=>p.mainCat===c.id),subs:(c.subs||[]).map(s=>({...s,items:all.filter(p=>p.mainCat===c.id&&p.subCat===s.id)})).filter(s=>s.items.length)})).filter(c=>c.items.length);
const body=$("#sdBody"),rail=$("#sdRail"),main=$("#sdMain");
let mode="a",cur=mains[0].id,sub="",spy=null;
const item=(p,go=false)=>{
  const price=priceHtml(p);
  return `<a class="sd-item" href="${escapeHTML(productPath(p.id))}"><span class="ph">${p.photos?.[0]?`<img loading="lazy" src="${escapeHTML(normalizePhotoUrl(p.photos[0],500))}" alt="${escapeHTML(photoAlt(p,catalog))}">`:""}</span><span class="tx"><span class="nm">${escapeHTML(p.name||"")}</span><span class="sz">${escapeHTML(getSizeSummary(p))}</span>${price?`<span class="pr">${price}</span>`:""}${go?`<span class="go">看詳細 →</span>`:""}</span></a>`;
};
const head=(name,n)=>`<div class="sd-head"><h2>${escapeHTML(name)}</h2><span>${n} 件</span></div>`;
function renderRail(){
  if(mode==="d"){
    rail.innerHTML=mains.map(c=>`<button type="button" class="sd-cat${c.id===cur?" open":""}" data-main="${c.id}" aria-current="${c.id===cur&&!sub}">${escapeHTML(c.name)}<small>${c.items.length} 件</small></button><div class="sd-subs">${c.subs.map(s=>`<button type="button" data-main="${c.id}" data-sub="${s.id}" aria-current="${c.id===cur&&s.id===sub}">${escapeHTML(s.name)}</button>`).join("")}</div>`).join("");
  }else{
    rail.innerHTML=mains.map(c=>`<button type="button" class="sd-cat" data-main="${c.id}" aria-current="${c.id===cur}">${mode==="c"?`<span class="ic">${c.items[0]?.photos?.[0]?`<img src="${escapeHTML(normalizePhotoUrl(c.items[0].photos[0],200))}" alt="">`:""}</span>`:""}${escapeHTML(c.name)}${mode==="c"?"":`<small>${c.items.length} 件</small>`}</button>`).join("");
  }
}
function renderMain(){
  if(spy){spy.disconnect();spy=null}
  const c=mains.find(m=>m.id===cur);
  if(mode==="c"){
    main.innerHTML=mains.map(m=>`<section class="sd-sec" data-sec="${m.id}">${head(m.name,m.items.length)}${m.subs.map(s=>`<div class="sd-sub">${escapeHTML(s.name)}</div><div class="sd-grid">${s.items.map(p=>item(p)).join("")}</div>`).join("")}</section>`).join("");
    // 捲到哪一類，左邊就亮哪一類
    spy=new IntersectionObserver(es=>{
      const top=es.filter(e=>e.isIntersecting).sort((x,y)=>x.boundingClientRect.top-y.boundingClientRect.top)[0];
      if(!top)return;
      cur=top.target.dataset.sec;
      rail.querySelectorAll(".sd-cat").forEach(b=>b.setAttribute("aria-current",b.dataset.main===cur));
      rail.querySelector('[aria-current="true"]')?.scrollIntoView({block:"nearest"});
    },{root:main,rootMargin:"0px 0px -70% 0px"});
    main.querySelectorAll(".sd-sec").forEach(s=>spy.observe(s));
    return;
  }
  const list=sub?c.items.filter(p=>p.subCat===sub):c.items;
  const title=sub?c.subs.find(s=>s.id===sub)?.name||c.name:c.name;
  const chips=mode==="a"||mode==="b"?`<div class="sd-chips"><button type="button" data-sub="" aria-pressed="${!sub}">全部</button>${c.subs.map(s=>`<button type="button" data-sub="${s.id}" aria-pressed="${s.id===sub}">${escapeHTML(s.name)} ${s.items.length}</button>`).join("")}</div>`:"";
  main.innerHTML=head(title,list.length)+chips+`<div class="sd-grid">${list.map(p=>item(p,mode==="b")).join("")||'<div class="sd-empty">這一類目前沒有商品</div>'}</div>`;
  main.scrollTop=0;
}
function setMode(next){
  mode=next;sub="";cur=mains[0].id;
  body.className="sd-body m-"+mode;
  document.querySelectorAll(".sd-modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("#sdNote").textContent=MODES[mode].note;
  renderRail();renderMain();rail.scrollTop=0;
}
document.querySelectorAll(".sd-modes button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
rail.addEventListener("click",e=>{
  const b=e.target.closest("button[data-main]");
  if(!b)return;
  if(mode==="c"){main.querySelector(`[data-sec="${b.dataset.main}"]`)?.scrollIntoView({block:"start"});return}
  cur=b.dataset.main;sub=b.dataset.sub||"";
  renderRail();renderMain();
});
main.addEventListener("click",e=>{
  const chip=e.target.closest(".sd-chips button");
  if(!chip)return;
  sub=chip.dataset.sub;renderMain();
});
setMode("a");
</script>
</body>
</html>
