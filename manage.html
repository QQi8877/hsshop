<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品管理後台 | 信通家俱行</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23343331'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='34' fill='%23b99263' text-anchor='middle'%3E信%3C/text%3E%3C/svg%3E">
<style>
:root{
  --charcoal:#343331;
  --ink:#262523;
  --muted:#67625b;
  --soft:#8d867b;
  --tan:#b99263;
  --tan-dark:#967244;
  --sage:#7f9076;
  --cream:#f3eee6;
  --paper:#fffaf3;
  --line:#ddd2c4;
  --white:#fff;
  --danger:#b84236;
  --warn:#c78a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Sans TC",system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:14px;
  line-height:1.6;
}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}

/* ── 密碼閘門 ───────────────────────────────────── */
#gate{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.gate-card{
  width:min(360px,100%);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:32px;
  box-shadow:0 24px 70px rgba(0,0,0,.1);
}
.gate-card h1{
  font-family:"Noto Serif TC",serif;
  font-size:20px;
  color:var(--charcoal);
  margin-bottom:6px;
}
.gate-card p{color:var(--soft);font-size:13px;margin-bottom:20px}
.gate-card input{
  width:100%;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--cream);
  color:var(--ink);
  padding:10px 12px;
  outline:none;
  margin-bottom:10px;
}
.gate-card input:focus{border-color:var(--tan)}
.gate-card button{
  width:100%;
  border:0;
  border-radius:7px;
  background:var(--charcoal);
  color:var(--white);
  padding:11px;
}
.gate-card button:hover{background:var(--tan-dark)}
.gate-error{display:none;color:var(--danger);font-size:12px;margin-bottom:10px}

/* ── 主畫面 ───────────────────────────────────── */
#app{display:none}
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:16px 28px;
  background:rgba(243,238,230,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.header-title{display:flex;align-items:baseline;gap:10px}
.header-title h1{font-family:"Noto Serif TC",serif;font-size:19px;color:var(--charcoal)}
.header-title span{font-size:12px;color:var(--soft)}
.header-links{display:flex;gap:14px;align-items:center;font-size:13px}
.header-links a{color:var(--muted);text-decoration:none}
.header-links a:hover{color:var(--tan-dark)}

.layout{display:flex;align-items:flex-start;gap:24px;padding:22px 28px 60px;max-width:1500px;margin:auto}

/* ── 左側分類收合列表 ───────────────────────────── */
.sidebar{
  width:220px;
  flex:none;
  position:sticky;
  top:96px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
}
.sidebar-title{font-size:11px;letter-spacing:.08em;color:var(--soft);padding:6px 8px 10px}
.cat-node{margin-bottom:2px}
.cat-row{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 8px;
  border-radius:7px;
  font-size:13px;
  color:var(--muted);
}
.cat-row:hover{background:rgba(185,146,99,.08)}
.cat-row.active{background:var(--charcoal);color:var(--white)}
.cat-toggle{
  width:16px;
  height:16px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--soft);
  border:0;
  background:transparent;
  padding:0;
  transition:transform .15s;
}
.cat-toggle.open{transform:rotate(90deg)}
.cat-row.active .cat-toggle{color:rgba(255,255,255,.7)}
.cat-label{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-count{font-size:10.5px;color:var(--soft)}
.cat-row.active .cat-count{color:rgba(255,255,255,.6)}
.cat-subs{margin-left:20px;overflow:hidden;max-height:0;transition:max-height .18s ease}
.cat-subs.open{max-height:400px}
.cat-sub-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding:6px 8px;
  border-radius:7px;
  font-size:12.5px;
  color:var(--muted);
  cursor:pointer;
}
.cat-sub-row:hover{background:rgba(185,146,99,.08)}
.cat-sub-row.active{background:var(--tan);color:var(--white)}

.content{flex:1;min-width:0}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  padding:8px 14px;
  min-width:220px;
  color:var(--soft);
}
.search-box input{flex:1;border:0;background:transparent;outline:none;color:var(--ink)}
.filter-chip{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--muted);
  border-radius:999px;
  padding:7px 14px;
  font-size:12.5px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}
.filter-chip .n{font-size:10.5px;background:rgba(0,0,0,.07);border-radius:999px;padding:0 6px}
.filter-chip.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--white)}
.filter-chip.active .n{background:rgba(255,255,255,.22)}
.filter-chip.warn.active{background:var(--warn);border-color:var(--warn)}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--paper);
}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
thead th{
  position:sticky;
  top:0;
  background:var(--cream);
  color:var(--muted);
  font-weight:500;
  font-size:11.5px;
  letter-spacing:.04em;
  text-align:left;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
}
thead th:hover{color:var(--tan-dark)}
thead th.sorted{color:var(--tan-dark)}
tbody td{
  padding:9px 12px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(185,146,99,.06)}
tbody tr.is-archived{opacity:.55}
.cell-thumb{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--cream);display:block}
.cell-thumb-empty{
  width:52px;height:52px;border-radius:6px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:10px;text-align:center;
}
.cell-name{font-weight:500;color:var(--charcoal)}
.cell-name-link{cursor:pointer}
.cell-name-link:hover{color:var(--tan-dark);text-decoration:underline}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:999px;
  padding:3px 9px;
  font-size:11.5px;
}
.pill-ok{background:rgba(127,144,118,.15);color:var(--sage)}
.pill-missing{background:rgba(199,138,58,.15);color:var(--warn)}
.pill-archived{background:rgba(184,66,54,.12);color:var(--danger)}
.pill-active{background:rgba(127,144,118,.15);color:var(--sage)}
.missing-dots{display:flex;gap:4px;margin-top:3px}
.missing-dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
.row-actions a{
  font-size:12px;
  color:var(--tan-dark);
  text-decoration:none;
  border:1px solid var(--line);
  border-radius:6px;
  padding:4px 9px;
  white-space:nowrap;
}
.row-actions a:hover{border-color:var(--tan);background:rgba(185,146,99,.08)}
.empty-state{padding:60px 20px;text-align:center;color:var(--soft)}
.summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--soft);font-size:12.5px;margin-bottom:14px}
.loading{padding:60px 20px;text-align:center;color:var(--soft)}
.sync-btn{
  border:1px solid var(--tan);
  background:rgba(185,146,99,.1);
  color:var(--tan-dark);
  border-radius:999px;
  padding:6px 14px;
  font-size:12px;
  white-space:nowrap;
}
.sync-btn:hover{background:var(--tan);color:var(--white)}
.sync-btn:disabled{opacity:.5;cursor:default}
.toast{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:500;
  border-radius:8px;
  background:var(--charcoal);
  color:var(--white);
  padding:12px 18px;
  font-size:13px;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:.25s;
}
.toast.show{opacity:1;transform:translateY(0)}

/* ── 新增商品按鈕 ───────────────────────────────── */
.add-btn{
  border:0;
  border-radius:999px;
  background:var(--charcoal);
  color:var(--white);
  padding:8px 16px;
  font-size:12.5px;
}
.add-btn:hover{background:var(--tan-dark)}
.row-actions{display:flex;gap:6px;flex-wrap:nowrap}
.row-actions button{
  font-size:12px;
  color:var(--tan-dark);
  background:transparent;
  border:1px solid var(--line);
  border-radius:6px;
  padding:4px 9px;
  white-space:nowrap;
}
.row-actions button:hover{border-color:var(--tan);background:rgba(185,146,99,.08)}
.row-actions button.danger{color:var(--danger)}
.row-actions button.danger:hover{border-color:var(--danger);background:rgba(184,66,54,.08)}

/* ── 商品編輯 Modal（沿用前台樣式）───────────────── */
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:240;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(34,29,24,.72);
}
.modal-overlay.open{display:flex}
.modal{
  width:min(590px,100%);
  max-height:92vh;
  overflow:hidden;
  background:var(--paper);
  border-radius:14px;
  position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
  display:flex;
  flex-direction:column;
}
.modal-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:32px;
}
.modal-title{
  font-family:"Noto Serif TC",serif;
  font-size:21px;
  color:var(--charcoal);
  margin-bottom:22px;
}
.modal-close{
  position:absolute;
  top:14px;
  right:14px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:var(--muted);
  background:#ece3d8;
}
.modal label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:.06em;
}
.modal input,.modal textarea,.modal select{
  width:100%;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--cream);
  color:var(--ink);
  padding:10px 12px;
  outline:none;
}
.modal textarea{min-height:78px;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--tan)}
.rte-toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.rte-toolbar button{
  border:1px solid var(--line);
  background:var(--white);
  color:var(--muted);
  border-radius:6px;
  padding:6px 10px;
  font-size:12px;
}
.rte-toolbar button:hover{border-color:var(--tan);color:var(--tan-dark)}
.modal .rte-toolbar select{
  width:auto;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--white);
  color:var(--muted);
  padding:5px 6px;
  font-size:12px;
}
.modal .rte-toolbar label{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:0;
  font-size:11px;
  color:var(--soft);
}
.modal .rte-toolbar input[type="color"]{
  width:26px;
  height:26px;
  border:1px solid var(--line);
  border-radius:6px;
  padding:0;
  background:none;
  cursor:pointer;
}
.rte-editor{
  min-height:90px;
  max-height:260px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--cream);
  color:var(--ink);
  padding:10px 12px;
  outline:none;
  line-height:1.6;
  font-size:14px;
}
.rte-editor:focus{border-color:var(--tan)}
.rte-editor:empty:before{content:attr(data-placeholder);color:var(--soft)}
.photos-section{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
.photos-section-title{font-weight:700;color:var(--charcoal);font-size:14px}
.photos-note{font-size:11px;color:var(--soft);margin:5px 0 13px}
.upload-method-row{display:flex;gap:5px;margin-bottom:10px}
.upload-method-btn{
  flex:1;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--white);
  color:var(--muted);
  padding:7px 4px;
  font-size:11px;
}
.upload-method-btn.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--white)}
.url-input-row{display:flex;gap:7px;margin-bottom:8px}
.url-input-row input{margin:0}
.url-input-row button{
  white-space:nowrap;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--white);
  color:var(--muted);
  padding:0 14px;
}
.helper-text{font-size:11px;color:var(--soft);margin-bottom:8px}
.dimension-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spec-editor{margin-top:8px}
.spec-table{width:100%;min-width:0;border-collapse:collapse;font-size:13px;table-layout:fixed}
.spec-table th{
  padding:7px 6px;
  background:var(--cream);
  color:var(--muted);
  font-weight:500;
  font-size:11px;
  letter-spacing:.08em;
  border:1px solid var(--line);
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.spec-table th:first-child{text-align:left}
.spec-table th:nth-child(1),.spec-table td:nth-child(1){width:30%}
.spec-table th:nth-child(2),.spec-table td:nth-child(2),
.spec-table th:nth-child(3),.spec-table td:nth-child(3),
.spec-table th:nth-child(4),.spec-table td:nth-child(4){width:20%}
.spec-table th:nth-child(5),.spec-table td:nth-child(5){width:30px}
.spec-table td{
  border:1px solid var(--line);
  padding:4px 4px;
}
.spec-table td:first-child{padding:4px 8px}
.spec-table input{
  width:100%;
  border:none;
  background:transparent;
  color:var(--ink);
  font-size:13px;
  text-align:center;
  padding:3px 2px;
  outline:none;
}
.spec-table input:first-child,.spec-table td:first-child input{text-align:left}
.spec-table input:focus{background:rgba(185,146,99,.1);border-radius:4px}
.spec-table .spec-del-btn{
  border:0;
  background:transparent;
  color:var(--soft);
  cursor:pointer;
  font-size:15px;
  padding:2px 5px;
  border-radius:4px;
  display:block;
  margin:auto;
}
.spec-table .spec-del-btn:hover{background:#fce8e8;color:var(--danger)}
.add-spec-btn{
  border:1px dashed var(--tan);
  border-radius:7px;
  background:rgba(185,146,99,.08);
  color:var(--tan-dark);
  padding:8px 10px;
  font-size:12px;
  margin-top:6px;
}
.photo-slots{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:10px 0 8px;
}
.photo-slot{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border:1.5px dashed var(--line);
  border-radius:8px;
  background:var(--cream);
}
.photo-slot.has-img{border-style:solid}
.photo-slot:hover{border-color:var(--tan)}
.slot-img{width:100%;height:100%;object-fit:cover;display:block}
.slot-num{
  position:absolute;
  top:3px;
  left:5px;
  z-index:3;
  font-size:10px;
  color:var(--soft);
}
.has-img .slot-num{color:rgba(255,255,255,.72)}
.slot-overlay{
  position:absolute;
  inset:0;
  z-index:2;
  display:grid;
  place-items:center;
  color:var(--tan-dark);
  font-size:10px;
  text-align:center;
}
.has-img .slot-overlay{opacity:0;background:rgba(0,0,0,.44);color:var(--white);transition:opacity .18s}
.has-img:hover .slot-overlay{opacity:1}
.slot-file-input{
  position:absolute;
  inset:0;
  z-index:4;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}
.slot-del{
  display:none;
  position:absolute;
  top:4px;
  right:4px;
  z-index:6;
  width:19px;
  height:19px;
  border:0;
  border-radius:50%;
  background:var(--danger);
  color:var(--white);
  line-height:1;
}
.has-img:hover .slot-del{display:grid;place-items:center}
.slot-drag-handle{
  display:none;
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  z-index:6;
  background:rgba(0,0,0,.52);
  color:#fff;
  border-radius:4px;
  padding:2px 6px;
  font-size:10px;
  letter-spacing:.04em;
  cursor:grab;
  white-space:nowrap;
  pointer-events:all;
}
.has-img:hover .slot-drag-handle{display:block}
.photo-slot.drag-over{
  border:2px solid var(--tan);
  background:rgba(185,146,99,.12);
  transform:scale(1.04);
  transition:transform .15s;
}
.photo-slot.dragging{opacity:.4}
.modal-actions{display:flex;gap:10px;margin-top:26px}
.btn-secondary,.btn-primary{
  border-radius:7px;
  padding:12px 18px;
}
.btn-secondary{border:1px solid var(--line);background:transparent;color:var(--muted)}
.btn-primary{flex:1;border:0;background:var(--charcoal);color:var(--white)}
.btn-primary:hover{background:var(--tan-dark)}

@media(max-width:760px){
  header{padding:14px 15px}
  .layout{flex-direction:column;padding:16px 15px 40px;gap:14px}
  .sidebar{width:100%;position:static;top:auto}
  .cat-subs.open{max-height:600px}
  main,.content{width:100%}
  table{min-width:680px}
  .modal-scroll{padding:22px 18px}
  .photo-slots{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>🔒 商品管理後台</h1>
    <p>請輸入管理員密碼</p>
    <div class="gate-error" id="gateError">密碼錯誤，請再試一次</div>
    <input type="password" id="gatePw" placeholder="••••••••" onkeydown="if(event.key==='Enter')unlockGate()">
    <button onclick="unlockGate()">進入後台</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-title">
      <h1>信通家俱行 · 商品管理後台</h1>
      <span id="totalCount"></span>
    </div>
    <div class="header-links">
      <button class="add-btn" onclick="openProductModal(null)">＋ 新增商品</button>
      <a href="index.html" target="_blank" rel="noopener">前往前台 ↗</a>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">分類</div>
      <div id="catTree"></div>
    </aside>
    <div class="content">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchBox" placeholder="搜尋商品名稱、說明或分類…" oninput="renderTable()">
        </div>
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部 <span class="n" id="fc-all"></span></button>

async function sha256(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

};

/* ── 商品說明簡易富文本編輯器（底線／文字大小／文字顏色／網底）─── */
const rteSavedRange={};
function rteInit(id){
  const editor=document.getElementById(id);
  if(!editor||editor.dataset.rteReady)return;
  editor.dataset.rteReady="1";
  const saveSel=()=>{
    const sel=window.getSelection();
    if(sel.rangeCount&&editor.contains(sel.anchorNode))rteSavedRange[id]=sel.getRangeAt(0).cloneRange();
  };
  editor.addEventListener("mouseup",saveSel);
  editor.addEventListener("keyup",saveSel);
  editor.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      document.execCommand("insertHTML",false,"<br>");
    }
  });
  editor.addEventListener("paste",e=>{
    e.preventDefault();
    const text=(e.clipboardData||window.clipboardData).getData("text/plain");
    const html=escapeHTML(text).replace(/\r\n|\r|\n/g,"<br>");
    document.execCommand("insertHTML",false,html);
  });
}
window.rteApply=function(id,styleProp,value){
  const editor=document.getElementById(id);
  const range=rteSavedRange[id];
  if(!editor||!range)return;
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  if(sel.isCollapsed)return;
  const span=document.createElement("span");
  span.style[styleProp]=value;
  try{
    range.surroundContents(span);
  }catch(e){
    const contents=range.extractContents();
    span.appendChild(contents);
    range.insertNode(span);
  }
  sel.removeAllRanges();
  editor.focus();
};
window.rteClear=function(id){
  const editor=document.getElementById(id);
  const range=rteSavedRange[id];
  if(!editor||!range)return;
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  if(sel.isCollapsed)return;
  const text=range.toString();
  range.deleteContents();
  range.insertNode(document.createTextNode(text));
  sel.removeAllRanges();
  editor.focus();
};
function sanitizeRichText(html){
  const div=document.createElement("div");
  div.innerHTML=html;
  div.querySelectorAll("script,iframe,object,embed,link,style").forEach(el=>el.remove());
  div.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(attr=>{
      if(/^on/i.test(attr.name)||(attr.name==="style"&&/expression|javascript:/i.test(attr.value)))el.removeAttribute(attr.name);
    });
  });
  return div.innerHTML;
}

/* ── 自動產文案（規則式樣板，依商品名稱關鍵字比對，非真AI生成）─── */
function autoGenerateDesc(name,catName,subName){
  name=name||"";catName=catName||"";subName=subName||"";
  const has=kw=>name.includes(kw);
  const traits=[];
  if(has("鋁架")||has("鋁"))traits.push("鋁合金材質，輕巧防鏽");
  if(has("白鐵"))traits.push("白鐵材質，耐刮耐用好清潔");
  if(has("實木"))traits.push("實木材質，質感自然溫潤");
  if(has("皮面")||has("皮革"))traits.push("皮革表面，好清潔耐髒污");
  if(has("網布"))traits.push("透氣網布，久坐不悶熱");
  if(has("古銅腳"))traits.push("古銅色澤，耐看好搭配");
  if(has("電金腳"))traits.push("電金色澤，質感亮眼");
  if(has("花紋"))traits.push("花紋表面，美觀耐看");
  if(has("牛角"))traits.push("經典造型，耐看不退流行");
  if(has("靠腰"))traits.push("貼腰椅背設計，久坐較舒適");
  if(has("氣壓"))traits.push("氣壓升降，高度可依需求調整");
  if(has("凹底"))traits.push("凹底椅面設計，坐感較貼合");
  if(has("圓"))traits.push("圓潤造型，百搭多種空間風格");
  if(has("鋼管"))traits.push("鋼管骨架穩重紮實，久坐不搖晃");

  const isFold=has("摺疊")||has("折疊")||has("立桌")||subName.includes("摺疊")||subName.includes("折疊");
  const isChair=catName==="椅子"||subName.includes("椅");
  const isTable=catName==="桌子";
  const isRack=catName==="收納櫃／架";
  const matText=traits.join("，")||"簡約造型，線條俐落好搭配";

  let intro="",bullets=[];
  if(isRack){
    intro=`${matText}，收納空間實用，組裝簡易。`;
    bullets=[matText,"收納空間實用，組裝簡易"];
  }else if(isTable){
    if(isFold){
      intro=`${matText}，摺疊桌腳設計，需要時展開即可使用，不用時收合好收納。`;
      bullets=["摺疊收納，不佔空間",matText];
    }else{
      intro=`${matText}，適合居家日常使用。`;
      bullets=[matText,"簡約造型，好搭配空間風格"];
    }
  }else if(isChair){
    if(isFold){
      intro=`${matText}，摺疊設計方便收納移動。`;
      bullets=[matText,"摺疊收納，不佔空間"];
    }else{
      intro=`${matText}，適合居家餐廳日常使用。`;
      bullets=[matText,"穩固耐用，居家日常好搭配"];
    }
  }else{
    intro="簡約實用設計，適合居家日常使用。";
    bullets=["簡約實用","居家日常好搭配"];
  }
  const bulletHtml=bullets.filter(Boolean).map(b=>`• ${escapeHTML(b)}`).join("<br>");
  return `${escapeHTML(intro)}<br><br>${bulletHtml}`;
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
const PHOTO_TARGET_W=1200,PHOTO_TARGET_H=1500;
function resizeImageToUniform(src){
  return loadImage(src).then(img=>{
    try{
      const canvas=document.createElement("canvas");
      canvas.width=PHOTO_TARGET_W;
      canvas.height=PHOTO_TARGET_H;
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#fffaf3";
      ctx.fillRect(0,0,PHOTO_TARGET_W,PHOTO_TARGET_H);
      const scale=Math.min(PHOTO_TARGET_W/img.width,PHOTO_TARGET_H/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(PHOTO_TARGET_W-w)/2,(PHOTO_TARGET_H-h)/2,w,h);
      return canvas.toDataURL("image/jpeg",0.86);
    }catch(e){
      return src;
    }
  }).catch(()=>src);
}
const THUMB_W=480,THUMB_H=600;
function resizeToThumb(src){
  // 只給商品列表封面用的小尺寸版本，畫質跟原圖無關——原圖仍完整存在圖庫子文件裡，
  // 編輯商品/前台燈箱看到的還是未經過這層縮圖的原始照片。
  return loadImage(src).then(img=>{
    try{
      const canvas=document.createElement("canvas");
      canvas.width=THUMB_W;
      canvas.height=THUMB_H;
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#fffaf3";
      ctx.fillRect(0,0,THUMB_W,THUMB_H);
      const scale=Math.min(THUMB_W/img.width,THUMB_H/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(THUMB_W-w)/2,(THUMB_H-h)/2,w,h);
      return canvas.toDataURL("image/jpeg",0.82);
    }catch(e){
      return src;
    }
  }).catch(()=>src);
}
function extractGdriveId(url){
  const patterns=[/\/file\/d\/([a-zA-Z0-9_-]+)/,/[?&]id=([a-zA-Z0-9_-]+)/,/\/d\/([a-zA-Z0-9_-]+)/];
  for(const pattern of patterns){
    const match=String(url).match(pattern);
    if(match)return match[1];
  }
  return null;
}
function convertGdriveUrl(url){
  const id=extractGdriveId(url);
  return id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`:url;
}
function normalizePhotoUrl(url){
  return /drive\.google\.com/i.test(url)?convertGdriveUrl(url):url;
}

window.renderCatSelect=function(){
  const main=document.getElementById("pMainCat");
  main.innerHTML=catalog.map(c=>`<option value="${escapeHTML(c.id)}">${escapeHTML(c.name)}</option>`).join("");
  updateSubSelect();
};
window.updateSubSelect=function(){
  const mainId=document.getElementById("pMainCat").value;
  const sub=document.getElementById("pSubCat");
  const wrap=document.getElementById("pSubCatWrap");
  const main=getMainCat(mainId);
  if(main?.subs?.length){
    sub.innerHTML=main.subs.map(s=>`<option value="${escapeHTML(s.id)}">${escapeHTML(s.name)}</option>`).join("");
    wrap.style.display="block";
  }else{
    sub.innerHTML="";
    wrap.style.display="none";
  }
};

window.addSpecRow=function(part="",w="",d="",h=""){
  workingSpecs.push({part,w,d,h});
  renderSpecEditor();
};
function renderSpecEditor(){
  const editor=document.getElementById("specEditor");
  if(!editor)return;
  editor.innerHTML="";
  if(!workingSpecs.length){
    workingSpecs=[{part:"",w:"",d:"",h:""},{part:"",w:"",d:"",h:""},{part:"",w:"",d:"",h:""}];
  }
  const table=document.createElement("table");
  table.className="spec-table";
  table.innerHTML=`<thead><tr><th>部位</th><th>寬（W）</th><th>深（D）</th><th>高（H）</th><th></th></tr></thead>`;
  const tbody=document.createElement("tbody");
  workingSpecs.forEach((spec,index)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td><input type="text" value="${escapeHTML(spec.part)}" placeholder="例：椅面"></td>
      <td><input type="text" value="${escapeHTML(spec.w)}" placeholder="—"></td>
      <td><input type="text" value="${escapeHTML(spec.d)}" placeholder="—"></td>
      <td><input type="text" value="${escapeHTML(spec.h)}" placeholder="—"></td>
      <td><button class="spec-del-btn" type="button">×</button></td>
    `;
    const [partInput,wInput,dInput,hInput]=tr.querySelectorAll("input");
    partInput.style.textAlign="left";
    partInput.addEventListener("input",()=>workingSpecs[index].part=partInput.value);
    wInput.addEventListener("input",()=>workingSpecs[index].w=wInput.value);
    dInput.addEventListener("input",()=>workingSpecs[index].d=dInput.value);
    hInput.addEventListener("input",()=>workingSpecs[index].h=hInput.value);
    tr.querySelector(".spec-del-btn").addEventListener("click",()=>{workingSpecs.splice(index,1);renderSpecEditor()});
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  editor.appendChild(table);
}

window.setUploadMethod=function(method,el){
  uploadMethod=method;
  document.querySelectorAll(".upload-method-btn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("urlInputPanel").style.display=method==="url"?"block":"none";
  document.getElementById("gdriveInputPanel").style.display=method==="gdrive"?"block":"none";
  renderPhotoSlots();
};
function renderPhotoSlots(){
  const container=document.getElementById("photoSlots");
  container.innerHTML="";
  let dragSrcIdx=null;
  for(let i=0;i<MAX_PHOTOS;i++){
    const src=workingPhotos[i];
    const slot=document.createElement("div");
    slot.className="photo-slot"+(src?" has-img":"");
    slot.dataset.idx=i;
    if(src){
      const img=document.createElement("img");
      img.className="slot-img";
      img.src=normalizePhotoUrl(src);
      img.alt="";
      slot.appendChild(img);
      slot.draggable=true;
      slot.addEventListener("dragstart",e=>{
        dragSrcIdx=i;
        slot.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";
      });
      slot.addEventListener("dragend",()=>{
        slot.classList.remove("dragging");
        container.querySelectorAll(".photo-slot").forEach(s=>s.classList.remove("drag-over"));
      });
      slot.addEventListener("dragover",e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect="move";
        if(dragSrcIdx!==i)slot.classList.add("drag-over");
      });
      slot.addEventListener("dragleave",()=>slot.classList.remove("drag-over"));
      slot.addEventListener("drop",e=>{
        e.preventDefault();
        slot.classList.remove("drag-over");
        if(dragSrcIdx===null||dragSrcIdx===i)return;
        const tmp=workingPhotos[dragSrcIdx];
        workingPhotos[dragSrcIdx]=workingPhotos[i];
        workingPhotos[i]=tmp;
        dragSrcIdx=null;
        renderPhotoSlots();
        toast("圖片順序已更新");
      });
      const handle=document.createElement("div");
      handle.className="slot-drag-handle";
      handle.textContent="⠿ 拖曳排序";
      handle.addEventListener("mousedown",e=>e.stopPropagation());
      slot.appendChild(handle);
    }
    const num=document.createElement("span");
    num.className="slot-num";
    num.textContent=i+1;
    slot.appendChild(num);
    const overlay=document.createElement("div");
    overlay.className="slot-overlay";
    overlay.innerHTML=src?"更換":"新增";
    if(uploadMethod==="file"){
      const file=document.createElement("input");
      file.type="file";
      file.accept="image/*";
      file.className="slot-file-input";
      file.addEventListener("change",event=>handleSlotFile(i,event));
      slot.appendChild(file);
    }else{
      overlay.style.cursor="pointer";
      overlay.addEventListener("click",()=>promptUrlForSlot(i));
    }
    slot.appendChild(overlay);
    if(src){
      const del=document.createElement("button");
      del.className="slot-del";
      del.textContent="×";
      del.addEventListener("click",event=>{
        event.stopPropagation();
        workingPhotos[i]="";
        const filled=workingPhotos.filter(Boolean);
        workingPhotos=new Array(MAX_PHOTOS).fill("");
        filled.forEach((photo,index)=>workingPhotos[index]=photo);
        renderPhotoSlots();
      });
      slot.appendChild(del);
    }
    container.appendChild(slot);
  }
}
function handleSlotFile(slotIdx,event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    workingPhotos[slotIdx]=await resizeImageToUniform(e.target.result);
    renderPhotoSlots();
  };
  reader.readAsDataURL(file);
}
async function promptUrlForSlot(slotIdx){
  const inputId=uploadMethod==="gdrive"?"gdriveInput":"urlInput";
  const raw=document.getElementById(inputId).value.trim();
  if(!raw){toast("請先在上方輸入連結");return}
  workingPhotos[slotIdx]=await resizeImageToUniform(normalizePhotoUrl(raw));
  renderPhotoSlots();
  toast("圖片已設定");
}
window.addPhotoByUrl=async function(){
  const raw=document.getElementById("urlInput").value.trim();
  if(!raw){toast("請輸入圖片網址");return}
  await addWorkingPhoto(normalizePhotoUrl(raw));
};
window.addPhotoByGdrive=async function(){
  const raw=document.getElementById("gdriveInput").value.trim();
  if(!raw){toast("請輸入 Google Drive 連結");return}
  await addWorkingPhoto(convertGdriveUrl(raw));
};
async function addWorkingPhoto(url){
  const empty=workingPhotos.findIndex(Boolean)===-1?0:workingPhotos.findIndex(photo=>!photo);
  if(empty===-1){toast(`已達 ${MAX_PHOTOS} 張上限`);return}
  workingPhotos[empty]=await resizeImageToUniform(url);
  renderPhotoSlots();
  toast("圖片已新增");
}

window.openProductModal=async function(id){
  editingProductId=id;
  workingPhotos=new Array(MAX_PHOTOS).fill("");
  workingSpecs=[];
  document.getElementById("productModalTitle").textContent=id?"編輯商品":"新增商品";
  document.getElementById("urlInput").value="";
  document.getElementById("gdriveInput").value="";
  setUploadMethod("file",document.querySelector(".upload-method-btn"));
  renderCatSelect();
  rteInit("pDesc");
  if(id){
    const product=products.find(p=>p.id===id);
    if(!product)return;
    document.getElementById("pMainCat").value=product.mainCat||"";
    updateSubSelect();
    document.getElementById("pSubCat").value=product.subCat||"";
    document.getElementById("pName").value=product.name||"";
    document.getElementById("pSize").value=product.size||"";
    document.getElementById("pWidth").value=product.dimensions?.width||"";
    document.getElementById("pDepth").value=product.dimensions?.depth||"";
    document.getElementById("pHeight").value=product.dimensions?.height||"";
    workingSpecs=(product.specs||[]).map(spec=>{
      if("part" in spec)return {...spec};
      return {part:spec.label||"",w:spec.value||"",d:"",h:""};
    });
    document.getElementById("pDesc").innerHTML=product.desc||"";
    let cover=(product.photos||[]).filter(Boolean);
    // 商品文件的封面只是縮圖，編輯時一律要換成 gallery 子文件裡的原始畫質照片
    const totalCount=product.photoCount??cover.length;
    if(totalCount>0){
      renderPhotoSlots();
      openModal("productModal");
      const full=await loadGallery(id);
      if(editingProductId!==id)return; // 使用者切換到別的商品了，不要覆蓋畫面
      if(full.length)cover=full;
    }
    cover.slice(0,MAX_PHOTOS).forEach((photo,index)=>workingPhotos[index]=photo);
  }else{
    document.getElementById("pMainCat").value=catalog[0]?.id||"";
    updateSubSelect();
    ["pName","pSize","pWidth","pDepth","pHeight"].forEach(fid=>document.getElementById(fid).value="");
    document.getElementById("pDesc").innerHTML="";
  }
  renderSpecEditor();
  renderPhotoSlots();
  openModal("productModal");
};

function getSizeSummary(dimensions,size){
  const parts=[];
  if(dimensions.width)parts.push(`寬 ${dimensions.width}cm`);
  if(dimensions.depth)parts.push(`深 ${dimensions.depth}cm`);
  if(dimensions.height)parts.push(`高 ${dimensions.height}cm`);
  return parts.length?parts.join(" x "):(size||"");
}

window.saveProduct=async function(){
  const name=document.getElementById("pName").value.trim();
  if(!name){toast("請填寫商品名稱");return}
  const dimensions={
    width:document.getElementById("pWidth").value.trim(),
    depth:document.getElementById("pDepth").value.trim(),
    height:document.getElementById("pHeight").value.trim()
  };
  const size=document.getElementById("pSize").value.trim()||getSizeSummary(dimensions,"");
  const data={
    mainCat:document.getElementById("pMainCat").value,
    subCat:document.getElementById("pSubCat").value||null,
    name,
    size,
    dimensions,
    specs:workingSpecs.filter(spec=>spec.part||spec.w||spec.d||spec.h).map(spec=>({
      part:(spec.part||"").trim(),
      w:(spec.w||"").trim(),
      d:(spec.d||"").trim(),
      h:(spec.h||"").trim()
    })),
    desc:sanitizeRichText(document.getElementById("pDesc").innerHTML.trim())
  };
  const fullPhotos=workingPhotos.filter(Boolean).map(normalizePhotoUrl);
  // 商品文件只存封面照的縮圖版本＋photoCount，原始畫質照片另外寫進 gallery 子文件
  data.photos=fullPhotos.length?[await resizeToThumb(fullPhotos[0])]:[];
  data.photoCount=fullPhotos.length;
  let product;
  if(editingProductId){
    const index=products.findIndex(p=>p.id===editingProductId);
    product={id:editingProductId,status:products[index].status,sortOrder:products[index].sortOrder,...data};
    products[index]=product;
  }else{
    product={id:uid(),status:"active",sortOrder:nextSortOrder(),...data};
    products.push(product);
  }
  try{
    await setDoc(doc(productsCol(),product.id),product);
    await saveGallery(product.id,fullPhotos);
    toast(editingProductId?"商品已更新 ☁️":"商品已新增 ☁️");
  }catch(e){
    toast("儲存失敗："+(e.message||String(e)),4000);
  }
  closeModal("productModal");
  document.getElementById("totalCount").textContent=`共 ${products.filter(p=>p.status!=="archived").length} 個上架商品`;
  renderSidebar();
  renderTable();
};

window.archiveProductRow=async function(id){
  const p=products.find(p=>p.id===id);
  if(!p)return;
  if(!confirm(`確定要封存「${p.name}」嗎？封存後前台不會顯示，可以隨時還原。`))return;
  p.status="archived";
  await setDoc(doc(productsCol(),id),p);
  toast("已封存");
  document.getElementById("totalCount").textContent=`共 ${products.filter(p=>p.status!=="archived").length} 個上架商品`;
  renderSidebar();
  renderTable();
};
window.restoreProductRow=async function(id){
  const p=products.find(p=>p.id===id);
  if(!p)return;
  p.status="active";
  await setDoc(doc(productsCol(),id),p);
  toast("已還原上架");
  document.getElementById("totalCount").textContent=`共 ${products.filter(p=>p.status!=="archived").length} 個上架商品`;
  renderSidebar();
  renderTable();
};
window.deleteProductRow=async function(id){
  const p=products.find(p=>p.id===id);
  if(!p)return;
  if(!confirm(`此操作無法復原，確定要永久刪除「${p.name}」嗎？`))return;
  await deleteDoc(doc(productsCol(),id));
  try{await deleteDoc(galleryDocRef(id))}catch(e){}
  products=products.filter(p=>p.id!==id);
  toast("已永久刪除");
  document.getElementById("totalCount").textContent=`共 ${products.filter(p=>p.status!=="archived").length} 個上架商品`;
  renderSidebar();
  renderTable();
};

function missingFlags(p){
  return {
    noCat: !p.mainCat,
    noSize: !hasSize(p),
    noDesc: !p.desc,
    noPhoto: !(p.photos||[]).filter(Boolean).length
  };
}

async function boot(){
  document.getElementById("tbody").innerHTML='<tr><td colspan="8" class="loading">載入中…</td></tr>';
  try{
    const metaSnap=await getDoc(doc(db,"sitedata",SITE_DOC));
    catalog=metaSnap.exists()?(metaSnap.data().catalog||[]):[];
    const productsSnap=await getDocs(collection(db,"sitedata",SITE_DOC,"products"));
    products=productsSnap.docs.map(d=>d.data());
    products.forEach((p,i)=>{if(typeof p.sortOrder!=="number")p.sortOrder=i});
  }catch(e){
    document.getElementById("tbody").innerHTML=`<tr><td colspan="8" class="empty-state">讀取失敗：${escapeHTML(e.message||String(e))}</td></tr>`;
    return;
  }
  document.getElementById("totalCount").textContent=`共 ${products.filter(p=>p.status!=="archived").length} 個上架商品`;
  if(window.innerWidth>760)catalog.forEach(c=>openMainCats.add(c.id));
  renderSidebar();
  renderTable();
}
window.boot=boot;

function renderSidebar(){
  const activeProducts=products.filter(p=>p.status!=="archived");
  const allRow=`
    <div class="cat-row ${catFilterMain===null?"active":""}" onclick="setCatFilter(null,null)">
      <span class="cat-toggle"></span>
      <span class="cat-label">全部分類</span>
      <span class="cat-count">${activeProducts.length}</span>
    </div>`;
  const nodes=catalog.map(c=>{
    const mainCount=activeProducts.filter(p=>p.mainCat===c.id).length;
    const isOpen=openMainCats.has(c.id);
    const subs=(c.subs||[]).map(s=>{
      const subCount=activeProducts.filter(p=>p.mainCat===c.id&&p.subCat===s.id).length;
      const active=catFilterMain===c.id&&catFilterSub===s.id;
      return `<div class="cat-sub-row ${active?"active":""}" onclick="setCatFilter('${c.id}','${s.id}')">
        <span>${escapeHTML(s.name)}</span><span class="cat-count">${subCount}</span>
      </div>`;
    }).join("");
    return `
      <div class="cat-node">
        <div class="cat-row ${catFilterMain===c.id&&!catFilterSub?"active":""}">
          <button class="cat-toggle ${isOpen?"open":""}" onclick="event.stopPropagation();toggleCatNode('${c.id}')">▸</button>
          <span class="cat-label" onclick="setCatFilter('${c.id}',null)">${escapeHTML(c.name)}</span>
          <span class="cat-count">${mainCount}</span>
        </div>
        <div class="cat-subs ${isOpen?"open":""}">${subs}</div>
      </div>`;
  }).join("");
  document.getElementById("catTree").innerHTML=allRow+nodes;
}
window.toggleCatNode=function(id){
  if(openMainCats.has(id))openMainCats.delete(id);else openMainCats.add(id);
  renderSidebar();
};
window.setCatFilter=function(mainId,subId){
  catFilterMain=mainId;
  catFilterSub=subId;
  renderSidebar();
  renderTable();
};

window.setFilter=function(f){
  currentFilter=f;
  document.querySelectorAll(".filter-chip").forEach(b=>b.classList.toggle("active",b.dataset.filter===f));
  renderTable();
};

document.querySelectorAll("thead th[data-sort]").forEach(th=>{
  th.addEventListener("click",()=>{
    const key=th.dataset.sort;
    if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=1}
    document.querySelectorAll("thead th").forEach(t=>t.classList.remove("sorted"));
    th.classList.add("sorted");
    renderTable();
  });
});

window.renderTable=function(){
  const q=(document.getElementById("searchBox").value||"").trim().toLowerCase();

  // 左邊分類是第一層篩選，上面的篩選籤（含數字）只在左邊選到的分類範圍內統計／篩選
  let catFiltered=products.slice();
  if(catFilterMain){
    catFiltered=catFiltered.filter(p=>p.mainCat===catFilterMain);
    if(catFilterSub)catFiltered=catFiltered.filter(p=>p.subCat===catFilterSub);
  }

  const counts={all:0,noCat:0,noSize:0,noDesc:0,noPhoto:0,archived:0};
  catFiltered.forEach(p=>{
    if(p.status==="archived"){counts.archived++;return}
    counts.all++;
    const m=missingFlags(p);
    if(m.noCat)counts.noCat++;
    if(m.noSize)counts.noSize++;
    if(m.noDesc)counts.noDesc++;
    if(m.noPhoto)counts.noPhoto++;
  });
  Object.keys(counts).forEach(k=>{const el=document.getElementById("fc-"+k);if(el)el.textContent=counts[k]});

  let list=catFiltered.slice();
  if(currentFilter==="archived"){
    list=list.filter(p=>p.status==="archived");
  }else{
    list=list.filter(p=>p.status!=="archived");
    if(currentFilter!=="all"){
      list=list.filter(p=>missingFlags(p)[currentFilter]);
    }
  }
  if(q){
    list=list.filter(p=>{
      const cat=categoryLabel(p).toLowerCase();
      const descText=(p.desc||"").replace(/<[^>]*>/g," ").toLowerCase();
      return (p.name||"").toLowerCase().includes(q)||descText.includes(q)||cat.includes(q);
    });
  }

  list.sort((a,b)=>sortDir*sortCompare(a,b));

  document.getElementById("summaryLine").textContent=`顯示 ${list.length} 個商品`;

  const tbody=document.getElementById("tbody");
  if(!list.length){
    tbody.innerHTML='<tr><td colspan="8" class="empty-state">沒有符合條件的商品</td></tr>';
    return;
  }
  tbody.innerHTML=list.map(p=>{
    const m=missingFlags(p);
    const photos=(p.photos||[]).filter(Boolean);
    const thumb=photos.length
      ? `<img class="cell-thumb" src="${escapeHTML(photos[0])}" alt="">`
      : `<div class="cell-thumb-empty">無圖</div>`;
    const dots=[m.noCat,m.noSize,m.noDesc,m.noPhoto].filter(Boolean).length
      ? `<div class="missing-dots">${[m.noCat&&"分類",m.noSize&&"尺寸",m.noDesc&&"說明",m.noPhoto&&"照片"].filter(Boolean).map(()=>'<span class="missing-dot"></span>').join("")}</div>`
      : "";
    return `
      <tr class="${p.status==="archived"?"is-archived":""}">
        <td>${thumb}</td>
        <td>
          <div class="cell-name cell-name-link" onclick="openProductModal('${p.id}')">${escapeHTML(p.name||"（未命名）")}</div>
          ${dots}
        </td>
        <td>${m.noCat?'<span class="pill pill-missing">待分類</span>':escapeHTML(categoryLabel(p))}</td>
        <td>${m.noSize?'<span class="pill pill-missing">缺尺寸</span>':'<span class="pill pill-ok">已填</span>'}</td>
        <td>${m.noDesc?'<span class="pill pill-missing">缺說明</span>':'<span class="pill pill-ok">已填</span>'}</td>
        <td>${m.noPhoto?'<span class="pill pill-missing">0 張</span>':(p.photoCount??photos.length)+' 張'}</td>
        <td>${p.status==="archived"?'<span class="pill pill-archived">已封存</span>':'<span class="pill pill-active">上架中</span>'}</td>
        <td><div class="row-actions">
          ${p.status==="archived"
            ? `<button onclick="restoreProductRow('${p.id}')">還原</button><button class="danger" onclick="deleteProductRow('${p.id}')">刪除</button>`
            : `<button onclick="archiveProductRow('${p.id}')">封存</button>`}
        </div></td>
      </tr>
    `;
  }).join("");
};
</script>
