<style>
:root{
  --charcoal:#343331;
  --ink:#262523;
  --muted:#67625b;
  --soft:#6e675c;
  --tan:#b99263;
  --tan-dark:#8a6435;
  --sage:#7f9076;
  --cream:#f3eee6;
  --paper:#fffaf3;
  --line:#ddd2c4;
  --white:#fff;
  --danger:#b84236;
  --shadow:0 18px 50px rgba(45,38,30,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
body{
  font-family:"Noto Sans TC",system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:15px;
  line-height:1.7;
}
body.lightbox-open{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
img{max-width:100%}
nav{
  position:fixed;
  inset:0 0 auto;
  z-index:100;
  height:62px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
  padding:0 36px;
  background:rgba(243,238,230,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.nav-logo{
  font-family:"Noto Serif TC",serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:.08em;
  white-space:nowrap;
  justify-self:start;
  color:inherit;
  text-decoration:none;
}
.nav-logo span{color:var(--tan)}
#navSearchBar{width:min(340px,32vw);min-width:0;margin:0;padding:7px 12px;justify-self:center}
.nav-links{display:flex;gap:28px;list-style:none;justify-self:end}
.nav-links a{
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
  letter-spacing:.08em;
}
.nav-links a:hover{color:var(--tan-dark)}
.nav-hamburger{
  display:none;
  border:0;background:transparent;color:var(--charcoal);
  padding:6px;justify-self:end;
}
.nav-links-mobile{
  display:none;
  list-style:none;
  position:fixed;
  top:62px;left:0;right:0;
  z-index:99;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.1);
  padding:8px 0;
}
.nav-links-mobile.open{display:block}
.nav-links-mobile a{
  display:block;
  padding:14px 24px;
  color:var(--ink);
  text-decoration:none;
  font-size:15px;
  border-bottom:1px solid var(--line);
}
.nav-links-mobile li:last-child a{border-bottom:0}
.nav-links-mobile a:active{background:var(--cream)}
.footer-edit-link{
  border:0;
  background:transparent;
  color:rgba(255,255,255,.36);
  font-size:11px;
  letter-spacing:.06em;
  padding:4px 2px;
}
.footer-edit-link:hover{color:rgba(255,255,255,.7)}
.footer-edit-link.active{color:var(--tan)}
#hero{
  margin-top:62px;
  min-height:520px;
  position:relative;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:linear-gradient(120deg,#232220,var(--charcoal) 45%,var(--tan-dark) 100%);
}
.hero-content{position:relative;z-index:1;max-width:560px;padding:84px 72px}
.hero-tag{
  display:inline-block;
  color:var(--white);
  background:var(--tan);
  border-radius:999px;
  padding:5px 14px;
  font-size:11px;
  letter-spacing:.16em;
  margin-bottom:22px;
}
.hero-title{
  font-family:"Noto Serif TC",serif;
  color:var(--white);
  font-size:52px;
  line-height:1.18;
  letter-spacing:.07em;
  margin-bottom:12px;
}
.hero-sub{
  color:rgba(255,255,255,.72);
  font-family:"Noto Serif TC",serif;
  letter-spacing:.18em;
  margin-bottom:22px;
}
.hero-desc{
  color:rgba(255,255,255,.82);
  max-width:450px;
  margin-bottom:34px;
}
.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--white);
  text-decoration:none;
  border:1px solid rgba(255,255,255,.58);
  border-radius:6px;
  padding:11px 22px;
  letter-spacing:.08em;
  font-size:13px;
}
.hero-cta:hover{background:rgba(255,255,255,.12)}
.section-header{text-align:center;padding:58px 24px 28px}
.section-label{font-size:11px;letter-spacing:.18em;color:var(--tan-dark);margin-bottom:8px}
.section-title{
  font-family:"Noto Serif TC",serif;
  font-size:29px;
  font-weight:500;
  color:var(--charcoal);
  margin-bottom:12px;
}
.section-line{width:42px;height:2px;background:var(--tan);margin:auto}
#categories{padding-bottom:64px}
.search-bar{
  display:flex;
  align-items:center;
  gap:9px;
  max-width:420px;
  margin:0 38px 18px;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  color:var(--soft);
}
.search-bar input{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:var(--ink);
  outline:none;
  font-size:14px;
}
.search-bar:focus-within{border-color:var(--tan)}
.search-clear{
  border:0;
  background:transparent;
  color:var(--soft);
  font-size:16px;
  line-height:1;
  padding:0 2px;
}
.search-clear:hover{color:var(--danger)}
.cat-layout{padding:0 38px}
.cat-sidebar{display:none}
.categories-bar,.sub-categories-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:0 0 18px;
}
.sub-categories-bar{display:none;padding-bottom:24px}
.cat-tab,.sub-tab{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--muted);
  border-radius:999px;
  padding:8px 17px;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  gap:7px;
}
.sub-tab{font-size:12px;padding:6px 14px}
.cat-tab:hover,.sub-tab:hover{border-color:var(--tan);color:var(--tan-dark)}
.cat-tab.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--white)}
.sub-tab.active{background:var(--sage);border-color:var(--sage);color:var(--white)}
.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:16px;
}
@media(min-width:761px){
  .cat-layout{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:start}
  .cat-main{min-width:0}
  .categories-bar,.sub-categories-bar{display:none!important}
  .cat-sidebar{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
  .cat-side-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:7px 10px;
    border-radius:6px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:13.5px;
    text-align:left;
    cursor:pointer;
  }
  .cat-side-btn:hover{background:rgba(185,146,99,.1);color:var(--tan-dark)}
  .cat-side-btn.active{background:var(--charcoal);color:var(--white);font-weight:500}
  .cat-subs{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px;padding-left:14px;border-left:2px solid var(--line)}
  .cat-sub-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:7px 10px;
    border-radius:6px;
    border:0;
    background:transparent;
    color:var(--soft);
    font-size:12.5px;
    text-align:left;
    cursor:pointer;
  }
  .cat-sub-btn:hover{color:var(--tan-dark)}
  .cat-sub-btn.active{color:var(--sage);font-weight:600}
}
.product-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:6px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.product-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
  border-color:#d0bda4;
}
.product-img-wrap{
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  background:var(--paper);
}
.product-img-wrap img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  padding:10px;
  box-sizing:border-box;
  transition:opacity .34s ease,transform .34s ease;
}
.img-primary{opacity:1;z-index:1}
.img-secondary{opacity:0;z-index:2}
.product-card:hover .img-primary.has-secondary{opacity:0}
.product-card:hover .img-secondary{opacity:1;transform:scale(1.03)}
.product-card:hover .img-primary:not(.has-secondary){transform:scale(1.04)}
.img-count-badge,.img-zoom-hint{
  position:absolute;
  z-index:4;
  bottom:8px;
  border-radius:999px;
  color:var(--white);
  background:rgba(43,39,34,.66);
  backdrop-filter:blur(6px);
}
.img-count-badge{left:8px;font-size:10px;padding:2px 8px}
.img-zoom-hint{
  right:8px;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  opacity:0;
  transition:opacity .2s;
}
.product-card:hover .img-zoom-hint{opacity:1}
.placeholder{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:var(--tan-dark);
  text-align:center;
  font-size:13px;
}
.placeholder svg{width:44px;height:44px;opacity:.52;margin-bottom:6px}
.product-info{padding:12px 13px 14px}
.product-name{
  font-family:"Noto Serif TC",serif;
  color:var(--charcoal);
  font-size:14.5px;
  font-weight:500;
  margin-bottom:3px;
}
.product-size{font-size:11px;color:var(--tan-dark);margin-bottom:4px}
.product-price{font-size:13.5px;color:var(--charcoal);font-weight:600;margin-top:2px}
.favorite-btn{
  position:absolute;
  top:8px;
  right:8px;
  z-index:6;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--white);
  background:rgba(43,39,34,.58);
  backdrop-filter:blur(6px);
  font-size:16px;
  transition:transform .16s ease,background .16s ease,color .16s ease;
}
.favorite-btn:hover{transform:scale(1.06);background:rgba(43,39,34,.76)}
.favorite-btn.active{background:var(--danger);color:#fff}
.favorites-fab{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:190;
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:var(--charcoal);
  color:var(--white);
  display:grid;
  place-items:center;
  font-size:22px;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
  transition:transform .16s ease;
}
.favorites-fab:hover{transform:scale(1.06)}
.favorites-count{
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:20px;
  height:20px;
  padding:0 4px;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:var(--tan);
  color:var(--charcoal);
  font-size:11px;
  font-weight:600;
  box-shadow:0 2px 6px rgba(0,0,0,.22);
}
.line-fab{
  position:fixed;
  right:22px;
  bottom:86px;
  z-index:190;
  width:52px;
  height:52px;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
  transition:transform .16s ease;
}
.line-fab img{width:100%;height:100%;display:block;object-fit:cover}
.line-fab:hover{transform:scale(1.06)}
.map-fab{
  position:fixed;
  right:22px;
  bottom:150px;
  z-index:190;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--tan-dark);
  color:#fff;
  display:grid;
  place-items:center;
  box-shadow:0 14px 34px rgba(0,0,0,.24);
  transition:transform .16s ease;
}
.map-fab:hover{transform:scale(1.06)}
.favorites-panel{
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  z-index:620;
  width:min(390px,100%);
  background:var(--paper);
  box-shadow:-24px 0 70px rgba(0,0,0,.24);
  transform:translateX(105%);
  transition:transform .24s ease;
  display:flex;
  flex-direction:column;
}
.favorites-panel.open{transform:translateX(0)}
.favorites-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:22px;
  border-bottom:1px solid var(--line);
}
.favorites-title{font-family:"Noto Serif TC",serif;font-size:22px;color:var(--charcoal)}
.favorites-close{border:0;background:#ece3d8;color:var(--muted);border-radius:50%;width:34px;height:34px}
.favorites-list{padding:18px;display:grid;gap:12px;overflow:auto}
.favorite-item{
  display:grid;
  grid-template-columns:84px 1fr auto;
  gap:12px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px;
  background:#fff;
}
.favorite-item img{width:84px;height:64px;object-fit:cover;border-radius:6px;background:var(--cream)}
.favorite-item-name{font-weight:700;color:var(--charcoal);font-size:14px}
.favorite-item-size{font-size:12px;color:var(--soft)}
.favorite-item button{border:0;background:transparent;color:var(--danger);font-size:18px}
.favorites-empty{padding:34px 18px;text-align:center;color:var(--soft);font-size:14px}
.favorites-inquire-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:0 18px 18px;padding:13px 16px;
  background:#06c755;color:#fff;border:0;border-radius:8px;
  font-size:14px;font-weight:500;
  transition:background .18s ease;
}
.favorites-inquire-btn:hover{background:#05a648}
.favorites-inquire-btn svg{flex-shrink:0}
#contact{background:var(--charcoal);padding:70px 38px;text-align:center}
.contact-inner{
  max-width:1400px;
  margin:auto;
}
.contact-heading{
  font-family:"Noto Serif TC",serif;
  color:var(--white);
  font-size:27px;
  font-weight:500;
}
.contact-sub{color:rgba(255,255,255,.48);font-size:13px;letter-spacing:.08em;margin:6px 0 32px}
.contact-line{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:baseline;
  gap:8px 0;
  color:rgba(255,255,255,.82);
  font-size:14px;
}
.contact-line .item{white-space:nowrap}
.contact-line b{color:var(--tan);font-weight:500;letter-spacing:.04em;margin-right:6px}
.contact-line .dot{color:rgba(255,255,255,.28);margin:0 14px;font-size:12px}
.fb-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  margin-top:26px;
  border-radius:50%;
  color:rgba(255,255,255,.5);
  transition:color .16s ease,background .16s ease;
}
.fb-icon:hover{color:var(--white);background:rgba(255,255,255,.08)}
footer{
  background:#232220;
  color:rgba(255,255,255,.42);
  padding:22px 38px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  font-size:12px;
}
.footer-brand{font-family:"Noto Serif TC",serif;letter-spacing:.08em}
.modal-overlay{
  display:flex;
  position:fixed;
  inset:0;
  z-index:240;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(34,29,24,.72);
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease,visibility 0s linear .2s;
}
.modal-overlay.open{
  opacity:1;
  visibility:visible;
  transition:opacity .2s ease;
}
.modal{
  width:min(590px,100%);
  max-height:92vh;
  overflow:hidden;
  background:var(--paper);
  border-radius:14px;
  position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
  transform:scale(.96);
  transition:transform .2s ease;
  display:flex;
  flex-direction:column;
}
.modal-overlay.open .modal{transform:scale(1)}
.modal-scroll{flex:1;min-height:0;overflow-y:auto;padding:32px}
.modal-title{
  font-family:"Noto Serif TC",serif;
  font-size:21px;
  color:var(--charcoal);
  margin-bottom:22px;
}
.modal-close{
  position:absolute;
  top:14px;
  right:14px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:var(--muted);
  background:#ece3d8;
}
.modal label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:.06em;
}
.modal input,.modal textarea,.modal select{
  width:100%;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--cream);
  color:var(--ink);
  padding:10px 12px;
  outline:none;
}
.modal textarea{min-height:78px;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--tan)}
.toast{
  position:fixed;
  right:24px;
  bottom:84px;
  z-index:500;
  border-radius:8px;
  background:var(--charcoal);
  color:var(--white);
  padding:12px 18px;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:.25s;
  font-size:13px;
}
.toast.show{opacity:1;transform:translateY(0)}
#lightbox{
  display:flex;
  position:fixed;
  inset:0;
  z-index:600;
  background:
    radial-gradient(circle at 22% 18%,rgba(185,146,99,.2),transparent 28%),
    radial-gradient(circle at 82% 72%,rgba(127,144,118,.16),transparent 32%),
    linear-gradient(135deg,rgba(35,32,28,.91),rgba(55,48,40,.88));
  color:var(--ink);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  padding:18px;
  opacity:0;
  visibility:hidden;
  transition:opacity .22s ease,visibility 0s linear .22s;
}
#lightbox.open{
  opacity:1;
  visibility:visible;
  transition:opacity .22s ease;
}
@media(max-width:760px){
  #lightbox .lb-layout{transform:scale(.97);transition:transform .22s ease}
  #lightbox.open .lb-layout{transform:scale(1)}
}
.lb-close,.lb-arrow{
  position:fixed;
  z-index:3;
  border:0;
  border-radius:50%;
  background:rgba(255,250,243,.82);
  color:var(--charcoal);
  box-shadow:0 10px 28px rgba(0,0,0,.18);
  display:grid;
  place-items:center;
}
.lb-close{top:18px;right:22px;width:42px;height:42px;font-size:25px}
.lb-arrow{top:50%;width:46px;height:46px;font-size:27px;transform:translateY(-50%)}
#lbPrev{left:18px}
#lbNext{right:18px}
.lb-close:hover,.lb-arrow:hover{background:var(--tan);color:var(--white)}
.lb-cat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.lb-cat-row .lb-product-cat{margin-bottom:0}
.lb-favorite{
  border:1px solid var(--line);
  border-radius:50%;
  width:34px;height:34px;
  display:grid;place-items:center;
  background:var(--paper);
  color:var(--charcoal);
  font-size:16px;
  flex-shrink:0;
}
.lb-favorite:hover{border-color:var(--tan);color:var(--tan-dark)}
.lb-favorite.active{background:var(--danger);border-color:var(--danger);color:#fff}
.lb-stage{
  position:relative;
  width:100%;
  max-height:72vh;
  overflow:hidden;
  border-radius:8px;
  cursor:zoom-in;
  background:rgba(255,250,243,.08);
  box-shadow:0 24px 70px rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
}
.lb-left{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  min-width:0;
}
.lb-layout{
  width:min(1180px,94vw);
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);
  gap:24px;
  align-items:start;
}
.lb-info{
  max-height:72vh;
  overflow:auto;
  border:1px solid rgba(221,210,196,.82);
  border-radius:8px;
  padding:26px;
  background:rgba(255,250,243,.93);
  color:var(--muted);
  box-shadow:0 20px 58px rgba(0,0,0,.16);
  backdrop-filter:blur(10px);
}
.lb-product-cat{font-size:12px;color:var(--tan-dark);letter-spacing:.1em;margin-bottom:8px}
.lb-product-title{font-family:"Noto Serif TC",serif;font-size:28px;color:var(--charcoal);line-height:1.25;margin-bottom:10px}
.lb-product-price{font-size:20px;color:var(--tan-dark);font-weight:600;margin-bottom:16px}
.lb-inquire-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px 16px;margin-bottom:18px;
  background:#06c755;color:#fff;border:0;border-radius:8px;
  font-size:15px;font-weight:500;text-decoration:none;
  transition:background .18s ease;
}
.lb-inquire-btn:hover{background:#05a648}
.lb-inquire-btn svg{flex-shrink:0}
.lb-product-note{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:14px;color:var(--muted)}
.lb-spec-title{font-size:12px;color:var(--tan-dark);letter-spacing:.12em;margin:18px 0 8px}
.lb-spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lb-spec-box{border:1px solid var(--line);border-radius:7px;padding:10px;background:rgba(243,238,230,.72)}
.lb-spec-label{font-size:11px;color:var(--soft)}
.lb-spec-value{font-size:15px;color:var(--charcoal)}
.lb-detail-list{display:grid;gap:8px}
.lb-detail-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:7px;font-size:13px}
.lb-detail-row span:first-child{color:var(--soft)}
.lb-detail-row strong{color:var(--charcoal)}
.lb-spec-table-wrap{overflow-x:auto;margin-bottom:4px}
.lb-spec-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-spec-table th{
  padding:7px 12px;
  background:rgba(243,238,230,.8);
  color:var(--soft);
  font-size:11px;
  letter-spacing:.06em;
  font-weight:500;
  border:1px solid var(--line);
  text-align:center;
}
.lb-spec-table th:first-child{text-align:left}
.lb-spec-table td{
  padding:8px 12px;
  border:1px solid var(--line);
  color:var(--charcoal);
  text-align:center;
  font-size:13px;
}
.lb-spec-table .lb-spec-part{
  text-align:left;
  color:var(--soft);
  font-size:12px;
  white-space:nowrap;
}
.lb-spec-table tr:hover td{background:rgba(243,238,230,.5)}
.lb-stage.zoomed{cursor:zoom-in}
.lb-stage img{
  display:block;
  max-width:100%;
  max-height:72vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:8px;
  transform-origin:center center;
  transition:transform .12s ease, transform-origin .08s ease;
  user-select:none;
}
.lb-thumbs{
  display:flex;
  gap:8px;
  max-width:100%;
  overflow:auto;
  padding:2px 0;
}
.lb-thumb{
  width:58px;
  height:44px;
  object-fit:cover;
  border:2px solid transparent;
  border-radius:6px;
  opacity:.55;
}
.lb-thumb.active,.lb-thumb:hover{border-color:var(--tan);opacity:1}
.lb-counter{font-size:12px;color:rgba(255,255,255,.55)}
.lb-hint{font-size:11px;color:rgba(255,255,255,.42);text-align:center}
@media(max-width:760px){
  nav{padding:0 12px;grid-template-columns:auto 1fr auto}
  .nav-links{display:none}
  .nav-hamburger{display:flex}
  .hero-content{padding:58px 24px}
  .hero-title{font-size:34px}
  .products-grid{grid-template-columns:1fr 1fr;gap:10px}
  .cat-layout{padding:0 15px}
  #navSearchBar{width:100%}
  #contact{padding:54px 22px}
  footer{padding:20px 22px}
  .modal-scroll{padding:28px 20px}
  #lightbox{
    align-items:flex-start;
    justify-content:flex-start;
    padding:76px 16px 24px;
  }
  .lb-layout{
    width:min(100%,560px);
    grid-template-columns:1fr;
    gap:14px;
    margin:auto;
    max-height:calc(100svh - 100px);
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .lb-stage,.lb-stage img{max-height:55svh}
  .lb-info{max-height:none;width:100%;overflow:visible}
  .lb-hint{display:none}
  .lb-spec-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .lb-spec-box{padding:8px 6px}
  .favorites-fab{right:14px;bottom:14px}
  .line-fab{right:14px;bottom:78px}
  .map-fab{right:14px;bottom:142px}
}
@media(max-width:470px){
  .lb-arrow{display:none!important}
}
</style>
</head>

function productsCol(){return collection(db,"sitedata",SITE_DOC,"products")}
function galleryDocRef(id){return doc(db,"sitedata",SITE_DOC,"products",id,"gallery","full")}
function wishlistDocRef(code){return doc(db,"sitedata",SITE_DOC,"wishlists",code)}
const WISHLIST_TTL_MS=30*24*60*60*1000; // 心願清單短碼超過 30 天視為過期
const Storage={
  // 心願清單打包連結：把收藏的商品 id 存成一筆短碼文件，網址只要帶短碼，
  // 不管收藏幾件商品，連結長度都固定很短。
  async createWishlist(ids){
    const code=uid().slice(0,6);
    await setDoc(wishlistDocRef(code),{ids,createdAt:Date.now()});
    return code;
  },
  async getWishlist(code){
    try{
      const snap=await getDoc(wishlistDocRef(code));
      if(!snap.exists())return null;
      const data=snap.data();
      if(!data.createdAt||Date.now()-data.createdAt>WISHLIST_TTL_MS)return null;
      return Array.isArray(data.ids)?data.ids:null;
    }catch(e){
      console.warn("心願清單讀取失敗",e);
      return null;
    }
  },
  // 商品各自存成一份文件（sitedata/{SITE_DOC}/products/{id}），避免全站塞進單一文件撞到
  // Firestore 每份文件 1MB 的上限（商品一多、照片一多很容易超過）。
  // catalog／contact／pageText 資料量小，仍合併存在主文件裡。
  // 商品文件本身只存封面照（photos[0]）＋ photoCount，完整的多張照片另外存在
  // products/{id}/gallery/full 子文件，只有真的需要看全部照片時（滑鼠移過、開燈箱、
  // 編輯商品）才讀取，避免首頁一次把所有商品的所有照片都抓下來拖慢載入。
  async getGallery(id){
    try{
      const snap=await getDoc(galleryDocRef(id));
      return snap.exists()?(snap.data().photos||[]).filter(Boolean):[];
    }catch(e){
      console.warn("圖庫讀取失敗",e);
      return [];
    }
  },
  async get(){
    try{
      const metaSnap=await getDoc(doc(db,"sitedata",SITE_DOC));
      const meta=metaSnap.exists()?metaSnap.data():null;
      const productsSnap=await getDocs(productsCol());
      const products=productsSnap.docs.map(d=>d.data());
      if(!meta&&!products.length)return null;
      return {...meta,products};
    }catch(e){
      console.warn("Firestore 讀取失敗，改用 localStorage",e);
      try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):null}catch(e2){return null}
    }
  },
  async set(data){
    try{
      const {products,...meta}=data;
      const batch=writeBatch(db);
      batch.set(doc(db,"sitedata",SITE_DOC),meta);
      const existingSnap=await getDocs(productsCol());
      const staleIds=new Set(existingSnap.docs.map(d=>d.id));
      (products||[]).forEach(p=>{
        batch.set(doc(productsCol(),p.id),p);
        staleIds.delete(p.id);
      });
      staleIds.forEach(id=>{
        batch.delete(doc(productsCol(),id));
        batch.delete(galleryDocRef(id));
      });
      await batch.commit();
      // 同時備份 localStorage
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}
      return true;
    }catch(e){
      console.warn("Firestore 寫入失敗，改用 localStorage",e);
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));return false}catch(e2){return false}
    }
  }
};

function normalizeProduct(product){
  product.photos=product.photos||[product.img,product.img2].filter(Boolean);
  if(typeof product.photoCount!=="number")product.photoCount=product.photos.filter(Boolean).length;
  product.dimensions=product.dimensions||{width:"",depth:"",height:""};
  product.specs=Array.isArray(product.specs)?product.specs:[];
  product.status=product.status==="archived"?"archived":"active";
  const hasDims=product.dimensions.width||product.dimensions.depth||product.dimensions.height;
  if(!product.specs.length&&product.size&&!hasDims){
    product.specs=[{label:"尺寸備註",value:product.size}];
  }
  return product;
}

function extractGdriveId(url){
  const patterns=[/\/file\/d\/([a-zA-Z0-9_-]+)/,/[?&]id=([a-zA-Z0-9_-]+)/,/\/d\/([a-zA-Z0-9_-]+)/];
  for(const pattern of patterns){
    const match=String(url).match(pattern);
    if(match)return match[1];
  }
  return null;
}
function convertGdriveUrl(url){
  const id=extractGdriveId(url);
  return id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`:url;
}
function normalizePhotoUrl(url){
  return /drive\.google\.com/i.test(url)?convertGdriveUrl(url):url;
}

function getMainCat(id){return state.catalog.find(c=>c.id===id)}
function getMainName(id){return id==="全部"?"全部":(getMainCat(id)?.name||(id?id:"待分類"))}
function getSubName(mainId,subId){return (getMainCat(mainId)?.subs||[]).find(s=>s.id===subId)?.name||""}
function withCm(value){
  const text=String(value||"").trim();
  if(!text)return "";
  if(/[a-zA-Z公分吋尺]/.test(text))return text;
  if(/^[\d\s.xX×*~\-–—]+$/.test(text))return `${text} cm`;
  return text;
}
function getSizeSummary(product){
  const d=product.dimensions||{};
  const parts=[];
  if(d.width)parts.push(`寬 ${withCm(d.width)}`);
  if(d.depth)parts.push(`深 ${withCm(d.depth)}`);
  if(d.height)parts.push(`高 ${withCm(d.height)}`);
  return parts.length?parts.join(" x "):(product.size||"尺寸洽詢");
}
function formatPrice(price){
  const text=String(price||"").trim();
  if(!text)return "";
  // 純數字／千分位符號才自動補 NT$，其他文字（例如「洽詢」）原樣顯示
  if(/^[\d,，]+$/.test(text))return `NT$ ${text}`;
  return text;
}

    return;
  }
  list.innerHTML="";
  products.forEach(product=>{
    const item=document.createElement("div");
    item.className="favorite-item";
    const photo=normalizePhotoUrl((product.photos||[])[0]||"");
    item.innerHTML=`
      <img src="${photo}" alt="">
      <div>
        <div class="favorite-item-name">${escapeHTML(product.name)}</div>
        <div class="favorite-item-size">${escapeHTML(getSizeSummary(product))}</div>
      </div>
      <button title="移除">×</button>
    `;
    item.querySelector("img").onclick=()=>openProductDetail(product.id);
    item.querySelector(".favorite-item-name").onclick=()=>openProductDetail(product.id);
    item.querySelector("button").onclick=()=>toggleFavorite(product.id);
    list.appendChild(item);
  });
}

let lbImages=[],lbCurrent=0,lbScale=1,lbProduct=null,lastFocusedElement=null;
let lbTouchStartX=0,lbTouchStartY=0;
let lbZoomArmed=true,lbZoomArmTimer=null;
function openProductDetail(id){
  const product=state.products.find(p=>p.id===id);
  if(!product)return;
  lbProduct=product;
  const cover=(product.photos||[]).filter(Boolean).map(normalizePhotoUrl);
  lbImages=cover.length?cover:[sampleSvg(product.name||"商品圖片","#8a7b68","#5b5448")];
  lbCurrent=0;
  lastFocusedElement=document.activeElement;
  const lightbox=document.getElementById("lightbox");
  lightbox.classList.add("open");
  lightbox.setAttribute("aria-hidden","false");
  document.body.classList.add("lightbox-open");
  lbRender();
  document.querySelector(".lb-close").focus();
  history.replaceState(null,"",`#product-${id}`);
  // 商品文件的封面只是縮圖，燈箱一律要換成 gallery 子文件裡的原始畫質照片
  const totalCount=product.photoCount??cover.length;
  if(totalCount>0){
    Storage.getGallery(id).then(full=>{
      if(!full.length||lbProduct!==product)return;
      const photos=full.map(normalizePhotoUrl);
      lbImages=photos;
      lbRender();
    });
  }
}
function closeLightbox(){
  const lightbox=document.getElementById("lightbox");
  lightbox.classList.remove("open");
  lightbox.setAttribute("aria-hidden","true");
  document.body.classList.remove("lightbox-open");
  resetZoom();
  if(lastFocusedElement instanceof HTMLElement)lastFocusedElement.focus();
  lastFocusedElement=null;
  if(location.hash.startsWith("#product-"))history.replaceState(null,"",location.pathname+location.search);
}
function updateLbFavoriteBtn(){
  const btn=document.getElementById("lbFavoriteBtn");
  if(!btn||!lbProduct)return;
  const active=state.favorites.includes(lbProduct.id);
  btn.classList.toggle("active",active);
  btn.textContent=active?"♥":"♡";
  btn.setAttribute("aria-label",active?"從喜愛清單移除":"加入喜愛清單");
}
function toggleLbFavorite(){
  if(!lbProduct)return;
  toggleFavorite(lbProduct.id);
  updateLbFavoriteBtn();
}
function lbRender(){
  const img=document.getElementById("lbImg");
  const thumbs=document.getElementById("lbThumbs");
  const counter=document.getElementById("lbCounter");
  const info=document.getElementById("lbInfo");
  img.src=lbImages[lbCurrent]||"";
  img.alt=lbProduct?.name?`${lbProduct.name} 商品照片 ${lbCurrent+1}`:"商品照片";
  resetZoom();
  document.getElementById("lbPrev").style.display=lbImages.length>1?"grid":"none";
  document.getElementById("lbNext").style.display=lbImages.length>1?"grid":"none";
  counter.textContent=lbImages.length>1?`${lbCurrent+1} / ${lbImages.length}`:"";
  thumbs.innerHTML="";
  if(lbImages.length>1){
    lbImages.forEach((src,index)=>{
      const thumb=document.createElement("img");
      thumb.className="lb-thumb"+(index===lbCurrent?" active":"");
      thumb.src=src;
      thumb.alt="";
      thumb.onclick=()=>{lbCurrent=index;lbRender()};
      thumbs.appendChild(thumb);
    });
  }
  if(lbProduct){
    const d=lbProduct.dimensions||{};
    const specs=(lbProduct.specs||[]).filter(spec=>spec.part||spec.w||spec.d||spec.h||spec.label);
    const cat=getSubName(lbProduct.mainCat,lbProduct.subCat)||getMainName(lbProduct.mainCat);
    const rawDesc=lbProduct.desc||"";
    const desc=/<[a-z][\s\S]*>/i.test(rawDesc)?rawDesc:escapeHTML(rawDesc).replace(/\r\n|\r|\n/g,"<br>");

    // 判斷是新格式還是舊格式規格
    const isNewSpec=specs.length>0&&("part" in specs[0]);

    let specsHtml="";
    if(isNewSpec){
      // 檢查哪些欄位有資料，決定要顯示的欄位
      const hasW=specs.some(s=>s.w);
      const hasD=specs.some(s=>s.d);
      const hasH=specs.some(s=>s.h);
      if(specs.length){
        specsHtml=`
          <div class="lb-spec-title">詳細尺寸規格</div>
          <div class="lb-spec-table-wrap">
            <table class="lb-spec-table">
              <thead><tr>
                <th></th>
                ${hasW?`<th>寬（W）</th>`:""}
                ${hasD?`<th>深（D）</th>`:""}
                ${hasH?`<th>高（H）</th>`:""}
              </tr></thead>
              <tbody>
                ${specs.map(spec=>`<tr>
                  <td class="lb-spec-part">${escapeHTML(spec.part||"—")}</td>
                  ${hasW?`<td>${escapeHTML(withCm(spec.w)||"—")}</td>`:""}
                  ${hasD?`<td>${escapeHTML(withCm(spec.d)||"—")}</td>`:""}
                  ${hasH?`<td>${escapeHTML(withCm(spec.h)||"—")}</td>`:""}
                </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      }
    }else if(specs.length){
      // 舊格式：label/value 列表
      specsHtml=`
        <div class="lb-spec-title">詳細規格</div>
        <div class="lb-detail-list">
          ${specs.map(spec=>`<div class="lb-detail-row"><span>${escapeHTML(spec.label)}</span><strong>${escapeHTML(withCm(spec.value)||"—")}</strong></div>`).join("")}
        </div>`;
    }

    info.innerHTML=`
      <div class="lb-cat-row">
        <div class="lb-product-cat">${escapeHTML(cat)}</div>
        <button class="lb-favorite" id="lbFavoriteBtn" onclick="toggleLbFavorite()" aria-label="加入喜愛清單">♡</button>
      </div>
      <div class="lb-product-title">${escapeHTML(lbProduct.name||"")}</div>
      ${lbProduct.price?`<div class="lb-product-price">${escapeHTML(formatPrice(lbProduct.price))}</div>`:""}
      ${lineInquireBtnHtml(lbProduct)}
      <div class="lb-spec-title">基本尺寸</div>
      <div class="lb-spec-grid">
        <div class="lb-spec-box"><div class="lb-spec-label">寬 W</div><div class="lb-spec-value">${escapeHTML(withCm(d.width)||"—")}</div></div>
        <div class="lb-spec-box"><div class="lb-spec-label">深 D</div><div class="lb-spec-value">${escapeHTML(withCm(d.depth)||"—")}</div></div>
        <div class="lb-spec-box"><div class="lb-spec-label">高 H</div><div class="lb-spec-value">${escapeHTML(withCm(d.height)||"—")}</div></div>
      </div>
      ${specsHtml}
      ${desc?`<div class="lb-spec-title">商品說明</div><div class="lb-product-note">${desc}</div>`:""}
    `;
    updateLbFavoriteBtn();
  }
}
function lineInquireBtnHtml(product){
  const lineId=(state.contact?.line||"").trim();
  if(!lineId)return "";
  // LINE 的訊息預帶網址不支援夾帶圖片，改成附上商品連結，賣家點開就能直接看到照片
  const productUrl=`${location.origin}${location.pathname}#product-${product.id}`;
  const msg=`您好，我想詢問這件商品：${product.name||""}\n${productUrl}`;
  const url=`https://line.me/R/oaMessage/${encodeURIComponent(lineId)}/?${encodeURIComponent(msg)}`;
  return `<a class="lb-inquire-btn" href="${escapeHTML(url)}" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    LINE 詢問這件商品
  </a>`;
}
async function inquireAllFavorites(){
  const lineId=(state.contact?.line||"").trim();
  if(!lineId){toast("店家尚未設定 LINE");return}
  const products=state.favorites.map(id=>state.products.find(p=>p.id===id)).filter(p=>p&&p.status!=="archived");
  if(!products.length){toast("喜愛清單是空的");return}
  const ids=products.map(p=>p.id);
  // 先同步開一個空白分頁佔位，避免非同步等待期間被瀏覽器判定成彈窗封鎖
  const win=window.open("","_blank","noopener");
  let wishlistUrl;
  try{
    const code=await Storage.createWishlist(ids);
    wishlistUrl=`${location.origin}${location.pathname}#w=${code}`;
  }catch(e){
    console.warn("心願清單短碼建立失敗，改用完整網址",e);
    wishlistUrl=`${location.origin}${location.pathname}#wishlist=${ids.join(",")}`;
  }
  // 分隔線固定 10 個字元，不會因為太長在手機上被迫換行；下面留白給客人接著打字
  const msg=`您好，我想詢問以下收藏商品（共 ${products.length} 件）：\n${wishlistUrl}\n——————————\n`;
  const url=`https://line.me/R/oaMessage/${encodeURIComponent(lineId)}/?${encodeURIComponent(msg)}`;
  if(win)win.location.href=url;else window.open(url,"_blank","noopener");
}
function renderSharedWishlist(ids){
  const container=document.getElementById("wishlistItems");
  if(!ids){
    container.innerHTML='<div class="favorites-empty">這個連結已經失效了（超過 30 天，或連結有誤）。</div>';
    openModal("wishlistModal");
    return;
  }
  const products=ids.map(id=>state.products.find(p=>p.id===id)).filter(p=>p&&p.status!=="archived");
  if(!products.length){
    container.innerHTML='<div class="favorites-empty">找不到這些商品，可能已下架。</div>';
  }else{
    container.innerHTML=products.map(p=>{
      const photo=normalizePhotoUrl((p.photos||[])[0]||"");
      return `
        <div class="favorite-item" data-id="${escapeHTML(p.id)}" style="cursor:pointer">
          <img src="${photo}" alt="">
          <div>
            <div class="favorite-item-name">${escapeHTML(p.name||"")}</div>
            <div class="favorite-item-size">${escapeHTML(getSizeSummary(p))}</div>
          </div>
          <button title="查看商品">→</button>
        </div>`;
    }).join("");
    container.querySelectorAll(".favorite-item").forEach(el=>{
      el.addEventListener("click",()=>openProductDetail(el.dataset.id));
    });
  }
  openModal("wishlistModal");
}
function lbNav(dir){
  if(!lbImages.length)return;
  lbCurrent=(lbCurrent+dir+lbImages.length)%lbImages.length;
  lbRender();
}
function applyZoom(){
  document.getElementById("lbImg").style.transform=`scale(${lbScale})`;
  document.getElementById("lbStage").classList.toggle("zoomed",lbScale>1);
}
function resetZoom(){
  lbScale=1;
  document.getElementById("lbImg").style.transformOrigin="center center";
  applyZoom();
  // 剛開燈箱／切換照片時，滑鼠常常還停在剛剛點擊的位置（就已經在圖片範圍內），
  // 這時任何一點點滑鼠晃動都會被誤判成「移進圖片」而自動放大。短暫延遲後才
  // 允許滑過放大，確保放大一定是使用者之後真的動了滑鼠才觸發。
  lbZoomArmed=false;
  clearTimeout(lbZoomArmTimer);
  lbZoomArmTimer=setTimeout(()=>{lbZoomArmed=true},350);
}
const lbStage=document.getElementById("lbStage");
lbStage.addEventListener("mouseenter",()=>{
  if(!lbZoomArmed)return;
  lbScale=2.35;
  applyZoom();
});
lbStage.addEventListener("mousemove",event=>{
  const rect=lbStage.getBoundingClientRect();
  const x=((event.clientX-rect.left)/rect.width*100).toFixed(2);
  const y=((event.clientY-rect.top)/rect.height*100).toFixed(2);
  document.getElementById("lbImg").style.transformOrigin=`${x}% ${y}%`;
  if(lbZoomArmed&&lbScale===1){
    lbScale=2.35;
    applyZoom();
  }
});
lbStage.addEventListener("mouseleave",resetZoom);
lbStage.addEventListener("wheel",event=>{
  event.preventDefault();
  lbScale=Math.max(1.5,Math.min(3.6,lbScale+(event.deltaY<0?.18:-.18)));
  applyZoom();
},{passive:false});
lbStage.addEventListener("touchstart",event=>{
  const touch=event.changedTouches[0];
  lbTouchStartX=touch.clientX;
  lbTouchStartY=touch.clientY;
},{passive:true});
lbStage.addEventListener("touchend",event=>{
  const touch=event.changedTouches[0];
  const deltaX=touch.clientX-lbTouchStartX;
  const deltaY=touch.clientY-lbTouchStartY;
  if(Math.abs(deltaX)>40&&Math.abs(deltaX)>Math.abs(deltaY))lbNav(deltaX<0?1:-1);
},{passive:true});
document.getElementById("lightbox").addEventListener("click",event=>{
  if(event.target.id==="lightbox")closeLightbox();
});
document.addEventListener("keydown",event=>{
  if(!document.getElementById("lightbox").classList.contains("open"))return;
  if(event.key==="Escape")closeLightbox();
  if(event.key==="ArrowRight")lbNav(1);
  if(event.key==="ArrowLeft")lbNav(-1);
});

function renderContact(){
  const c=state.contact;
  document.getElementById("fbLink").href=c.fbUrl||"#";
  document.getElementById("lineFab").href=c.lineUrl||"#";
  document.getElementById("mapFab").href=c.mapUrl||"#";
  const items=[
    {label:"地址",val:c.addr},
    {label:"電話",val:c.phone},
    {label:"LINE",val:c.line},
    {label:"營業時間",val:c.hours},
    {label:"信箱",val:c.email}
  ].filter(item=>item.val);
  document.getElementById("contactItems").innerHTML=items.map(item=>`<span class="item"><b>${escapeHTML(item.label)}</b>${escapeHTML(item.val)}</span>`).join('<span class="dot">·</span>');
}
document.querySelectorAll(".modal-overlay").forEach(overlay=>{
  overlay.addEventListener("click",event=>{if(event.target===overlay)overlay.classList.remove("open")});
});

/* ── 將函式掛到 window，讓 HTML onclick 可以呼叫（module 作用域限制）── */
Object.assign(window,{
  toggleFavoritesPanel,
  closeLightbox,
  lbNav,
  closeModal,
  openModal,
  toggleLbFavorite,
  inquireAllFavorites,
  handleSearchInput,
  clearSearch,
  toggleMobileNav,
});
/* ── 啟動：從 Firebase 載入資料 ────────────────────────────────── */
(async()=>{
  // 分享出去的心願清單短碼（例如 LINE 詢問訊息裡帶的網址）提早發出讀取請求，
  // 跟商品資料一起平行載入，不用等商品載完才開始等心願清單。
  const wishlistCodeMatch=location.hash.match(/^#w=(.+)$/);
  const wishlistPromise=wishlistCodeMatch?Storage.getWishlist(wishlistCodeMatch[1]):null;

  const loadingEl=document.createElement("div");
  loadingEl.id="site-loading";
  loadingEl.style.cssText="position:fixed;inset:0;z-index:9999;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'Noto Serif TC',serif;color:var(--muted)";
  loadingEl.innerHTML='<div style="font-size:28px;letter-spacing:.1em;color:var(--charcoal)">信通家俱行</div><div style="font-size:13px;letter-spacing:.08em">載入中...</div>';
  document.body.appendChild(loadingEl);

  try{
    const saved=await Storage.get();
    if(saved&&saved.products&&saved.products.length){
      saved.products=saved.products.map(p=>({...p,photos:p.photos||[p.img,p.img2].filter(Boolean)}));
      Object.assign(state,saved);
    }else{
      // 沒有雲端資料，試試 localStorage
      const local=localStorage.getItem(STORAGE_KEY);
      if(local){
        const data=JSON.parse(local);
        if(data.products)data.products=data.products.map(p=>({...p,photos:p.photos||[p.img,p.img2].filter(Boolean)}));
        Object.assign(state,data);
        await Storage.set(data);
        toast("資料已從本機同步到 Firebase ☁️");
      }
    }
  }catch(e){
    const local=localStorage.getItem(STORAGE_KEY);
    if(local){try{Object.assign(state,JSON.parse(local))}catch(e2){}}
  }

  state.products=state.products.map(normalizeProduct);
  state.products.forEach((p,i)=>{if(typeof p.sortOrder!=="number")p.sortOrder=i});
  // 喜愛清單一律以「這台瀏覽器」的本機資料為準，不使用從雲端讀回來的舊資料
  state.favorites=loadFavoritesLocal();

  loadingEl.remove();
  applyPageText();
  renderCategories();
  renderProducts();
  renderContact();
  renderFavorites();
  // 分享出去的商品連結／收藏清單連結（例如 LINE 詢問訊息裡帶的網址）直接開啟對應畫面
  const hashMatch=location.hash.match(/^#product-(.+)$/);
  const wishlistMatch=location.hash.match(/^#wishlist=(.+)$/);
  if(hashMatch){
    const sharedProduct=state.products.find(p=>p.id===hashMatch[1]);
    if(sharedProduct)openProductDetail(sharedProduct.id);
  }else if(wishlistCodeMatch){
    renderSharedWishlist(await wishlistPromise);
  }else if(wishlistMatch){
    // 舊格式的完整網址（短碼功能上線前分享出去的連結），繼續支援
    const ids=wishlistMatch[1].split(",").filter(Boolean);
    if(ids.length)renderSharedWishlist(ids);
  }
})();
</script>
