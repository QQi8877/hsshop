/* 版面：固定的上方選單＋四大區塊（前兩塊剛好一個畫面高，內容跟著畫面大小縮放）；配色、字型沿用信通家俱行網站 */
:root{
  --bg:#faf6ef;--sunken:#f3ebde;--surface:#fffdf9;--hero:#f2eadc;--frame:#efe7dc;--ground:#e4d8c5;
  --line:#e2d6c3;--line-strong:#857560;--text:#221d18;--text2:#5a4f43;--text3:#6e6253;
  --brand:#8a4520;--moss:#4f5d3a;--moss-sub:#e4ead8;--line-green:#06803a;
  --ink:#221d18;--ink-text:#f6efe4;--ink-text2:#c9bba6;--ink-accent:#e0915c;
  --shadow-sm:0 1px 2px rgba(34,29,24,.08);--shadow-md:0 6px 20px rgba(34,29,24,.10);
  --font:"HS Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-brand:"HS Serif","Noto Serif TC","Songti TC","PMingLiU",serif;
  --navh:62px;--top:calc(var(--navh) + env(safe-area-inset-top,0px));
  --avail:calc(100vh - var(--top));--gutter:40px;
  color-scheme:light;
}
@supports (height:100svh){:root{--avail:calc(100svh - var(--top))}}
@media (max-width:760px){:root{--gutter:16px;--navh:58px}}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.7}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid #34536b;outline-offset:3px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
.wrap{width:100%;max-width:1680px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* ── 上方選單（跟網站一樣固定在最上面） ── */
.nav{position:fixed;inset:0 0 auto;z-index:60;height:var(--top);padding-top:env(safe-area-inset-top,0px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;
  padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));
  background:rgba(250,246,239,.95);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.logo{font-family:var(--font-brand);font-weight:600;font-size:21px;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--brand)}
.search{display:flex;align-items:center;gap:8px;width:min(340px,30vw);height:40px;border:1px solid var(--line-strong);border-radius:999px;padding:0 16px;background:var(--surface);color:var(--text3);font-size:14px;white-space:nowrap;overflow:hidden}
.search svg{flex:none}
.search .short{display:none}
.nav-end{display:flex;justify-content:flex-end;align-items:center;gap:22px}
.links{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-size:14.5px;white-space:nowrap}
.links a:hover{color:var(--brand)}
.fav{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--sunken);font-weight:600;font-size:14.5px;white-space:nowrap}
.fav b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--brand);color:#fff;font-size:12px}
.burger{display:none;width:40px;height:40px;place-items:center}
@media (max-width:1060px){.links{gap:14px}.search{width:min(260px,26vw)}}
@media (max-width:760px){
  .nav{grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .logo{font-size:19px}
  .search{width:auto;justify-self:start;max-width:130px;padding:0 12px}
  .search .long{display:none}.search .short{display:inline}
  .links{display:none}.nav-end{display:contents}
  .fav{height:40px;padding:0 10px;gap:6px}.fav .t{display:none}
  .burger{display:grid}
}

/* ── 四大區塊 ── */
main{padding-top:var(--navh)}
.blk{position:relative}
#b1{background:var(--hero);height:var(--avail)}
#b2{background:var(--surface);height:var(--avail)}
#b3{background:var(--bg)}
#b4{background:var(--bg)}

/* 1. 首頁大圖：剛好一個畫面 */
.hero{height:100%;max-width:1680px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:4vw;
  padding-block:clamp(16px,4vh,48px);padding-left:max(calc(var(--gutter) + 2vw),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.hero-text{max-width:600px}
.eyebrow{margin:0 0 clamp(8px,1.6vh,18px);color:var(--brand);font-size:clamp(11px,1vw,13px);font-weight:600;letter-spacing:.2em}

.hero-sub{margin:clamp(6px,1.4vh,16px) 0 0;color:var(--brand);font-weight:600;letter-spacing:.12em;font-size:clamp(16px,min(1.7vw,calc(var(--avail) * .032)),24px)}

@media (max-aspect-ratio:1/1){

/* 2. 本月選品＋商品分類：剛好一個畫面，照片大小用畫面的寬、高一起算 */
.b2{height:100%;display:flex;flex-direction:column;justify-content:center;gap:var(--gap);padding-block:var(--pad);
  --cols:4;--rows:1;--gap:clamp(12px,1.5vw,22px);--text:62px;--head:48px;--pad:clamp(12px,3.2vh,40px);
  --cats-min:clamp(96px,calc(var(--avail) * .18),170px);--cats-max:300px;
  --colw:calc((min(100vw,1680px) - 2 * var(--gutter) - (var(--cols) - 1) * var(--gap)) / var(--cols));
  --fit:calc((var(--avail) - 2 * var(--pad) - var(--head) - var(--cats-min) - 2 * var(--gap) - (var(--rows) - 1) * var(--gap)) / var(--rows) - var(--text));
  --img:max(64px,min(var(--colw),var(--fit)));
  /* 照片定好以後，剩下的高度給分類磚（有上限），整塊盡量填滿畫面 */
  --cats:clamp(var(--cats-min),calc(var(--avail) - 2 * var(--pad) - var(--head) - var(--rows) * (var(--img) + var(--text)) - (var(--rows) - 1) * var(--gap) - 2 * var(--gap) - 2px),var(--cats-max))}
.sec-head{height:var(--head);display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-head h2,.list-head h2{display:flex;align-items:center;gap:14px;margin:0;font-size:clamp(20px,2vw,27px);font-weight:600;letter-spacing:.04em}
.sec-head h2 i,.list-head h2 i{flex:none;width:28px;height:3px;border-radius:2px;background:var(--brand)}
.sec-head a{color:var(--brand);font-weight:600;font-size:14px;white-space:nowrap}
.picks{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}
.pimg,.card .ph{position:relative;border-radius:14px;background:var(--frame);display:grid;place-items:center}
.pimg{height:var(--img)}
.pimg img{width:auto;height:76%;max-width:80%;object-fit:contain}
.pimg,.card .ph{background:#fffaf3;isolation:isolate;overflow:hidden}
.pimg::before,.card .ph::before{content:"";position:absolute;inset:0;z-index:3;background:#efece7;mix-blend-mode:multiply;pointer-events:none}
.heart,.tag{z-index:4}
.pimg img.photo{width:88%;height:88%;max-width:none}
.card .ph img.photo{width:100%;height:100%}
.cimg img.photo{width:76%;height:76%;object-fit:contain}
.disc img.photo{width:70%;height:70%;object-fit:contain;filter:saturate(.94) contrast(.97) brightness(1.02)}
.pcard h3,.card h3{margin:10px 0 0;font-size:15px;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard p,.card p{margin:4px 0 0;font-size:13px;color:var(--text3);line-height:1.4}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-sm);font-size:16px;color:var(--text)}
.tag{position:absolute;top:12px;left:12px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text)}
.cats{height:var(--cats);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.cat{min-width:0;border-radius:16px;background:var(--sunken);display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,22px);padding:10px 14px;text-align:left}
.cat:hover{background:#ebe0cf}
.cimg{flex:none;width:calc(var(--cats) * .56);height:calc(var(--cats) * .56);border-radius:50%;background:#fffaf3;display:grid;place-items:center;overflow:hidden}
.cimg img{width:68%}
.cat b{display:block;font-size:clamp(15px,1.3vw,19px);font-weight:600;line-height:1.35;white-space:nowrap}
.cat small{display:block;font-size:13px;color:var(--text3)}
.cat-fav{background:var(--moss);color:#fff;flex-direction:column;text-align:center;gap:6px}
.cat-fav:hover{background:#435032}
.cat-fav strong{font-size:clamp(15px,1.3vw,19px);font-weight:600;line-height:1.4}
.cat-fav small{color:var(--moss-sub);border-bottom:1px solid currentColor;line-height:1.5}
@media (max-aspect-ratio:1/1){
  .b2{--cols:2;--rows:2;--text:54px;--cats-min:clamp(84px,calc(var(--avail) * .15),126px);--cats-max:150px}
  .cat{flex-direction:column;gap:3px;padding:6px 4px;text-align:center}
  .cimg{width:calc(var(--cats) * .46);height:calc(var(--cats) * .46)}
  .cat b{font-size:13.5px}.cat small{font-size:11.5px}
  .cat-fav strong{font-size:13px;line-height:1.35}.cat-fav small{font-size:11px;border:0}
}
@media (max-width:480px){.cat-fav small{display:none}}
@media (max-width:760px){.pcard h3{font-size:14px}.heart{width:30px;height:30px;top:8px;right:8px;font-size:14px}.tag{top:9px;left:9px;font-size:11px}}

/* 3. 商品列表 */
.listing{padding-block:clamp(28px,5vh,56px) clamp(48px,8vh,88px)}
.list-head{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
.list-head small{color:var(--brand);font-size:13px;font-weight:600}
.list-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:calc(var(--top) + 18px);display:flex;flex-direction:column;gap:4px}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;color:var(--text2);text-align:left}
.rail button:hover{background:var(--sunken)}
.rail button[aria-pressed="true"]{background:var(--text);color:#fff}
.rail button small{font-weight:400;font-size:12.5px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:28px 18px}
.card .ph{aspect-ratio:1;border-radius:12px}
.card .ph img{width:74%;height:74%;object-fit:contain}
.card h3{white-space:normal}
@media (max-width:760px){

  .list-body{grid-template-columns:96px minmax(0,1fr);gap:10px;margin-left:calc(-1 * max(var(--gutter),env(safe-area-inset-left,0px)))}
  .rail{top:calc(var(--top) + 8px);padding:8px 6px 12px;border-radius:0 16px 16px 0;background:linear-gradient(90deg,#efe5d6 55%,rgba(239,229,214,0))}
  .rail button{padding:8px 10px;font-size:13.5px;border-radius:12px;white-space:nowrap}
  .rail button small{display:none}
  .rail button[aria-pressed="true"]{background:var(--brand)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px}
  .card h3{font-size:14px}
}

/* 4. 購買須知＋聯繫我們 */
.buy{padding-block:clamp(44px,8vh,80px) clamp(40px,7vh,72px)}
.buy h2{margin:0 0 18px;text-align:center;font-size:clamp(24px,2.4vw,32px);font-weight:600;letter-spacing:.04em}
.faq{max-width:760px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4px;font-weight:600;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:14px;height:14px;background:linear-gradient(var(--brand),var(--brand)) center/14px 2px no-repeat,linear-gradient(var(--brand),var(--brand)) center/2px 14px no-repeat}
.faq details[open] summary::after{background:linear-gradient(var(--brand),var(--brand)) center/14px 2px no-repeat}
.faq .ans{margin:0;padding:0 4px 16px;color:var(--text2);font-size:14.5px;white-space:pre-line}
.buy-ask{margin:26px 0 12px;text-align:center;color:var(--text2)}
.btn-green{display:flex;width:max-content;max-width:100%;margin:0 auto;height:48px;align-items:center;padding:0 24px;border-radius:999px;background:var(--line-green);color:#fff;font-weight:600}
.contact{background:var(--ink);color:var(--ink-text);padding-top:clamp(52px,9vh,92px)}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;max-width:1240px}
.contact h2{margin:0;font-size:clamp(26px,2.6vw,34px);font-weight:600;letter-spacing:.04em}
.contact .en{margin:6px 0 18px;color:var(--ink-accent);letter-spacing:.2em;font-size:13px;font-weight:600}
.contact p{margin:0;color:var(--ink-text2)}
.c-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.c-btns button{height:46px;padding:0 20px;border-radius:999px;border:1px solid rgba(246,239,228,.35);font-weight:600}
.c-btns .primary{background:var(--brand);border-color:var(--brand)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid rgba(246,239,228,.18)}
.rows li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid rgba(246,239,228,.18);font-size:15px;overflow-wrap:anywhere}

.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-top:clamp(44px,8vh,84px);padding-block:26px calc(104px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(246,239,228,.12);font-size:13px;color:var(--ink-text2);letter-spacing:.04em}
@media (max-width:760px){.contact-grid{grid-template-columns:minmax(0,1fr);gap:30px}.rows li{grid-template-columns:88px minmax(0,1fr)}}

/* ── 捲動效果 A：疊卡片 ── 每塊黏在畫面上，下一塊從下面滑上來蓋住；被蓋住的那塊微微縮小、變暗 */
html[data-fx="a"] .blk{position:sticky;top:var(--top);transform:scale(var(--sc,1));transform-origin:var(--origin,50% 50%)}
html[data-fx="a"] #b1{z-index:1}html[data-fx="a"] #b2{z-index:2}html[data-fx="a"] #b3{z-index:3}html[data-fx="a"] #b4{z-index:4}
html[data-fx="a"] #b2,html[data-fx="a"] #b3,html[data-fx="a"] #b4{border-radius:28px 28px 0 0;box-shadow:0 -16px 40px rgba(50,32,16,calc(.2 * var(--q,0)))}
html[data-fx="a"] .blk::after{content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;background:#1d150e;opacity:var(--dim,0);pointer-events:none}

/* ── 捲動效果 B：整頁翻頁 ── 一次換一整塊、自動停好；商品列表那塊可以自由捲 */
html[data-fx="b"]{scroll-snap-type:y mandatory;scroll-padding-top:var(--top)}
html[data-fx="b"] .blk{scroll-snap-align:start}
html[data-fx="b"] #b1,html[data-fx="b"] #b2{scroll-snap-stop:always}
html[data-fx="b"] #b4{min-height:var(--avail)}
.dots{display:none;position:fixed;z-index:55;right:max(14px,calc(env(safe-area-inset-right,0px) + 8px));top:50%;transform:translateY(-50%);flex-direction:column;gap:10px}
html[data-fx="b"] .dots{display:flex}
.dots button{width:10px;height:10px;border-radius:999px;background:rgba(34,29,24,.28);box-shadow:0 0 0 2px rgba(255,253,249,.75);transition:height .3s ease,background .3s ease}
.dots button[aria-current="true"]{height:30px;background:var(--brand)}
@media (max-width:760px){.dots{right:max(4px,calc(env(safe-area-inset-right,0px) + 2px));gap:8px}.dots button{width:7px;height:7px}.dots button[aria-current="true"]{height:22px}}
.pagename{position:fixed;z-index:55;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-6px);padding:6px 14px;border-radius:999px;background:rgba(34,29,24,.86);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.pagename.show{opacity:1;transform:translate(-50%,0)}

/* ── 捲動效果 C：放大展開 ── 下一塊先是一張小一點的圓角卡片，捲上來時放大到滿版 */
html[data-fx="c"],html[data-fx="c"] body{background:var(--ground)}
html[data-fx="c"] #b2,html[data-fx="c"] #b3,html[data-fx="c"] #b4{transform-origin:50% 0;transform:scale(var(--grow,1));
  border-radius:calc(40px * (1 - var(--p,1))) calc(40px * (1 - var(--p,1))) 0 0;box-shadow:0 -12px 34px rgba(50,32,16,calc(.6 * var(--p,1) * (1 - var(--p,1))))}

/* 動作少一點（系統設定「減少動態效果」）：不縮放、不變暗、不展開 */
@media (prefers-reduced-motion:reduce){.cue::after{animation:none}.dots button,.pagename{transition:none}}

/* ── 示意頁的切換列 ── */
.fxbar{position:fixed;z-index:70;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(34,29,24,.92);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 20px)}
.fxbar .lbl{padding:0 10px 0 12px;font-size:12px;color:var(--ink-text2);white-space:nowrap}
.fxbar button{height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink-text)}
.fxbar button:hover{background:rgba(255,255,255,.08)}
.fxbar button[aria-pressed="true"]{background:var(--brand);color:#fff}
.fxbar button .s{display:none}
.tip{position:fixed;z-index:70;left:50%;bottom:calc(68px + env(safe-area-inset-bottom,0px));transform:translate(-50%,6px);width:max-content;max-width:min(560px,calc(100vw - 24px));padding:10px 16px;border-radius:14px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-md);border:1px solid var(--line);font-size:14px;line-height:1.6;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
.tip.show{opacity:1;transform:translate(-50%,0)}
.tip b{color:var(--brand)}
@media (max-width:560px){
  .fxbar{gap:2px;padding:4px}
  .fxbar .lbl{display:none}
  .fxbar button{height:36px;padding:0 10px;font-size:13px}
  .fxbar button .l{display:none}.fxbar button .s{display:inline}
}

function kindOf(p){
  var s=p.sub||"",n=p.n||"";
  if(/鋁架/.test(n+s)||/廚具電器架|書架/.test(s))return"shelf";
  if(/鞋櫃/.test(s))return/坐/.test(n)?"bench":"cabinet";
  if(/衣櫃/.test(s))return"cabinet";
  if(/麻將/.test(s+n))return"mahjong";
  if(/茶几|邊桌/.test(s)&&!/電腦/.test(n))return"side";
  if(/摺疊桌|書桌|梳妝|桌/.test(s)||p.m==="cat-table")return"table";
  if(/藤椅|休閒椅/.test(s))return"rattan";
  if(/板凳/.test(s))return"stool";
  if(/折疊/.test(s))return"fold";
  if(/辦公/.test(s))return"office";
  if(p.m==="cat-storage")return"cabinet";
  return"chair";
}

var byId={};D.products.forEach(function(p){byId[p.id]=p});
var tagDef={};(D.tagDefs||[]).forEach(function(t){tagDef[t.key]=t});
$("#allLink").textContent="全部 "+D.products.length+" 件 →";
$("#picks").innerHTML=D.picks.map(function(id){return byId[id]}).filter(Boolean).map(function(p){
  var t=(p.tags||[]).map(function(k){return tagDef[k]}).filter(Boolean)[0];
  return'<article class="pcard"><div class="pimg">'+photoImg(p,"",p.n)+''+(t?'<span class="tag" style="background:'+esc(t.color)+'">'+esc(t.label)+"</span>":"")+'<span class="heart" aria-hidden="true">♡</span></div><h3>'+esc(p.n)+"</h3><p>"+esc(p.s)+"</p></article>";
}).join("");
var CATPIC={"cat-table":{id:"t",n:"桌",sub:"書桌/工作桌",m:"cat-table"},"cat-chair":{id:"c",n:"椅",sub:"餐椅",m:"cat-chair"},"cat-storage":{id:"s",n:"櫃",sub:"衣櫃",m:"cat-storage"}};
$("#cats").innerHTML=D.cats.map(function(c){
  return'<button class="cat" type="button" data-cat="'+esc(c.id)+'"><span class="cimg">'+photoImg({ph:c.ph,id:(CATPIC[c.id]||{}).id||c.id,n:c.n,m:c.id,sub:(CATPIC[c.id]||{}).sub},"","")+'</span><span><b>'+esc(c.n)+"</b><small>"+c.count+" 件</small></span></button>";
}).join("")+'<button class="cat cat-fav" type="button" data-go="b3"><strong>喜歡的<br>先按 ♡ 收藏</strong><small>選好再一次問老闆 →</small></button>';
var current="all";
function renderList(){
  var list=D.products.filter(function(p){return current==="all"||p.m===current});
  var cat=D.cats.filter(function(c){return c.id===current})[0];
  $("#listTitle").textContent=cat?cat.n:"全部";
  $("#listCount").textContent=list.length+" 件";
  $("#grid").innerHTML=list.map(function(p){return'<article class="card"><div class="ph">'+photoImg(p,"",p.n)+'<span class="heart" aria-hidden="true">♡</span></div><h3>'+esc(p.n)+"</h3><p>"+esc(p.s)+"</p></article>"}).join("");
  $("#rail").innerHTML=[{id:"all",n:"全部",count:D.products.length}].concat(D.cats).map(function(c){return'<button type="button" data-cat="'+esc(c.id)+'" aria-pressed="'+(c.id===current)+'">'+esc(c.n)+"<small>"+c.count+"</small></button>"}).join("");
}
renderList();
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-cat]");
  if(b){current=b.getAttribute("data-cat");renderList();goTo("b3");return}
  var g=e.target.closest("[data-go]");
  if(g){e.preventDefault();goTo(g.getAttribute("data-go"));return}
  if(e.target.closest("[data-demo]"))showTip("示意頁的按鈕不會連出去；正式網站上會連到 LINE、電話、地圖。");
});
$("#faq").innerHTML=(D.buy||[]).map(function(b){return"<details><summary>"+esc(b.q)+'</summary><p class="ans">'+esc(b.a)+"</p></details>"}).join("");
var C=D.contact||{};
$("#rows").innerHTML=[["地址",C.addr],["營業時間",C.hours],["電話",C.phone],["LINE",C.line],["信箱",C.email],["Facebook","信通家俱行 粉絲專頁"]].filter(function(r){return r[1]}).map(function(r){return"<li><span>"+esc(r[0])+"</span>"+esc(r[1])+"</li>"}).join("");

/* ── 捲動效果 ── */
var root=document.documentElement,nav=$(".nav"),mainEl=$("main");
var blocks=[].slice.call(document.querySelectorAll(".blk"));
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var fx="a",tops=[],sticks=[],navB=0,avail=0,active=-1;
var TIPS={
  a:"<b>A 疊卡片（建議）</b>：下一塊從下面滑上來蓋住上一塊，上一塊微微縮小、變暗，像一疊卡片。",
  b:"<b>B 整頁翻頁</b>：輕輕一滑就換一整塊，自動停在剛好的位置；商品列表那塊可以自由捲。",
  c:"<b>C 放大展開</b>：下一塊先是一張小一點的圓角卡片，捲上來時放大到滿版。",
  none:"<b>不加效果</b>：只把前兩塊調成剛好一個畫面，方便跟上面三種比較。"
};
function clamp(v,a,b){return v<a?a:v>b?b:v}
function measure(){
  navB=nav.getBoundingClientRect().bottom;avail=innerHeight-navB;
  var y=mainEl.getBoundingClientRect().top+scrollY+parseFloat(getComputedStyle(mainEl).paddingTop);
  tops=[];sticks=[];
  blocks.forEach(function(b){var h=b.offsetHeight;tops.push(y);y+=h;sticks.push(navB+Math.min(0,avail-h));
    if(fx==="a"){b.style.top=sticks[sticks.length-1]+"px";b.style.setProperty("--origin",h>avail+1?"50% "+(h-avail/2)+"px":"50% 50%")}
  });
}
function update(){
  var sy=scrollY,i,p;
  if(fx==="a"){
    for(i=0;i<blocks.length;i++){
      p=0;
      if(i+1<blocks.length&&!reduce){var nt=Math.max(tops[i+1]-sy,sticks[i+1]);p=clamp((innerHeight-nt)/avail,0,1)}
      blocks[i].style.setProperty("--sc",(1-.06*p).toFixed(4));
      blocks[i].style.setProperty("--dim",(.42*p).toFixed(3));
      if(i+1<blocks.length)blocks[i+1].style.setProperty("--q",Math.min(1,p*3).toFixed(3));
    }
  }else if(fx==="c"){
    for(i=1;i<blocks.length;i++){
      p=reduce?1:clamp((innerHeight-(tops[i]-sy))/avail,0,1);
      blocks[i].style.setProperty("--grow",(.82+.18*p).toFixed(4));
      blocks[i].style.setProperty("--p",p.toFixed(3));
    }
  }
  var a=0;for(i=0;i<blocks.length;i++){if(tops[i]-sy<=navB+avail*.45)a=i}
  if(a!==active){
    active=a;
    [].forEach.call(document.querySelectorAll("#dots button"),function(d,j){d.setAttribute("aria-current",String(j===a))});
    if(fx==="b"){var pn=$("#pagename");pn.textContent=blocks[a].getAttribute("data-name");pn.classList.add("show");clearTimeout(pn._t);pn._t=setTimeout(function(){pn.classList.remove("show")},1300)}
  }
}
var ticking=false;
addEventListener("scroll",function(){if(!ticking){ticking=true;requestAnimationFrame(function(){ticking=false;update()})}},{passive:true});
addEventListener("resize",function(){measure();update()});
if(window.ResizeObserver){var ro=new ResizeObserver(function(){measure();update()});blocks.forEach(function(b){ro.observe(b)})}
$("#dots").innerHTML=blocks.map(function(b){return'<button type="button" aria-label="'+esc(b.getAttribute("data-name"))+'" title="'+esc(b.getAttribute("data-name"))+'" data-go="'+b.id+'"></button>'}).join("");
function goTo(id){
  var el=document.getElementById(id);if(!el)return;
  var i=blocks.indexOf(el),y;
  if(i>=0)y=tops[i]-navB;else y=el.getBoundingClientRect().top+scrollY-navB;
  if(fx==="a"&&i<0){var bi=blocks.indexOf(el.closest(".blk"));y=tops[bi]+(el.offsetTop||0)-navB}
  scrollTo({top:Math.max(0,y),behavior:reduce?"auto":"smooth"});
}
var tipT;
function showTip(html){var t=$("#tip");t.innerHTML=html;t.classList.add("show");clearTimeout(tipT);tipT=setTimeout(function(){t.classList.remove("show")},4200)}
function setFx(name){
  fx=name;root.setAttribute("data-fx",name);
  blocks.forEach(function(b){b.style.top="";["--sc","--dim","--origin","--grow","--p","--q"].forEach(function(k){b.style.removeProperty(k)})});
  [].forEach.call(document.querySelectorAll(".fxbar button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-fx")===name))});
  try{localStorage.setItem("hs-scroll-fx",name)}catch(e){}
  scrollTo({top:0,behavior:"auto"});
  active=-1;measure();update();showTip(TIPS[name]);
}
[].forEach.call(document.querySelectorAll(".fxbar button"),function(b){b.addEventListener("click",function(e){setFx(b.getAttribute("data-fx"));if(e.detail>0)b.blur()})});
/* B 在電腦上：滑鼠滾輪轉一格就換一整塊（前兩塊、商品列表開頭）；商品列表裡面照常捲。手機用手指滑動，交給瀏覽器的整頁對齊 */
var lockUntil=0;
addEventListener("wheel",function(e){
  if(fx!=="b"||e.ctrlKey||!e.deltaY)return;
  var now=performance.now();
  if(now<lockUntil){e.preventDefault();lockUntil=Math.max(lockUntil,now+220);return}
  var sy=scrollY,dir=e.deltaY>0?1:-1,at=-1;
  for(var i=0;i<3;i++){if(Math.abs(tops[i]-navB-sy)<6)at=i}
  var to=at===0&&dir>0?1:at===1?(dir>0?2:0):at===2&&dir<0?1:-1;
  if(to<0)return;
  e.preventDefault();lockUntil=now+750;
  scrollTo({top:Math.max(0,tops[to]-navB),behavior:reduce?"auto":"smooth"});
},{passive:false});
var saved=null;try{saved=localStorage.getItem("hs-scroll-fx")}catch(e){}
setFx(TIPS[saved]?saved:"a");
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){measure();update()});
})();
</script>

</body>
</html>
