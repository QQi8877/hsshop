<!-- 示範頁：給老闆比較「點開商品之後」的四種瀏覽方式。樣式直接沿用首頁（下面第一個 style 是從 index.html 複製來的），
     商品資訊用 shop-render.js 的 productInfoHtml，跟正式站同一份；只有外面的容器不同。不列入搜尋。 -->

@font-face{font-family:'HS Serif';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/noto-serif-tc-400-sub.woff2') format('woff2')}
@font-face{font-family:'HS Serif';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/noto-serif-tc-500-sub.woff2') format('woff2')}

@font-face{font-family:'HS Serif';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/noto-serif-tc-400-punct.woff2') format('woff2');unicode-range:U+2027,U+203B,U+2103,U+2190,U+2192,U+25B2-25B3,U+25BC,U+25C6,U+25CB,U+25CF,U+2605-2606,U+3004,U+3006-3007,U+301C,U+3020,U+3022-3025,U+3030,U+303D,U+30FB,U+FF01-FF5E}
@font-face{font-family:'HS Serif';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/noto-serif-tc-500-punct.woff2') format('woff2');unicode-range:U+2027,U+203B,U+2103,U+2190,U+2192,U+25B2-25B3,U+25BC,U+25C6,U+25CB,U+25CF,U+2605-2606,U+3004,U+3006-3007,U+301C,U+3020,U+3022-3025,U+3030,U+303D,U+30FB,U+FF01-FF5E}
@font-face{font-family:'HS Serif';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/noto-serif-tc-600-punct.woff2') format('woff2');unicode-range:U+2027,U+203B,U+2103,U+2190,U+2192,U+25B2-25B3,U+25BC,U+25C6,U+25CB,U+25CF,U+2605-2606,U+3004,U+3006-3007,U+301C,U+3020,U+3022-3025,U+3030,U+303D,U+30FB,U+FF01-FF5E}

@font-face{font-family:'Noto Serif TC';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/noto-serif-tc-600.woff2') format('woff2');unicode-range:U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+20000-2FA1F}
:root{
  /* 信通家俱行設計系統 2.0。下面第一段是 2.0 的色票與尺寸，新寫的樣式請直接用這些名稱。
     第二段是舊的變數名稱，值改指向 2.0，舊樣式不用逐行改就會換成新配色。
     顏色對比都檢查過：文字在所有底色上 ≥4.5:1，控制項外框 ≥3:1。 */
  --bg:#faf6ef;
  --bg-sunken:#f3ebde;
  --surface:#fffdf9;
  --surface-hover:#ebe0cf;
  --photo-bg:#fffaf3; /* 跟後台上傳流程烤進照片裡的白底色一致(manage.html resizeImageToUniform)，避免照片邊緣出現色塊 */
  --border:#e2d6c3;
  --border-strong:#857560;
  --text:#221d18;
  --text-secondary:#5a4f43;
  --text-tertiary:#6e6253;
  --brand:#8a4520;
  --brand-hover:#6f3618;
  --brand-text:#8a4520;
  --brand-subtle:#f5e4d4;
  --on-brand:#fff;
  --moss:#4f5d3a;
  --moss-subtle:#e4ead8;
  --indigo:#34536b;
  --indigo-subtle:#dfe8ef;
  --ochre:#765609;
  --ochre-subtle:#f6e9c4;
  --danger-subtle:#f8e1dc;
  --line-green:#06803a; /* LINE 官方綠 var(--line-green) 配白字只有 2.3:1，用加深版（白字 5.1:1） */
  --line-green-press:#056a30;
  --focus:#34536b;
  --inverse-bg:#221d18;
  --inverse-text:#f6efe4;
  --inverse-text-secondary:#c9bba6;
  --inverse-accent:#e0915c;
  --radius-xs:4px;
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --radius-xl:32px;
  --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(34,29,24,.08);
  --shadow-md:0 6px 20px rgba(34,29,24,.10);
  --shadow-lg:0 20px 48px rgba(34,29,24,.18);
  --control-sm:36px;
  --control-md:44px;
  --control-lg:52px;

  /* 舊名稱 → 2.0 */
  --charcoal:var(--text);
  --ink:var(--text);
  --muted:var(--text-secondary);
  --soft:var(--text-tertiary);
  --tan:var(--brand);
  --tan-on-dark:var(--inverse-accent);
  --tan-dark:var(--brand-text);
  --sage:var(--moss);
  --cream:var(--bg);
  --paper:var(--photo-bg);
  --line:var(--border);
  --white:#fff;
  --danger:#a3352a;
  --shadow:var(--shadow-md);
  --color-surface:var(--bg-sunken);
  --color-line-strong:var(--border-strong);
  --color-on-dark:var(--inverse-text);
  --color-on-dark-2:var(--inverse-text-secondary);
  --color-accent-tint:var(--brand-subtle);
  --color-accent-tint-2:#f0d3bb;
  --color-accent-2-tint:var(--moss-subtle);

  /* 標題用自行內嵌的 Noto Serif TC（瘦身版 HS Serif 優先），內文用裝置內建的中文字型（原因見 <head> 裡的字型說明），
     不套用新設計稿的 Caprasimo／Figtree／等寬字 */
  /* 粗細規則（整個前台一致）：
     標題字型 → 區塊標題、價格、店名 600；商品名稱 500；副標等次要標題 400。
     內文字型 → 一般 400、強調 600，不用 500：Windows 的微軟正黑體只有一般跟粗體兩種，
     500 在 Windows 上會變成一般字，跟蘋果裝置看起來不一樣。 */
  --font-heading:"HS Serif","Noto Serif TC",serif;
  --font-body:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
  --font-mono:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  font-size:15px;
  line-height:1.75;
}
body.lightbox-open{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
svg[data-icon]{stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%}
nav{
  position:fixed;
  inset:0 0 auto;
  z-index:100;
  height:62px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:20px;
  padding:0 36px;
  background:rgba(250,246,239,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
  transition:height .25s ease,box-shadow .25s ease,background .25s ease;
}
/* 往下捲超過一點距離就縮小、加深陰影，回到頂部時恢復原狀（見下面
   initNavScrollEffect） */
nav.nav--scrolled{
  height:52px;
  background:rgba(250,246,239,.98);
  box-shadow:0 8px 20px rgba(46,38,30,.09);
}
.nav-logo{
  font-family:var(--font-heading);
  font-size:18px;
  font-weight:600;
  letter-spacing:.08em;
  white-space:nowrap;
  justify-self:start;
  color:inherit;
  text-decoration:none;
  transition:font-size .25s ease;
}
nav.nav--scrolled .nav-logo{font-size:16px}
.nav-logo span{color:var(--tan)}
#navSearchBar{width:min(340px,32vw);min-width:0;margin:0;padding:7px 12px;justify-self:center}
.nav-links{display:flex;gap:20px;list-style:none;flex:none}
.nav-links a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
  letter-spacing:.04em;
  white-space:nowrap;
}
.nav-links a:hover{color:var(--tan-dark)}
.nav-hamburger{
  display:none;
  border:0;background:transparent;color:var(--charcoal);
  padding:6px;justify-self:end;
}
.nav-links-mobile{
  display:none;
  list-style:none;
  position:fixed;
  top:62px;left:0;right:0;
  z-index:99;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.1);
  padding:8px 0;
}
.nav-links-mobile.open{display:block}
.nav-links-mobile a{
  display:block;
  padding:14px 24px;
  color:var(--ink);
  text-decoration:none;
  font-size:15px;
  border-bottom:1px solid var(--line);
}
.nav-links-mobile li:last-child a{border-bottom:0}
.nav-links-mobile a:active{background:var(--cream)}
#hero{
  margin-top:62px;
  position:relative;
  overflow:hidden;
  background:var(--color-surface);
}
.hero-inner{
  max-width:1200px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:44px;
  align-items:center;
  padding:64px 40px;
}
.hero-content{position:relative;z-index:1;max-width:560px;padding:0}
.hero-photo{
  aspect-ratio:1/1;
  border-radius:var(--radius-pill);
  background:var(--bg-sunken);
  animation:sk-breathe 1.6s ease-in-out infinite;
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
  overflow:hidden;
}
/* 圖片真的載入之後，圓圈改回原本的米白底色、停止呼吸——跟商品卡片、分類磚
   用的是同一套 sk-breathe 骨架屏效果，避免圖片還沒到之前圓圈只是死白一片 */
.hero-photo:has(img[src]:not([src=""])){
  background:var(--paper);
  animation:none;
}
/* 圖片出現時從 90% 慢慢放大到原尺寸（淡入 .4 秒、放大 1.6 秒） */
.hero-photo img{
  width:70%;height:70%;object-fit:contain;
  filter:saturate(.94) contrast(.97) brightness(1.02);
  opacity:0;
  transform:scale(.9);
  transition:opacity .4s ease,transform 1.6s cubic-bezier(.22,.8,.3,1);
}
.hero-photo img[src]:not([src=""]){opacity:1;transform:none}
/* 首頁大圖文字依序浮現：class 由 head 最後那段小 script 控制，字型載入完才播 */
@keyframes heroRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-pending .hero-content>*{opacity:0}
.hero-enter .hero-content>*{animation:heroRise .72s cubic-bezier(.16,.84,.44,1) both}
.hero-enter .hero-content>:nth-child(2){animation-delay:.11s}
.hero-enter .hero-content>:nth-child(3){animation-delay:.22s}
.hero-enter .hero-content>:nth-child(4){animation-delay:.33s}
.hero-enter .hero-content>:nth-child(5){animation-delay:.44s}
.hero-tag{
  display:block;
  color:var(--tan-dark);
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.24em;
  margin-bottom:22px;
}
.hero-title{
  font-family:var(--font-heading);
  color:var(--ink);
  font-size:52px;
  font-weight:600;
  line-height:1.18;
  letter-spacing:.02em;
  margin-bottom:12px;
}
.hero-sub{
  color:var(--tan-dark);
  font-family:var(--font-heading);
  letter-spacing:.06em;
  margin-bottom:22px;
}
.hero-desc{
  color:var(--muted);
  max-width:450px;
  margin-bottom:34px;
  line-height:1.85;
}
.hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  background:transparent;
  text-decoration:none;
  border:1.5px solid var(--color-line-strong);
  border-radius:var(--radius-pill);
  padding:13px 24px;
  letter-spacing:.02em;
  font-size:14px;
  font-weight:600;
  transition:border-color .15s,color .15s;
}
.hero-cta:hover{border-color:var(--tan);color:var(--tan-dark);background:transparent}
.hero-line-cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#fff;
  background:var(--tan);
  text-decoration:none;
  border-radius:var(--radius-pill);
  padding:13px 24px;
  letter-spacing:.02em;
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow-md);
  transition:background .15s;
}
.hero-line-cta:hover{background:var(--tan-dark)}
#categories{padding-bottom:64px;scroll-margin-top:62px}

/* ── 捲動進場動畫：只加在區塊標題／卡片，不碰 #productsGrid 既有的
   grid-transition-in（篩選/搜尋切換動畫），兩者觸發時機不同、互不影響。
   預設就是可見（.reveal），JS 確認元素一開始就在畫面外才會加 will-reveal
   讓它變透明，避免 JS 失效或還沒執行完時整塊內容變成空白。 */
.reveal{opacity:1;transform:none}
@media(prefers-reduced-motion:no-preference){
  .reveal.will-reveal{opacity:0;transform:translateY(26px)}
  .reveal.will-reveal.is-visible{
    opacity:1;transform:translateY(0);
    transition:opacity .6s cubic-bezier(.16,.84,.44,1),transform .6s cubic-bezier(.16,.84,.44,1);
  }
}

/* ── 本月選品／分類磚（Phase 2）───────────────────────────── */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.sec-head h2{font-family:var(--font-heading);font-size:20px;font-weight:600;color:var(--charcoal)}
.sec-head a{font-family:var(--font-mono);font-size:12px;color:var(--tan-dark);text-decoration:none}
.sec-head a:hover{color:var(--tan)}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;max-width:1200px;margin:0 auto}
.p-card{
  position:relative;display:flex;flex-direction:column;gap:11px;
  padding:14px;background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  text-decoration:none;color:inherit;cursor:pointer;
  transition:transform .22s ease,box-shadow .22s ease;
}
.p-card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 32px rgba(46,38,30,.14);
}
.p-card__media{position:relative;isolation:isolate;aspect-ratio:1/1;background:var(--color-card,var(--paper));border-radius:16px;overflow:hidden}
.p-card__media img{position:absolute;top:50%;left:50%;width:88%;height:88%;object-fit:contain;transform:translate(-50%,-50%);transition:opacity .34s ease,transform .34s ease}
.p-card__media .img-primary{opacity:1;z-index:1}
.p-card__media .img-secondary{opacity:0;z-index:2}
.p-card:hover .p-card__media .img-primary.has-secondary{opacity:0}
.p-card:hover .p-card__media .img-secondary{opacity:1;transform:translate(-50%,-50%) scale(1.03)}
.p-card:hover .p-card__media .img-primary:not(.has-secondary){transform:translate(-50%,-50%) scale(1.04)}
/* 本月選品卡片的字型跟下面全部商品列表的卡片一致：名稱用標題字型、尺寸用咖啡色小字、金額用標題字型（見 .product-name／.product-size／.product-price） */
.p-card__title{font-family:var(--font-heading);font-size:14.5px;font-weight:500;color:var(--charcoal);line-height:1.4}
/* 尺寸一行、金額另起一行靠右：擠同一行時窄卡片會把「$」跟數字拆到兩行。
   分隔線＋尺寸緊接商品名稱，金額推到卡片最底下，同一排卡片不管有沒有金額，
   分隔線跟尺寸都在同一高度（跟 #productsGrid 手機版 .product-price 同一套做法）。 */
.p-card__foot{display:flex;flex-direction:column;gap:2px;flex-grow:1;padding-top:9px;border-top:1px solid var(--line)}
.p-card__foot .mono{font-size:11px;line-height:1.35;color:var(--tan-dark)}
.p-card__foot .price{margin-top:auto;text-align:right;font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1.2;color:var(--tan-dark)}
.p-card__fav{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border:none;
  border-radius:var(--radius-pill);background:rgba(249,244,237,.92);color:var(--tan-dark);
  display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s;
}
.p-card__fav svg{width:15px;height:15px}
.p-card__fav.active{background:var(--tan);color:#fff}
.p-card__fav.active svg path{fill:currentColor}
/* 標籤跟愛心都貼齊卡片內距（14px，跟下方商品名稱左緣對齊），標籤放在跟愛心
   同高的 30px 橫帶裡垂直置中，兩者中心線一致，看起來是同一排 */
.p-card__badge{position:absolute;top:14px;left:14px;height:30px;display:flex;align-items:center;z-index:6}

.cat-grid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:18px;max-width:min(1200px,calc(var(--cols,5)*240px));margin:0 auto}
.cat-tile{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;
  border-radius:var(--radius-lg);background:var(--color-surface);text-align:center;
  text-decoration:none;color:inherit;cursor:pointer;transition:background .15s;border:0;
}
.cat-tile:hover{background:var(--surface-hover)}
.cat-tile__thumb{width:74px;height:74px;border-radius:var(--radius-pill);background:var(--paper);overflow:hidden;display:grid;place-items:center}
.cat-tile__thumb img{width:76%;height:76%;object-fit:contain;transition:opacity .34s ease}
/* 商品照片載入完成才淡入（見 fadeInOnLoad）；用 img 提高權重，蓋過 .img-primary 的 opacity:1。
   商品卡片的照片還沒載好時，照片位置先放一塊會呼吸的淡色底（.photo-skel，載好就拿掉）；
   載好後底色模糊淡出、照片從模糊變清楚淡入（動態參考 transitions.dev 的 Skeleton loader and reveal）。
   這塊底只在照片載入中才存在、模糊只有淡入那 0.4 秒，平常不會讓瀏覽器多算東西 */
img.img-fade:not(.is-loaded){opacity:0}
.photo-skel{position:absolute;inset:14%;z-index:0;border-radius:14px;background:var(--bg-sunken);pointer-events:none;animation:photo-skel-pulse 1s ease-in-out infinite}
@keyframes photo-skel-pulse{50%{opacity:.55}}
.cat-tile__name{font-family:var(--font-heading);font-size:14px;font-weight:600;color:var(--charcoal)}
.cat-tile__count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.cat-tile--cta{justify-content:center;background:var(--sage);color:#fff}
.cat-tile--cta:hover{background:var(--moss)}
.cat-tile--cta .cat-tile__name{color:#fff}
.cat-tile--cta span.cta-link{font-size:11.5px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.5)}
@media(max-width:860px){
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat-grid.odd .cat-tile--cta{grid-column:1/-1} /* 兩欄排不滿時，「不確定就問」那格佔整排，不會落單 */
  #picks,#catTiles{padding-left:18px!important;padding-right:18px!important}
}

  width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;
  font-size:12px;color:var(--muted);padding:6px 0;margin-top:8px;
}
.favorite-item-note::placeholder{color:var(--color-text-4,#a19786)}
.favorite-item-note:focus{outline:none;border-color:var(--tan)}
.favorites-empty{padding:34px 20px;text-align:center;color:var(--soft);font-size:13px;background:var(--color-surface);border-radius:16px;margin:16px 22px;line-height:1.7}
.favorites-footer{padding:16px 22px 20px;background:var(--color-surface);border-top:1px solid var(--line)}
.favorites-total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--charcoal);margin-bottom:12px}
.favorites-total span:first-child{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted)}
.favorites-inquire-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-bottom:10px;padding:13px 16px;
  background:var(--line-green);color:#fff;border:0;border-radius:var(--radius-pill);
  font-size:14px;font-weight:600;
  transition:background .18s ease;
}
.favorites-inquire-btn:hover{background:var(--line-green-press)}
.favorites-inquire-btn svg{flex-shrink:0}
.favorites-copy-btn{
  width:100%;padding:11px 16px;background:transparent;border:1px solid var(--color-line-strong);
  border-radius:var(--radius-pill);color:var(--charcoal);font-size:13px;cursor:pointer;
}
.favorites-copy-btn:hover{border-color:var(--tan);color:var(--tan-dark)}
.favorites-preview{padding:24px 22px;overflow:auto;flex:1}
.favorites-preview-check{display:flex;align-items:center;gap:8px;color:var(--sage);font-weight:600;font-size:14px;margin-bottom:16px}
.favorites-preview-bubble{
  background:var(--color-accent-2-tint,#e1eecc);color:var(--charcoal);
  border-radius:20px 20px 20px 6px;padding:16px 18px;font-size:13px;line-height:1.8;
  white-space:pre-line;margin-bottom:18px;
}
.favorites-preview-back{background:transparent;border:0;color:var(--tan-dark);font-size:13px;cursor:pointer;text-decoration:underline}
#contact{background:var(--charcoal);padding:80px 38px}
/* 左邊：標題＋一句話＋三個大按鈕；右邊：一行一項的聯繫資訊 */
.contact-inner{
  max-width:1080px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);
  gap:56px;
  align-items:start;
}
.contact-heading{
  font-family:var(--font-heading);
  color:var(--white);
  font-size:27px;
  font-weight:600;
}
.contact-sub{color:rgba(255,255,255,.48);font-size:13px;letter-spacing:.08em;margin:6px 0 0}
.contact-lead{color:var(--inverse-text-secondary);font-size:15px;line-height:1.8;margin:18px 0 26px}
.contact-actions{display:flex;flex-wrap:wrap;gap:10px}
.contact-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 22px;border-radius:var(--radius-pill);
  border:1.5px solid rgba(255,255,255,.3);color:var(--inverse-text);
  font-size:14px;font-weight:600;letter-spacing:.02em;text-decoration:none;
  transition:background .15s,border-color .15s,color .15s;
}
.contact-btn:hover{border-color:var(--inverse-text);background:rgba(255,255,255,.06)}
.contact-btn--primary{background:var(--brand);border-color:var(--brand);color:#fff}
.contact-btn--primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.contact-btn .contact-icon{width:18px;height:18px}
.contact-list{margin:0;border-top:1px solid rgba(255,255,255,.12)}
.contact-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center;padding:15px 2px;border-bottom:1px solid rgba(255,255,255,.12)}
.contact-row dt{display:flex;align-items:center;gap:9px;color:var(--tan-on-dark);font-size:13.5px;font-weight:600;letter-spacing:.04em}
.contact-row dt .contact-icon{width:17px;height:17px;flex:none;align-self:center}
.contact-row dd{margin:0;color:var(--inverse-text);font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.contact-row a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.28);transition:color .15s,border-color .15s}
.contact-row a:hover{color:var(--tan-on-dark);border-color:var(--tan-on-dark)}
footer{
  background:var(--charcoal);
  color:var(--color-on-dark-2);
  padding:22px 38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  font-size:12px;
}
footer a{color:var(--color-on-dark-2);transition:color .15s}
footer a:hover{color:var(--color-on-dark)}
.footer-brand{font-family:var(--font-heading);letter-spacing:.08em;color:var(--color-on-dark)}
.modal-overlay{
  display:flex;
  position:fixed;
  inset:0;
  z-index:240;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(34,29,24,.72);
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease,visibility 0s linear .2s;
}
.modal-overlay.open{
  opacity:1;
  visibility:visible;
  transition:opacity .2s ease;
}
.modal{
  width:min(590px,100%);
  max-height:92vh;
  overflow:hidden;
  background:var(--paper);
  border-radius:14px;
  position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
  transform:scale(.96);
  transition:transform .2s ease;
  display:flex;
  flex-direction:column;
}
.modal-overlay.open .modal{transform:scale(1)}
.modal-scroll{flex:1;min-height:0;overflow-y:auto;padding:32px}
.modal-title{
  font-family:var(--font-heading);
  font-size:21px;
  color:var(--charcoal);
  margin-bottom:22px;
}
.modal-close{
  position:absolute;
  top:14px;
  right:14px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:var(--muted);
  background:var(--bg-sunken);
}
.modal label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:.06em;
}
.modal input,.modal textarea,.modal select{
  width:100%;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--cream);
  color:var(--ink);
  padding:10px 12px;
  outline:none;
}
.modal textarea{min-height:78px;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--tan)}
/* 提示訊息：從下面浮上來，帶一點縮放和模糊；出現用 .35 秒、收起用比較快的 .25 秒
   （動態參考 transitions.dev 的 Toast） */
.toast{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:500;
  border-radius:8px;
  background:var(--charcoal);
  color:var(--white);
  padding:12px 18px;
  opacity:0;
  transform:translateY(16px) scale(.97);
  filter:blur(2px);
  pointer-events:none;
  transition:opacity .25s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1),filter .25s cubic-bezier(.22,1,.36,1);
  font-size:13px;
}
.toast.show{opacity:1;transform:none;filter:blur(0);transition-duration:.35s}
#lightbox{
  display:flex;
  position:fixed;
  inset:0;
  z-index:600;
  background:
    radial-gradient(circle at 22% 18%,rgba(185,146,99,.2),transparent 28%),
    radial-gradient(circle at 82% 72%,rgba(127,144,118,.16),transparent 32%),
    linear-gradient(135deg,rgba(35,32,28,.91),rgba(55,48,40,.88));
  color:var(--ink);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  padding:18px;
  opacity:0;
  visibility:hidden;
  transition:opacity .22s ease,visibility 0s linear .22s;
}
#lightbox.open{
  opacity:1;
  visibility:visible;
  transition:opacity .22s ease;
}
@media(max-width:760px){
  #lightbox .lb-layout{transform:scale(.97);transition:transform .22s ease}
  #lightbox.open .lb-layout{transform:scale(1)}
}
.lb-close,.lb-arrow{
  position:fixed;
  z-index:3;
  border:0;
  border-radius:50%;
  background:rgba(255,250,243,.82);
  color:var(--charcoal);
  box-shadow:0 10px 28px rgba(0,0,0,.18);
  display:grid;
  place-items:center;
}
.lb-close{top:18px;right:22px;width:42px;height:42px;font-size:25px}
.lb-arrow{top:50%;width:46px;height:46px;font-size:27px;transform:translateY(-50%)}
#lbPrev{left:18px}
#lbNext{right:18px}
.lb-close:hover,.lb-arrow:hover{background:var(--tan);color:var(--white)}
.lb-cat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.lb-cat-row .lb-product-cat{margin-bottom:0}
.lb-favorite{
  position:relative;
  border:1px solid var(--line);
  border-radius:50%;
  width:34px;height:34px;
  display:grid;place-items:center;
  background:var(--paper);
  color:var(--charcoal);
  flex-shrink:0;
  transition:background .15s,border-color .15s,color .15s;
}
.lb-favorite svg{width:16px;height:16px}
.lb-favorite:hover{border-color:var(--tan);color:var(--tan-dark)}
.lb-favorite.active{background:var(--danger);border-color:var(--danger);color:#fff}
.lb-favorite.active svg path{fill:currentColor}
.lb-stage{
  position:relative;
  width:100%;
  height:72vh;
  overflow:hidden;
  border-radius:8px;
  cursor:zoom-in;
  /* 商品照片本身就是烤在 --paper 這個底色上傳的，燈箱框跟照片長寬比不同時
     兩側會露出底色——這裡改成跟照片一樣的實色，露出來的部分才會跟照片
     本身的留白無縫接在一起，而不是像現在半透明看起來灰灰一塊。 */
  background:var(--paper);
  box-shadow:0 24px 70px rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
}
.lb-left{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  min-width:0;
}
.lb-layout{
  width:min(1180px,94vw);
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);
  gap:24px;
  align-items:start;
}
.lb-info{
  max-height:72vh;
  overflow:auto;
  border:1px solid rgba(221,210,196,.82);
  border-radius:8px;
  padding:26px;
  background:rgba(255,250,243,.93);
  color:var(--muted);
  box-shadow:0 20px 58px rgba(0,0,0,.16);
  backdrop-filter:blur(10px);
}
.lb-product-cat{font-size:12px;color:var(--tan-dark);letter-spacing:.1em;margin-bottom:8px}
.lb-product-title{font-family:var(--font-heading);font-size:28px;font-weight:500;color:var(--charcoal);line-height:1.25;margin-bottom:10px}
.lb-product-price{font-family:var(--font-heading);font-size:20px;color:var(--tan-dark);font-weight:600;margin-bottom:16px}
/* 特價期間：特價用紅色、原價劃掉；商品頁多一行特價到哪天 */
.price-now{color:var(--danger)}
/* 特價時原價跟特價排在同一行，原價加刪除線、字比較小（卡片上 16px 的金額配 10px 原價，最小 10px）；
   兩個金額各自不拆行，窄卡片放不下時原價整個換到下一行 */
.price-now,.price-was{white-space:nowrap}
.price-was{margin-left:6px;font-size:max(10px,calc(.75em - 4px));font-weight:400;color:var(--soft)}
.price-until{display:block;margin-top:2px;font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--soft)}
/* 商品頁的交期、顏色／款式（卡片上不顯示） */
.lb-badges{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.lb-badges .tag-badge{box-shadow:none}
.lb-lead{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;font-size:14px;color:var(--ink)}
.lb-product-price+.lb-lead{margin-top:-8px}
.lb-lead-k,.lb-opts-k{flex:none;font-size:12px;color:var(--tan-dark);letter-spacing:.12em}
.lb-opts{margin:0 0 16px}
.lb-opts-k{margin-bottom:8px}
.lb-opts-k span{color:var(--ink);letter-spacing:0}
.lb-opts-list{display:flex;flex-wrap:wrap;gap:8px}
.lb-opt{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.2;cursor:pointer}
.lb-opt:hover{border-color:var(--tan)}
.lb-opt.active{border-color:var(--tan-dark);box-shadow:inset 0 0 0 1px var(--tan-dark)}
.lb-opt-dot{flex:none;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(32,30,29,.18)}
/* 「LINE 詢問這件商品」放在商品頁最下面（商品說明下面） */
.lb-inquire-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px 16px;margin-top:24px;
  background:var(--line-green);color:#fff;border:0;border-radius:8px;
  font-size:15px;font-weight:600;text-decoration:none;
  transition:background .18s ease;
}
.lb-inquire-btn:hover{background:var(--line-green-press)}
.lb-inquire-btn svg{flex-shrink:0}
/* 購買須知（後台「購買須知」填的問答）：首頁聯繫區上面一整區（選單也有連結），點標題展開；商品頁不放 */
#buyInfo{padding:46px 40px 54px}
.buyinfo-inner{max-width:760px;margin:0 auto}
.buyinfo-title{font-family:var(--font-heading);font-size:20px;font-weight:600;color:var(--charcoal);margin-bottom:14px;text-align:center}
.buy-item{border-bottom:1px solid var(--line)}
.buy-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;font-weight:600;color:var(--ink)}
.buy-item summary::-webkit-details-marker{display:none}
.buy-item summary::after{content:"+";font-size:18px;line-height:1;color:var(--tan-dark);flex:none;transition:transform .2s ease}
.buy-item[open] summary::after{transform:rotate(45deg)}
.buy-item summary:focus-visible{outline:2px solid var(--tan);outline-offset:2px;border-radius:4px}
.buy-a{padding:0 2px 14px;color:var(--muted);line-height:1.8}
.buyinfo-ask{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px;color:var(--muted);font-size:14px;text-align:center}
.buyinfo-ask[hidden]{display:none}
.buyinfo-ask a{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:var(--line-green);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.buyinfo-ask a:hover{background:var(--line-green-press)}
.buyinfo-ask a:focus-visible{outline:3px solid var(--tan-dark);outline-offset:3px}
/* 同類商品：商品頁最下面，點了換成那件商品（上一頁會回到原本這件） */
.lb-similar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lb-sim{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
/* 照片整張縮進框裡、置中，四周留一點空（跟商品卡片一樣）：直式、橫式照片都不會被裁掉 */
.lb-sim-img{position:relative;aspect-ratio:1;border-radius:12px;background:var(--paper);overflow:hidden}
.lb-sim-img img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.lb-sim-name{font-size:13px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lb-sim-price{font-size:12.5px;font-weight:600;color:var(--tan-dark)}
.lb-sim:hover .lb-sim-name{color:var(--tan-dark)}
.lb-sim:focus-visible{outline:2px solid var(--tan);outline-offset:3px;border-radius:12px}
@media(max-width:760px){#buyInfo{padding:38px 18px 44px}}
.lb-product-note{font-size:14px;color:var(--muted)}
.lb-product-note b,.lb-product-note strong{font-weight:600} /* 後台說明裡的粗體跟網站其他強調字一樣用 600 */
.lb-product-note ul{margin:4px 0;padding-left:22px;list-style:disc}
.lb-product-note ol{margin:4px 0;padding-left:22px;list-style:decimal}
.lb-product-note li{margin:2px 0}
.lb-spec-title{font-size:12px;color:var(--tan-dark);letter-spacing:.12em;margin:18px 0 8px}
/* 「商品說明」標題上面一條淺灰線，把上面的尺寸跟商品說明分開 */
.lb-desc-title{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
/* 詳情頁的尺寸區塊（見 shop-render.js 的 productSizeHtml）：左邊線稿（dim-figures.js）標出寬／深／高的方向，
   右邊逐列寫數字，桌子、櫃架、板凳多一行「約幾尺」；椅子的座高那一列用品牌色標出來 */
.lb-dim{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center}
.lb-dim.no-fig{grid-template-columns:minmax(0,1fr)}
.lb-dim-fig svg{display:block;width:118px;height:auto}
.lb-dim-rows{display:grid}
.lb-dim-row{display:grid;grid-template-columns:2.2em minmax(0,1fr);column-gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.lb-dim-row:last-child{border-bottom:0}
.lb-dim-k{font-size:12.5px;color:var(--soft)}
.lb-dim-v{font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
.lb-dim-v small{font-size:12px;color:var(--soft);font-weight:400;margin-left:2px}
.lb-dim-chi{display:block;font-size:12px;color:var(--muted);font-weight:400;line-height:1.3}
.lb-dim-row.key .lb-dim-k,.lb-dim-row.key .lb-dim-v{color:var(--tan-dark);font-weight:600}
.lb-dim-adj{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--color-surface);color:var(--tan-dark);font-size:11px;font-weight:600;line-height:1.7;vertical-align:2px;white-space:nowrap}
.lb-dim-extra{margin-top:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-sunken);font-size:13px;color:var(--ink)}
.lb-dim-extra span{color:var(--soft);margin-right:6px}
.lb-dim-note{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);line-height:1.6;text-wrap:pretty}
.lb-dim-note .tag-badge{flex:none;margin-top:1px;box-shadow:none}
.lb-dim-ask{padding:14px;border-radius:8px;border:1px dashed var(--color-line-strong);background:var(--bg-sunken)}
.lb-dim-ask strong{display:block;font-family:var(--font-heading);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:2px}
.lb-dim-ask p{font-size:13.5px;color:var(--muted);text-wrap:pretty}
/* 360px 寬的手機（很多 Android）示意圖縮小一點，右邊的數字才不會太擠 */
@media(max-width:360px){
  .lb-dim{grid-template-columns:108px minmax(0,1fr);gap:12px}
  .lb-dim-fig svg{width:108px}
  .lb-dim-row{grid-template-columns:30px minmax(0,1fr)}
  .lb-dim-adj{margin-left:4px;padding:1px 6px}
}
.lb-stage.zoomed{cursor:zoom-in}
.lb-stage img{
  /* 燈箱先顯示縮圖、稍後換成原始畫質照片；固定 width/height:100% 讓兩種畫質
     都撐滿同一個框，不會因為縮圖的原始像素比較小而在換圖瞬間看起來「變大」 */
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:8px;
  transform-origin:center center;
  transition:transform .12s ease, transform-origin .08s ease, opacity .15s ease;
  user-select:none;
}
/* 切換到別的商品時，新照片還沒下載完之前先蓋住舊照片（背景跟照片一樣是
   --paper 底色，不會看起來像壞掉），避免使用者誤以為畫面卡在上一個商品 */
.lb-stage img.lb-img-loading{opacity:0}
/* 點商品卡片時照片從卡片飛進燈箱、關閉時飛回去（見 startLbFlipOpen／closeLightbox）。
   飛行中真正的燈箱照片先藏起來，由 .lb-fly 這張複本代替；手機版燈箱本來的
   97%→100% 縮放也先關掉，照片落點才會跟燈箱照片的位置完全對齊。 */
.lb-fly{position:fixed;z-index:610;background:var(--paper);overflow:hidden;pointer-events:none}
.lb-fly img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}

  padding:2px 0;
}
.lb-thumb{

}

/* ══ 視覺 2.1（2026-11）：蓋在上面所有規則之後的調整 ═══════════════════
   1. 標題（--font-heading）改用各裝置內建的黑體（蘋方／微軟正黑體／思源黑體），不再用筆畫細的明體；
      只有店名、首頁大標、載入中的店名保留明體（--font-brand，用的還是 fonts/ 裡瘦身過的 HS Serif）
   2. 小字放大加深；商品名稱中等粗細（500），左邊商品目錄跟分類按鈕粗體（600）
   3. 互動（JS 在檔案最後的 siteFx）：捲動進度條、首頁大圖跟著滑鼠微動、
      卡片滑過出現「看看這件」、回到頂端、手機捲過大圖後底部的 LINE 按鈕 */
:root{
  --font-brand:"HS Serif","Noto Serif TC",serif;
  --font-heading:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",system-ui,sans-serif;
  --text-secondary:#4f453a;
  --text-tertiary:#655a4c;
}
.nav-logo,.hero-title,.loading-breathe-text{font-family:var(--font-brand)}
.hero-title{font-size:58px;letter-spacing:.04em}
.hero-sub{font-size:19px;font-weight:600;letter-spacing:.1em}
.hero-desc{font-size:16px;color:var(--text-secondary)}
.hero-tag{font-size:12px;font-weight:600}

.sec-head h2::before,.listing-title::before{content:"";width:28px;height:3px;background:var(--brand);flex:none;transform-origin:left;transition:transform .7s cubic-bezier(.16,.84,.44,1) .15s}

.p-card__title,.product-name{font-size:16px;font-weight:500;line-height:1.45;letter-spacing:.01em}

.cat-side-btn{font-size:16px;font-weight:600;letter-spacing:.04em}

.dm-top h1 small{font-size:12.5px;font-weight:400;color:var(--text-tertiary);margin-left:8px}
.dm-modes{display:flex;gap:6px;flex-wrap:wrap}
.dm-modes button{flex:1 1 0;min-width:74px;padding:9px 6px;border:1.5px solid var(--border-strong,#cdbda3);background:#fff;color:var(--text);font-size:14px;font-weight:600;border-radius:6px;line-height:1.3}
.dm-modes button b{display:block;font-size:11.5px;font-weight:600;color:var(--brand);letter-spacing:.08em}
.dm-modes button[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.dm-modes button[aria-pressed="true"] b{color:#f0d3bb}
.dm-note{margin-top:8px;font-size:13px;line-height:1.6;color:var(--text-secondary)}
.dm-wrap{max-width:1180px;margin:0 auto;padding:16px}
.dm-wrap .products-grid{margin-top:4px}
.dm-wrap .product-card{cursor:pointer}
.dm-wrap .product-card.is-open{outline:2px solid var(--brand);outline-offset:-2px;z-index:2}
/* 共用：上一件／下一件、關閉 */
.dm-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fffdf9;position:sticky;top:0;z-index:5}
.dm-bar .sp{flex:1}
.dm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;font-weight:600;border-radius:6px}
.dm-btn:hover{background:var(--bg-sunken)}
.dm-count{font-size:13px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.dm-photo{background:var(--photo-bg,#fffaf3);display:grid;place-items:center;overflow:hidden}
.dm-photo img{width:100%;height:100%;object-fit:contain}
.dm-info{padding:20px 20px 28px;color:var(--muted)}
.dm-info .lb-similar-title,.dm-info .lb-similar{display:none}
body.dm-lock{overflow:hidden}
/* A 側邊抽屜：商品列表留在後面，資訊從右邊滑出（手機從下面往上） */
.dm-scrim{position:fixed;inset:0;z-index:60;background:rgba(34,29,24,.38);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s}
.dm-scrim.on{opacity:1;visibility:visible;transition-delay:0s}
.dm-drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(520px,92vw);background:#fffdf9;box-shadow:-12px 0 40px rgba(34,29,24,.18);transform:translateX(102%);transition:transform .32s cubic-bezier(.16,.84,.44,1);display:flex;flex-direction:column}
.dm-drawer.on{transform:none}
.dm-drawer .dm-body{overflow:auto;flex:1;overscroll-behavior:contain}
.dm-drawer .dm-photo{aspect-ratio:4/3}
@media(max-width:760px){
  .dm-drawer{top:auto;left:0;width:100%;height:88vh;border-radius:14px 14px 0 0;transform:translateY(102%);box-shadow:0 -12px 40px rgba(34,29,24,.2)}
  .dm-drawer .dm-bar{border-radius:14px 14px 0 0}
  .dm-drawer .dm-bar::before{content:"";position:absolute;left:50%;top:5px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong,#cdbda3)}
}
/* B 整頁：像換到另一頁，左邊大照片固定、右邊資訊往下捲 */
.dm-page{position:fixed;inset:0;z-index:61;background:var(--bg);overflow:auto;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .25s,transform .25s,visibility 0s linear .25s}
.dm-page.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.dm-page .dm-cols{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;padding:24px 24px 60px;align-items:start}
.dm-page .dm-photo{position:sticky;top:84px;aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px}
.dm-page .dm-info{padding:4px 0 0}
.dm-page .dm-info .lb-product-title{font-size:30px}
@media(max-width:760px){
  .dm-page .dm-cols{grid-template-columns:1fr;gap:0;padding:0 0 60px}
  .dm-page .dm-photo{position:static;border:0;border-radius:0;border-bottom:1px solid var(--line)}
  .dm-page .dm-info{padding:18px 18px 0}
  .dm-page .dm-info .lb-product-title{font-size:24px}
}
/* C 就地展開：點了商品，詳細資訊直接在那一排下面打開，不蓋住列表 */
.dm-inline{width:100%;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fffdf9;position:relative;overflow:hidden;animation:dmOpen .3s cubic-bezier(.16,.84,.44,1)}
@keyframes dmOpen{from{opacity:0;max-height:0}to{opacity:1;max-height:1200px}}
.dm-inline::before{content:"";position:absolute;top:-9px;left:var(--notch,50%);width:16px;height:16px;margin-left:-8px;background:#fffdf9;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);z-index:6}
.dm-inline .dm-cols{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr);align-items:start}
.dm-inline .dm-photo{aspect-ratio:1/1;border-right:1px solid var(--line)}
.dm-inline .dm-bar{position:static;background:transparent}
@media(max-width:760px){
  .dm-inline .dm-cols{grid-template-columns:1fr}
  .dm-inline .dm-photo{aspect-ratio:4/3;border-right:0;border-bottom:1px solid var(--line)}
}
/* D 照片優先：整個畫面先看大照片，左右滑換下一件，資訊收在下面的抽屜 */
.dm-stage{position:fixed;inset:0;z-index:61;background:var(--photo-bg,#fffaf3);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s linear .25s;display:flex;flex-direction:column}
.dm-stage.on{opacity:1;visibility:visible;transition-delay:0s}
.dm-stage .dm-bar{background:transparent;border-bottom:0;position:absolute;left:0;right:0;top:0}
.dm-stage .dm-photo{flex:1;min-height:0;position:relative;touch-action:pan-y}
.dm-stage .dm-photo img{position:absolute;left:16px;top:64px;width:calc(100% - 32px);height:calc(100% - 214px);transition:opacity .2s ease,transform .25s ease}
.dm-stage .dm-photo img.swap{opacity:0;transform:scale(.97)}
.dm-arrow{position:absolute;top:50%;z-index:4;width:46px;height:46px;margin-top:-60px;border:1px solid var(--line);background:rgba(255,253,249,.9);border-radius:50%;font-size:20px;color:var(--text);display:grid;place-items:center}
.dm-arrow.prev{left:14px}.dm-arrow.next{right:14px}
.dm-sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-width:720px;margin:0 auto;background:#fffdf9;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -10px 34px rgba(34,29,24,.14);max-height:132px;overflow:hidden;transition:max-height .35s cubic-bezier(.16,.84,.44,1)}
.dm-sheet.open{max-height:78vh;overflow:auto;overscroll-behavior:contain}
.dm-peek{display:flex;align-items:center;gap:12px;width:100%;padding:16px 18px 14px;border:0;background:transparent;text-align:left;position:sticky;top:0;background:#fffdf9;z-index:2}
.dm-peek::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--border-strong,#cdbda3)}
.dm-peek .t{flex:1;min-width:0}
.dm-peek .n{display:block;font-size:17px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-peek .s{display:block;font-size:13px;color:var(--text-secondary);margin-top:2px}
.dm-peek .more{flex:none;font-size:13px;font-weight:600;color:var(--brand);white-space:nowrap}
.dm-sheet .dm-info{padding-top:0}
.dm-sheet .dm-info .lb-cat-row,.dm-sheet .dm-info .lb-product-title{display:none}
.dm-sheet .dm-quick{padding:0 18px 16px}
.dm-sheet.open .dm-quick{display:none}
@media(prefers-reduced-motion:reduce){.dm-inline{animation:none}}
</style>
</head>
<body>
<header class="dm-top">
  <h1>商品瀏覽模式示範<small>點下面任一件商品試試看</small></h1>
  <div class="dm-modes">
    <button type="button" data-mode="drawer"><b>A</b>側邊抽屜</button>
    <button type="button" data-mode="page"><b>B</b>整頁</button>
    <button type="button" data-mode="inline"><b>C</b>就地展開</button>
    <button type="button" data-mode="stage"><b>D</b>照片優先</button>
  </div>
  <p class="dm-note" id="dmNote"></p>
</header>
<main class="dm-wrap">
  <div class="products-grid" id="dmGrid"></div>
</main>
<script type="module">
import{escapeHTML,normalizeProduct,isListedProduct,catalogOrderCompare,normalizePhotoUrl,getSizeSummary,photoAlt,staticProductCardHtml,productInfoHtml,lineInquireUrl,lineInquireBtnHtml,productPath,SITE_ORIGIN}from"/shop-render.js?v=10";
window.toggleLbFavorite=()=>{}; // 示範頁不做收藏
const MODES={
  drawer:{label:"側邊抽屜",note:"商品列表留在後面，資訊從右邊滑出來（手機是從下面往上）。關掉就回到剛剛看的位置，適合一件一件快速比較。"},
  page:{label:"整頁",note:"像換到另一頁：左邊大照片固定不動，右邊資訊往下捲。版面最寬鬆，照片最大，像大型購物網站。"},
  inline:{label:"就地展開",note:"點了商品，詳細資訊直接在那一排下面打開，不蓋住其他商品。客人不會覺得「跳走了」，往下滑就繼續逛。"},
  stage:{label:"照片優先",note:"整個畫面先看大照片，左右滑（或按箭頭）換下一件，品名和尺寸收在下面，點一下才展開詳細資訊。適合照片拍得好的商品。"}
};
const $=s=>document.querySelector(s);
const site=await fetch("/data/site.json").then(r=>r.json());
const meta=site.meta;
const items=site.products.map(normalizeProduct).filter(p=>isListedProduct(p,meta.catalog)&&(p.photos||[]).length).sort(catalogOrderCompare(meta.catalog)).slice(0,16);
const grid=$("#dmGrid");
grid.innerHTML=items.map(p=>staticProductCardHtml(p,meta.catalog)).join("");
const cards=[...grid.querySelectorAll(".product-card")];
let mode="drawer",current=-1;
const photoOf=p=>normalizePhotoUrl(p.photos[0],1200);
const infoHtml=p=>productInfoHtml(p,meta,{productUrl:SITE_ORIGIN+productPath(p.id)});
const bar=(extra="")=>`<div class="dm-bar">${extra}<button class="dm-btn" data-act="prev" aria-label="上一件">←</button><span class="dm-count"></span><button class="dm-btn" data-act="next" aria-label="下一件">→</button><span class="sp"></span><button class="dm-btn" data-act="close">✕ 關閉</button></div>`;
// 四種容器
const scrim=document.body.appendChild(Object.assign(document.createElement("div"),{className:"dm-scrim"}));
const drawer=document.body.appendChild(Object.assign(document.createElement("aside"),{className:"dm-drawer",innerHTML:`${bar()}<div class="dm-body"><div class="dm-photo"><img alt=""></div><div class="dm-info"></div></div>`}));
const page=document.body.appendChild(Object.assign(document.createElement("div"),{className:"dm-page",innerHTML:`<div class="dm-bar"><button class="dm-btn" data-act="close">← 回商品列表</button><span class="sp"></span><button class="dm-btn" data-act="prev" aria-label="上一件">←</button><span class="dm-count"></span><button class="dm-btn" data-act="next" aria-label="下一件">→</button></div><div class="dm-cols"><div class="dm-photo"><img alt=""></div><div class="dm-info"></div></div>`}));
const inline=Object.assign(document.createElement("div"),{className:"dm-inline",innerHTML:`<div class="dm-cols"><div class="dm-photo"><img alt=""></div><div>${bar()}<div class="dm-info"></div></div></div>`});
const stage=document.body.appendChild(Object.assign(document.createElement("div"),{className:"dm-stage",innerHTML:`<div class="dm-bar"><span class="dm-count"></span><span class="sp"></span><button class="dm-btn" data-act="close">✕ 關閉</button></div><button class="dm-arrow prev" data-act="prev" aria-label="上一件">‹</button><button class="dm-arrow next" data-act="next" aria-label="下一件">›</button><div class="dm-photo"><img alt=""></div><div class="dm-sheet"><button class="dm-peek" data-act="sheet"><span class="t"><span class="n"></span><span class="s"></span></span><span class="more">看詳細 ↑</span></button><div class="dm-quick"></div><div class="dm-info"></div></div>`}));
const HOSTS={drawer,page,inline,stage};
function fill(host,p,i){
  const img=host.querySelector(".dm-photo img");
  img.src=photoOf(p);img.alt=photoAlt(p,meta.catalog);
  host.querySelector(".dm-info").innerHTML=infoHtml(p);
  host.querySelectorAll(".dm-count").forEach(c=>c.textContent=`${i+1} / ${items.length}`);
}
function close(){
  current=-1;
  cards.forEach(c=>c.classList.remove("is-open"));
  [scrim,drawer,page,stage].forEach(e=>e.classList.remove("on"));
  stage.querySelector(".dm-sheet").classList.remove("open");
  inline.remove();
  document.body.classList.remove("dm-lock");
}
function open(i,{keepScroll=false}={}){
  i=(i+items.length)%items.length;
  const p=items[i],host=HOSTS[mode];
  current=i;
  cards.forEach((c,k)=>c.classList.toggle("is-open",k===i));
  if(mode==="stage"){
    const img=stage.querySelector(".dm-photo img");
    img.classList.add("swap");
    setTimeout(()=>{fill(stage,p,i);img.classList.remove("swap")},stage.classList.contains("on")?180:0);
    stage.querySelector(".n").textContent=p.name||"";
    stage.querySelector(".s").textContent=getSizeSummary(p);
    stage.querySelector(".dm-quick").innerHTML=lineInquireBtnHtml(lineInquireUrl(meta.contact?.line,p,{productUrl:SITE_ORIGIN+productPath(p.id)}));
  }else fill(host,p,i);
  if(mode==="inline"){
    // 放在這張卡片那一排的最後一張後面，小三角對準點的那張
    const card=cards[i],top=card.offsetTop;
    let last=card;
    for(const c of cards.slice(i+1)){if(c.offsetTop!==top)break;last=c}
    inline.remove();
    last.after(inline);
    inline.style.setProperty("--notch",`${card.offsetLeft-grid.offsetLeft+card.offsetWidth/2}px`);
    if(!keepScroll)card.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  document.body.classList.add("dm-lock");
  host.classList.add("on");
  if(mode==="drawer"){scrim.classList.add("on");drawer.querySelector(".dm-body").scrollTop=0}
  if(mode==="page")page.scrollTop=0;
}
function setMode(next){
  close();
  mode=next;
  document.querySelectorAll(".dm-modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("#dmNote").textContent=MODES[mode].note;
}
document.querySelectorAll(".dm-modes button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
cards.forEach((card,i)=>card.addEventListener("click",e=>{e.preventDefault();if(mode==="inline"&&current===i)close();else open(i)}));
scrim.addEventListener("click",close);
document.addEventListener("click",e=>{
  const act=e.target.closest?.("[data-act]")?.dataset.act;
  if(!act)return;
  if(act==="close")close();
  else if(act==="prev")open(current-1,{keepScroll:false});
  else if(act==="next")open(current+1,{keepScroll:false});
  else if(act==="sheet"){const s=stage.querySelector(".dm-sheet");s.classList.toggle("open");s.querySelector(".more").textContent=s.classList.contains("open")?"收起 ↓":"看詳細 ↑";s.scrollTop=0}
});
document.addEventListener("keydown",e=>{
  if(current<0)return;
  if(e.key==="Escape")close();
  else if(e.key==="ArrowLeft")open(current-1);
  else if(e.key==="ArrowRight")open(current+1);
});
// 照片優先：左右滑換商品
let sx=null;
const sp=stage.querySelector(".dm-photo");
sp.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
sp.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)open(current+(dx<0?1:-1))});
setMode("drawer");
</script>
</body>
</html>
